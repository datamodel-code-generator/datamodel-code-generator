[tox]
requires =
    tox>=4.24.1
    tox-uv>=1.23
env_list =
    fix
    py314-parallel
    py313-parallel
    py312-parallel
    py312-blacklatest-parallel
    py312-black{24, 23, 22}-parallel
    py312-isort{8, 7, 6, 5}-parallel
    py311-parallel
    py310-parallel
    readme
    preset-docs
    cli-docs
    coverage
    pkg_meta
skip_missing_interpreters = true

[testenv]
runner = uv-venv-lock-runner
description = run the unit tests with pytest under {base_python}
package = wheel
wheel_build_env = .pkg
extras =
    all
pass_env =
    DIFF_AGAINST
    HTTP_IGNORE_TLS
    PYTEST_*
set_env =
    COVERAGE_FILE = {work_dir}/.coverage.{env_name}
    UV_CACHE_DIR = {work_dir}{/}uv-cache
    blacklatest: DATAMODEL_CODE_GENERATOR_CHECK_BUILTIN_FORMATTER_PARITY = 1
commands =
    pytest {posargs: \
      !parallel: -n0 \
      parallel: -n auto \
      parallel: --dist=worksteal \
      --color=yes \
      -m "not perf" \
      !nocov: --cov {env_site_packages_dir}{/}datamodel_code_generator --cov {tox_root}{/}tests \
      !nocov: --cov scripts.prepare_release_draft_analysis --cov scripts.ci_coverage --cov scripts.select_ci_test_shard \
      !nocov: --cov scripts.report_release_analysis_failure \
      !nocov: --cov-config=pyproject.toml --cov-fail-under=0 --no-cov-on-fail --cov-report={env:PYTEST_COVERAGE_REPORT:term-missing:skip-covered} \
      tests}
dependency_groups =
    test
    blacklatest: blacklatest
    black24: black24
    black23: black23
    black22: black22
    isort8: isort8
    isort7: isort7
    isort6: isort6
    isort5: isort5

[testenv:fix]
description = format the code base to adhere to our styles, and complain about what we cannot do automatically
commands =
    prek run --all-files --show-diff-on-failure
dependency_groups = fix

[testenv:readme]
description = Check help in readme is up to date
commands =
    python scripts/update_command_help_on_markdown.py {posargs:--check}
dependency_groups =
no_default_groups = true

[testenv:preset-docs]
description = Build preset documentation and generated quick-start examples (use --check to validate only)
commands =
    python scripts/build_preset_docs.py {posargs}
dependency_groups = test
no_default_groups = true

[testenv:cli-docs]
description = Build CLI documentation (use --check to validate only)
commands =
    pytest tests --collect-cli-docs -p no:xdist -q
    python scripts/build_cli_docs.py {posargs}
dependency_groups = test
no_default_groups = true

[testenv:coverage]
description = combine coverage files and generate diff (against DIFF_AGAINST defaulting to origin/main)
skip_install = true
extras =
parallel_show_output = true
pass_env =
    DIFF_AGAINST
set_env =
    COVERAGE_FILE = {work_dir}/.coverage
    UV_CACHE_DIR = {work_dir}{/}uv-cache
commands =
    coverage combine
    coverage xml -o {work_dir}/coverage.xml
    coverage html -d {work_dir}/htmlcov
    diff-cover --compare-branch {env:DIFF_AGAINST:origin/main} {work_dir}/coverage.xml
    coverage report --fail-under=100 --skip-covered --show-missing
depends =
    py314-parallel
    py313-parallel
    py312-parallel
    py312-blacklatest-parallel
    py312-black{24, 23, 22}-parallel
    py312-isort{8, 7, 6, 5}-parallel
    py311-parallel
    py310-parallel
    pydantic213
    pydantic200
    pydantic25
    pydantic20
dependency_groups = coverage

[testenv:pkg_meta]
description = check that the long description is valid
skip_install = true
commands =
    uv build --sdist --wheel --out-dir {env_tmp_dir} .
    python scripts/check_sdist_test_support.py {env_tmp_dir}
    twine check {env_tmp_dir}{/}*
    check-wheel-contents --no-config {env_tmp_dir}
dependency_groups = pkg-meta

[testenv:py{310,311,312,313,314}{,-nocov}-parallel]
set_env =
    {[testenv]set_env}
    DATAMODEL_CODE_GENERATOR_TEST_DEFAULT_FORMATTER = builtin

[testenv:py312-{blacklatest,black24,black23,black22,isort8,isort7,isort6,isort5}{,-nocov}-parallel]

[testenv:http-backend-e2e]
base_python = python3.13
commands =
    pytest -n0 --color=yes -m "not perf" \
      nocov: --no-cov \
      !nocov: --cov {env_site_packages_dir}{/}datamodel_code_generator --cov {tox_root}{/}tests \
      !nocov: --cov-config=pyproject.toml --cov-fail-under=0 --no-cov-on-fail --cov-report={env:PYTEST_COVERAGE_REPORT:term-missing:skip-covered} \
      tests/test_http.py tests/test_http_https.py

[testenv:httpx-e2e]
description = run real HTTP and HTTPS e2e tests with the stable HTTPX backend
base_python = {[testenv:http-backend-e2e]base_python}
extras =
    http
set_env =
    {[testenv]set_env}
    DATAMODEL_CODE_GENERATOR_EXPECTED_HTTP_BACKEND = httpx
commands =
    {[testenv:http-backend-e2e]commands}

[testenv:httpx2-min-e2e]
runner = uv-venv-runner
description = run real HTTP and HTTPS e2e tests with the minimum supported HTTPX2 on Python 3.10
base_python = python3.10
deps =
    httpx2==2
extras =
set_env =
    {[testenv]set_env}
    DATAMODEL_CODE_GENERATOR_EXPECTED_HTTP_BACKEND = httpx2
    DATAMODEL_CODE_GENERATOR_TEST_HTTP_BACKEND = httpx2
commands =
    {[testenv:http-backend-e2e]commands}

[testenv:httpx2-max-nocov-e2e]
runner = uv-venv-runner
description = run real HTTP and HTTPS e2e tests with the latest supported HTTPX2 on Python 3.14
base_python = python3.14
deps =
    httpx2<3,>=2
extras =
set_env =
    {[testenv]set_env}
    DATAMODEL_CODE_GENERATOR_EXPECTED_HTTP_BACKEND = httpx2
commands =
    {[testenv:http-backend-e2e]commands}

[testenv:httpx-both-nocov-e2e]
runner = uv-venv-runner
description = verify explicit HTTPX2 selection with real HTTP and HTTPS when both backends are installed
base_python = python3.13
deps =
    httpx2<3,>=2
extras =
    http
set_env =
    {[testenv]set_env}
    DATAMODEL_CODE_GENERATOR_EXPECTED_AUTO_HTTP_BACKEND = httpx
    DATAMODEL_CODE_GENERATOR_EXPECTED_HTTP_BACKEND = httpx2
    DATAMODEL_CODE_GENERATOR_TEST_HTTP_BACKEND = httpx2
commands =
    {[testenv:http-backend-e2e]commands}

[testenv:w3c-xmlschema-e2e]
description = run XML Schema generation against the W3C XML Schema Test Suite
commands =
    python scripts/run_w3c_xmlschema_e2e.py {posargs}

[testenv:jsonschema-suite-conformance]
description = run generated model validation against JSON-Schema-Test-Suite
pass_env =
    DCG_JSON_SCHEMA_SUITE_DRAFTS
commands =
    python scripts/run_jsonschema_suite_conformance.py {posargs}

[testenv:asyncapi-spec-json-schemas-e2e]
description = run JSON Schema generation against the AsyncAPI spec JSON Schemas
commands =
    python scripts/run_asyncapi_spec_json_schemas_e2e.py {posargs}

[testenv:apache-avro-schema-pass-e2e]
description = run Avro generation against the Apache Avro C schema pass corpus
commands =
    python scripts/run_apache_avro_schema_pass_e2e.py {posargs}

[testenv:protobuf-official-e2e]
description = run Protocol Buffers generation against the official protobuf corpus
commands =
    python scripts/run_protobuf_official_e2e.py {posargs}

[testenv:schema-docs]
description = Build schema feature documentation (use --check to validate only)
commands =
    python scripts/build_schema_docs.py {posargs}
dependency_groups =
no_default_groups = true

[testenv:docs-examples]
description = Build tested documentation examples (use --check to validate only)
commands =
    python scripts/build_docs_examples.py {posargs}
dependency_groups =
no_default_groups = true

[testenv:deprecation-docs]
description = Build deprecation documentation (use --check to validate only)
commands =
    python scripts/build_deprecation_docs.py {posargs}
dependency_groups =
no_default_groups = true

[testenv:experimental-docs]
description = Build experimental feature documentation (use --check to validate only)
commands =
    python scripts/build_experimental_docs.py {posargs}
dependency_groups =
no_default_groups = true

[testenv:conformance-docs]
description = Build conformance dashboard documentation (use --check to validate only)
commands =
    python scripts/build_conformance_docs.py {posargs}
dependency_groups =
no_default_groups = true

[testenv:release-benchmark-docs]
description = Build release benchmark documentation shell (use --check to validate only)
base_python = python3.14
commands =
    python scripts/build_release_benchmark_docs.py {posargs}
dependency_groups =
no_default_groups = true

[testenv:llms-txt]
description = Generate llms.txt files (use --check to validate only, requires Python 3.11+)
commands =
    python scripts/build_llms_txt.py {posargs}
dependency_groups =
no_default_groups = true

[testenv:diagrams]
description = Render Mermaid diagrams to committed SVGs (use --check to validate staleness; rendering requires Node.js/npx)
commands =
    python scripts/build_diagrams.py {posargs}
dependency_groups =
no_default_groups = true

[testenv:generated-docs]
description = Update all generated documentation and prompt snapshots
base_python = python3.14
set_env =
    {[testenv]set_env}
    PYTHONPATH = {tox_root}{/}src
commands =
    python scripts/update_command_help_on_markdown.py
    pytest tests --collect-cli-docs -p no:xdist -q
    python scripts/build_cli_docs.py
    python scripts/build_datamodel_codegen_skill_docs.py
    python scripts/build_prompt_data.py
    python scripts/update_generate_prompt_snapshots.py
    python scripts/build_preset_docs.py
    python scripts/build_schema_docs.py
    python scripts/build_docs_examples.py
    python scripts/build_deprecation_docs.py
    python scripts/build_experimental_docs.py
    python scripts/build_conformance_docs.py
    python scripts/build_architecture_docs.py
    python scripts/build_release_benchmark_docs.py
    python scripts/build_llms_txt.py
    python scripts/check_overview_sync.py
    pytest \
      tests/test_main_kr.py::test_generate_prompt_basic \
      tests/test_main_kr.py::test_generate_prompt_with_question \
      tests/test_main_kr.py::test_generate_prompt_with_options \
      tests/test_main_kr.py::test_generate_prompt_with_list_options \
      -p no:xdist \
      -q
dependency_groups = test

[testenv:generated-docs-check]
description = Validate generated documentation and prompt snapshots without modifying files
base_python = python3.14
set_env =
    {[testenv]set_env}
    PYTHONPATH = {tox_root}{/}src
commands =
    python scripts/update_command_help_on_markdown.py {posargs:--check}
    pytest tests --collect-cli-docs -p no:xdist -q
    python scripts/build_cli_docs.py {posargs:--check}
    python scripts/build_datamodel_codegen_skill_docs.py {posargs:--check}
    python scripts/build_prompt_data.py {posargs:--check}
    python scripts/update_generate_prompt_snapshots.py {posargs:--check}
    python scripts/build_preset_docs.py {posargs:--check}
    python scripts/build_schema_docs.py {posargs:--check}
    python scripts/build_docs_examples.py {posargs:--check}
    python scripts/build_deprecation_docs.py {posargs:--check}
    python scripts/build_experimental_docs.py {posargs:--check}
    python scripts/build_conformance_docs.py {posargs:--check}
    python scripts/build_architecture_docs.py {posargs:--check}
    python scripts/build_release_benchmark_docs.py {posargs:--check}
    python scripts/build_llms_txt.py {posargs:--check}
    python scripts/check_overview_sync.py
    pytest \
      tests/test_main_kr.py::test_generate_prompt_basic \
      tests/test_main_kr.py::test_generate_prompt_with_question \
      tests/test_main_kr.py::test_generate_prompt_with_options \
      tests/test_main_kr.py::test_generate_prompt_with_list_options \
      -p no:xdist \
      -q
dependency_groups = test

[testenv:docs-check-all]
description = Validate generated docs, rendered diagrams, and playground asset lint
base_python = {[testenv:generated-docs-check]base_python}
set_env =
    {[testenv:generated-docs-check]set_env}
commands =
    {[testenv:generated-docs-check]commands}
    python scripts/build_diagrams.py {posargs:--check}
    python scripts/build_playground_assets.py
    t-linter check --error-on-issues docs/assets/playground/app.py
    t-linter format --check docs/assets/playground/app.py
dependency_groups =
    test
    playground

[testenv:config-types]
description = Generate TypedDict files from config models (use --check to validate only)
commands =
    datamodel-codegen --profile generate-config-dict {posargs}
    datamodel-codegen --profile parser-config-dicts {posargs}
    datamodel-codegen --profile parse-config-dict {posargs}
dependency_groups = dev
no_default_groups = true

[testenv:type]
description = run type check on code base
commands =
    ty check src --error unused-ignore-comment --error redundant-cast --error possibly-missing-attribute
dependency_groups = type

[testenv:docs]
description = generate documentation
base_python = python3.14
extras =
commands =
    python scripts/build_playground_assets.py
    zensical build
    python -c 'print("Documentation generated at file://{tox_root}{/}site{/}index.html")'
dependency_groups =
    docs
    playground

[testenv:playground-lint]
description = build and lint the browser playground t-string UI
base_python = python3.14
extras =
commands =
    python scripts/build_playground_assets.py
    t-linter check --error-on-issues docs/assets/playground/app.py
    t-linter format --check docs/assets/playground/app.py
dependency_groups = playground

[testenv:playground-format]
description = format the browser playground t-string UI
base_python = python3.14
extras =
commands =
    python scripts/build_playground_assets.py
    t-linter check --error-on-issues docs/assets/playground/app.py
    t-linter format docs/assets/playground/app.py
dependency_groups = playground

[testenv:dev]
description = generate a DEV environment
package = editable
extras =
    all
commands =
    uv pip tree
    python -c 'import sys; print(sys.executable)'
dependency_groups = dev

[testenv:migration-{legacy,boundary}]
runner = uv-venv-runner
description = verify migration notices using real dependencies around the proposed future floors
base_python = python3.11
deps =
    boundary: black==24.3
    boundary: isort==6
    boundary: pydantic==2.8.2
    legacy: black==24.2
    legacy: isort==5.13.2
    legacy: pydantic==2.8.1
commands =
    pytest --color=yes -q \
      --cov {env_site_packages_dir}{/}datamodel_code_generator --cov {tox_root}{/}tests \
      --cov-config=pyproject.toml --cov-fail-under=0 --no-cov-on-fail \
      --cov-report xml:{env:COVERAGE_XML:{work_dir}{/}coverage.{env_name}.xml} \
      --junitxml {work_dir}{/}junit.{env_name}.xml \
      tests/main/test_migration_warnings.py {posargs}
dependency_groups = test

[testenv:pydantic200]
runner = uv-venv-runner
description = exercise numeric and null regressions against the declared Pydantic 2.0.0 minimum
base_python = python3.10
deps =
    pydantic==2
commands =
    pytest --color=yes -q \
      --cov {env_site_packages_dir}{/}datamodel_code_generator --cov {tox_root}{/}tests \
      --cov-config=pyproject.toml --cov-fail-under=0 --no-cov-on-fail \
      --cov-report xml:{env:COVERAGE_XML:{work_dir}{/}coverage.{env_name}.xml} \
      --junitxml {work_dir}{/}junit.{env_name}.xml \
      tests/main/jsonschema tests/test_input_model.py -k "numeric_constraint_precision or root_alias_constraints or root_alias_custom_template_constraints or root_alias_null_constraints or numeric_allof or numeric_null_custom_template or allof_root_regressions or (pattern_string_adapters and inherited) or (allof_ref_siblings and enum_null) or (definition_collisions and not roots) or (equal_schema_identity and reuse-all) or python_generic or nested_family_python_types or (compound_property_name_generation and unsupported_allof and not dynamic) or (compound_property_names_compatibility and (allof_custom_template or allof_branch_title or allof_frozen or nonstring_lookbehind or allof_collapsed or allof_type_alias or allof_field_constraints or allof_lookbehind_field_constraints)) or explicit_alias_names_namespace_prefix"
dependency_groups = test

