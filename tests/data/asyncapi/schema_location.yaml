asyncapi: 3.0.0
info:
  title: Schema locations
  version: "1"
channels:
  user/signup:
    address: user/signup
    messages:
      userSignedUp:
        headers:
          type: object
          properties:
            trace:
              type: string
        payload:
          type: object
          properties:
            address:
              type: object
              properties:
                street:
                  type: string
            tags:
              type: array
              items:
                type: object
                properties:
                  label:
                    type: string
  audit/events:
    address: audit/events
    messages:
      auditEvent:
        payload:
          schemaFormat: application/vnd.apache.avro+yaml;version=1.9.0
          schema:
            type: record
            name: AuditEvent
            fields:
              - name: eventId
                type: string
              - name: severity
                type: int
components:
  schemas:
    Anything: true
    Profile:
      type: object
      properties:
        settings:
          type: object
          properties:
            theme:
              type: string
