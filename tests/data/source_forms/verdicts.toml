# The verdict of every rule that reads Python through scripts/_source_model.py on each form of the questions it asks
# (tests/test_source_model.py RULES): "no finding: <reason>", or "finding: <rule> <site> <site>; <rule> <site>", which
# lists each finding once by the rule (or part of the rule) that reports it and its site: a line, <module>:<line> in a
# package form, each after the folder a rule places the form in when it uses several (src:12), or what the rule reports
# instead of a line (the modules of an import cycle, the test that runs a check).
# A form without a verdict, or a verdict for a form the rule does not read, fails test_every_rule_states_its_verdicts.

