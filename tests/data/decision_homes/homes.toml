[homes.sample]
decision = "the sample decision"
core = ["core.py"]
adapters = ["adapter.py:Adapter.read", "pkg/"]

[homes.sample.signatures.read-flag]
kind = "name"
names = ["flag"]
receivers = ["cfg"]
what = "reads the flag of a configuration"
audit = { default = "X-1", "other.py:Other.method" = "X-2" }

[homes.sample.signatures.write-size]
kind = "name"
names = ["size"]
ctx = "store"
what = "writes the size"
audit = "X-3"

[homes.sample.signatures.compute-call]
kind = "call"
names = ["compute"]
keywords = ["mode"]
without = ["fast"]
mentions = ["x"]
what = "computes the value itself"
audit = "X-4"

[homes.sample.signatures.merge-function]
kind = "function"
pattern = "^_merge"
paths = ["other.py", "core.py"]
what = "defines a merge function"
audit = "X-5"

[homes.sample.signatures.null-test]
kind = "compare-in"
values = ["null"]
what = "tests a type list for null"
audit = "X-6"

[homes.sample.signatures.marker-test]
kind = "compare-in"
names = ["MARKER"]
what = "tests a path for the marker itself"
audit = "X-17"

[homes.sample.signatures.limit]
kind = "number"
powers = [63]
literals = [255]
what = "writes the limit itself"
audit = "X-7"

[homes.sample.signatures.keyword-table]
kind = "keyword-set"
keywords = ["a", "b", "c", "d"]
what = "lists the keywords itself"
audit = "X-8"

[homes.sample.signatures.label-table]
kind = "keyword-set"
keywords = ["Label"]
min = 1
dict_values = true
what = "maps names to their labels itself"
audit = "X-14"

[homes.sample.signatures.read-key]
kind = "key"
keys = ["type", "items"]
what = "reads a key of a raw document"
audit = "X-9"

[homes.sample.signatures.spelling]
kind = "literal"
contains = ["seg-"]
what = "spells the segment itself"
audit = "X-10"

[homes.sample.signatures.hand-display]
kind = "display"
brackets = ["(", "["]
what = "joins the items of a display itself"
audit = "X-11"

[homes.sample.signatures.hand-subscript]
kind = "subscript"
names = ["Optional", "dict", "Final"]
what = "writes a type subscript itself"
audit = "X-22"

[homes.sample.signatures.hand-keyword]
kind = "keyword"
what = "spells a keyword argument itself"
audit = "X-15"

[homes.sample.signatures.fold]
kind = "branch"
values = ["upper"]
names = ["lower"]
what = "folds a name by a tested value itself"
audit = "X-12"

[homes.sample.signatures.name-search]
kind = "name-search"
what = "searches for a free name itself"
audit = "X-13"

[homes.sample.signatures.init-test]
kind = "compare-eq"
values = ["__init__.py"]
what = "tests for a package's file itself"
audit = "X-14"

[homes.sample.signatures.dotted-split]
kind = "split-each"
strings = ["."]
what = "splits the dotted names of a path itself"
audit = "X-16"

[homes.sample.signatures.ancestor-walk]
kind = "ancestor-walk"
names = ["exists", "is_dir"]
what = "walks up a path's parents itself"
audit = "X-18"

[homes.sample.signatures.mapping-guard]
kind = "mapping-guard"
names = ["dict"]
what = "reads a value as a mapping itself"
audit = "X-19"

[homes.sample.signatures.dotted-join]
kind = "dotted-join"
strings = ["."]
what = "joins a name below its module itself"
audit = "X-20"

[homes.sample.signatures.prefix-slice]
kind = "prefix-slice"
what = "tests whether a path starts with another itself"
audit = "X-21"

[legacy_rows."legacy-fixture-row"]
home = "sample"
fix = "#12"

[legacy_rows."legacy.fixture-dotted"]
home = "sample"
fix = "G12b"

[legacy_rows."legacy-unplanned-row"]
home = "elsewhere"
fix = "soon"

[legacy_rows."legacy-undocumented-row"]
home = "sample"
fix = "keep"

[legacy_rows."legacy-stale-row"]
home = "sample"
fix = "keep"
