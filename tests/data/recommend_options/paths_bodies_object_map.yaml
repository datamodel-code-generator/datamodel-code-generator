openapi: 3.1.0
info:
  title: Object map bodies
  version: 1.0.0
paths:
  /labels:
    put:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              patternProperties:
                "^label-": {type: string}
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                propertyNames: {pattern: "^id-"}
                additionalProperties: {type: integer}
