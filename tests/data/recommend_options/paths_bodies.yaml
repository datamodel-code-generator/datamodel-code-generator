openapi: 3.1.0
info:
  title: Object bodies typed inline
  version: "1"
paths:
  /pets:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: [object, "null"]
              additionalProperties:
                type: string
      responses:
        "200":
          $ref: "#/components/responses/PetNames"
    put:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: string
      responses:
