asyncapi: 2.6.0
info:
  title: Account events
  version: 1.0.0
channels:
  user/signedup:
    subscribe:
      message:
        $ref: '#/components/messages/UserSignedUp'
  user/updated:
    publish:
      message:
        oneOf:
          - payload:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    id:
                      type: string
          - headers:
              type: object
              properties:
                trace:
                  type: string
            payload:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    email:
                      type: string
components:
  messages:
    UserSignedUp:
      payload:
        $ref: '#/components/schemas/UserSignedUp'
  schemas:
    UserSignedUp:
      type: object
      properties:
        user:
          type: object
          properties:
            id:
              type: string
        source:
          type: string
          enum: [web, mobile]
    UserDeleted:
      type: object
      properties:
        user:
          type: object
          properties:
            id:
              type: string
            reason:
              type: string
