asyncapi: 2.6.0
info:
  title: Account events
  version: 1.0.0
channels:
  user/signedup:
    subscribe:
      message:
        payload:
          $ref: '#/components/schemas/UserSignedUp'
components:
  schemas:
    UserSignedUp:
      type: object
      properties:
        user:
          type: object
          properties:
            id:
              type: string
        source:
          type: string
          enum: [web, mobile]
    UserDeleted:
      type: object
      properties:
        user:
          type: object
          properties:
            id:
              type: string
            reason:
              type: string
