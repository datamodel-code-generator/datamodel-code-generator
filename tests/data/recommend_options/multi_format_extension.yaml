asyncapi: 3.0.0
info:
  title: Extended wrappers
  version: 1.0.0
channels:
  events:
    address: events
    messages:
      Created:
        payload:
          x-owner: events team
          schema:
            type: object
            properties:
              created:
                type: string
                format: date-time
operations: {}
components:
  schemas:
    Event:
      x-owner: events team
      schema:
        type: object
        properties:
          kind:
            type: string
            enum: [a, b]
          when:
            type: string
            format: date-time
          count:
            type: integer
            minimum: 0
            maximum: 5
