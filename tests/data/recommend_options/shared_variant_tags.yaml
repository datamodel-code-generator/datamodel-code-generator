openapi: 3.1.0
info:
  title: Pets Tagged Two Ways
  version: 1.0.0
paths: {}
components:
  schemas:
    Cat:
      type: object
      required: [kind]
      properties:
        kind: {type: string}
        meow: {type: string}
    Dog:
      type: object
      required: [kind]
      properties:
        kind: {type: string}
        bark: {type: string}
    ByName:
      oneOf:
        - $ref: '#/components/schemas/Cat'
        - $ref: '#/components/schemas/Dog'
      discriminator:
        propertyName: kind
    ByKey:
      oneOf:
        - $ref: '#/components/schemas/Cat'
        - $ref: '#/components/schemas/Dog'
      discriminator:
        propertyName: kind
        mapping:
          cat: '#/components/schemas/Cat'
          dog: Dog
