openapi: 3.1.0
info: {title: Server parameters, version: "1.0"}
paths:
  /search:
    get:
      operationId: search
      parameters:
        - {name: session, in: cookie, required: true, schema: {type: string, minLength: 2}}
        - {name: code, in: query, schema: {type: string, pattern: "^[A-Z]+$", default: AB}}
        - {name: filter, in: query, style: deepObject, explode: true, schema: {$ref: "#/components/schemas/Filter"}}
        - {name: ids, in: query, explode: false, schema: {type: array, items: {type: integer}}}
        - {name: X-Ids, in: header, schema: {type: array, items: {type: integer}}}
        - {name: blob, in: query, content: {application/json: {schema: {$ref: "#/components/schemas/Blob"}}}}
        - {name: note, in: query, content: {text/plain: {}}}
      responses:
        "204": {description: Done.}
  /ratios:
    get:
      operationId: getRatios
      parameters:
        - {name: ratios, in: query, required: true, schema: {type: array, items: {type: number}}}
      responses:
        "204": {description: Done.}
  /repeat/{id}/again/{id}:
    get:
      operationId: repeat
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        "204": {description: Done.}
  /notes/{note.id}:
    get:
      operationId: getNote
      parameters:
        - {name: note.id, in: path, required: true, schema: {type: integer}}
      responses:
        "204": {description: Done.}
  /files/{file.name}:
    get:
      operationId: getFile
      parameters:
        - {name: file.name, in: path, required: true, schema: {type: string, pattern: "^[a-z]+\\.txt$"}}
      responses:
        "204": {description: Done.}
  /menü/{item}:
    get:
      operationId: getMenu
      parameters:
        - {name: item, in: path, required: true, schema: {type: string, pattern: "^[a-z]+$"}}
      responses:
        "204": {description: Done.}
  /items/{level}:
    get:
      operationId: getItem
      parameters:
        - {name: level, in: path, required: true, schema: {type: integer, enum: [1, 2]}}
        - {name: mode, in: query, schema: {type: integer, enum: [1, 2]}}
        - {name: ratio, in: query, schema: {type: number, enum: [0.5, 1.5]}}
        - {name: X-Flag, in: header, schema: {type: boolean, const: true}}
        - {name: kind, in: query, schema: {type: string, enum: [a, b]}}
      responses:
        "204": {description: Done.}
components:
  schemas:
    Filter:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: {type: integer, readOnly: true}
        name: {type: string}
    Blob:
      type: object
      additionalProperties: false
      properties:
        a: {type: integer}
