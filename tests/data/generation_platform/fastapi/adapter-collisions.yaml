openapi: 3.1.0
info:
  title: Adapter collisions
  version: "1"
paths:
  /kept:
    get:
      parameters:
        - name: a
          in: query
          schema:
            type: string
        - name: opts
          in: query
          schema:
            type: object
            properties:
              a:
                type: string
      responses:
        "204":
          description: No content.
  /added:
    get:
      parameters:
        - name: tags
          in: cookie
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
        - name: prefs
          in: cookie
          schema:
            type: object
            properties:
              tags:
                type: string
      responses:
        "204":
          description: No content.
  /gone:
    get:
      parameters:
        - name: opts
          in: query
          schema:
            type: object
            properties:
              a:
                type: string
        - name: a
          in: query
          schema:
            type: string
      responses:
        "204":
          description: No content.
