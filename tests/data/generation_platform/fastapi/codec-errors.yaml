openapi: 3.1.0
info: {title: Codec errors, version: "1.0"}
paths:
  /choices:
    get:
      operationId: getChoices
      parameters:
        - {name: choice, in: query, schema: {anyOf: [{type: string}, {type: object}]}}
      responses:
        "204": {description: Done.}
  /enum-arrays:
    get:
      operationId: getEnumArrays
      parameters:
        - {name: q, in: query, required: true, schema: {enum: [[1, 2], [3]]}}
      responses:
        "204": {description: Done.}
  /either:
    get:
      operationId: getEither
      parameters:
        - name: q
          in: query
          style: form
          explode: true
          schema:
            oneOf:
              - {$ref: "#/components/schemas/Counted"}
              - {$ref: "#/components/schemas/Named"}
      responses:
        "204": {description: Done.}
components:
  schemas:
    Counted:
      type: object
      properties:
        value: {type: integer}
    Named:
      type: object
      properties:
        value: {type: string}
