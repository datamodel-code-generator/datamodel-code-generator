openapi: 3.1.0
info: {title: Hooks, version: "1.0"}
paths:
  /subscriptions:
    post:
      operationId: subscribe
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Pet"}
      responses:
        "204": {description: Subscribed.}
      callbacks:
        onEvent:
          "{$request.body#/url}":
            $ref: served-event.yaml
webhooks:
  newEvent:
    $ref: served-event.yaml
  newPet:
    $ref: "served-library.yaml#/components/pathItems/PetEvent"
components:
  schemas:
    Pet:
      oneOf:
        - $ref: "served-library.yaml#/components/schemas/Cat"
        - $ref: "served-library.yaml#/components/schemas/Dog"
      discriminator:
        propertyName: kind
        mapping:
          cat: "served-library.yaml#/components/schemas/Cat"
          dog: "served-library.yaml#/components/schemas/Dog"
    Unused: {type: string}
