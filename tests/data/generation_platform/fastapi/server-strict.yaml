openapi: 3.1.0
info: {title: Server strict parameters, version: "1.0"}
paths:
  /values/{id}:
    get:
      operationId: getValues
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
        - {name: count, in: query, schema: {type: integer}}
        - {name: bounded, in: query, schema: {type: integer, minimum: 0}}
        - {name: score, in: query, schema: {type: number}}
        - {name: flag, in: query, schema: {type: boolean}}
        - {name: name, in: query, schema: {type: string}}
        - {name: label, in: query, schema: {type: string, minLength: 2}}
        - {name: counts, in: query, schema: {type: array, items: {type: integer}}}
        - {name: names, in: query, schema: {type: array, items: {type: string}}}
        - {name: page, in: query, schema: {type: integer, default: 1}}
        - {name: size, in: query, schema: {$ref: "#/components/schemas/Size"}}
        - {name: maybe, in: query, schema: {anyOf: [{type: integer}, {type: "null"}]}}
        - {name: X-Trace, in: header, schema: {type: integer}}
        - {name: X-Tag, in: header, schema: {type: string}}
        - {name: blob, in: query, schema: {type: string, format: binary}}
      responses:
        "204": {description: Done.}
components:
  schemas:
    Size: {type: integer, minimum: 1, default: 10}
