openapi: 3.1.0
info: {title: Resources, version: "1.0"}
paths:
  /pets/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    get:
      operationId: getPet
      responses:
        "200":
          description: The pet.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Pet"}
  /owners/{id}:
    parameters:
      - $ref: "#/paths/~1pets~1{id}/parameters/0"
    get:
      operationId: getOwner
      parameters:
        - name: q
          in: query
          schema: {type: string}
          examples:
            gone: {$ref: "served-missing.yaml#/components/examples/Gone"}
      responses:
        "200":
          description: The owner.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Owner"}
          links:
            pet:
              operationRef: "#/paths/~1pets~1{id}/get"
              parameters: {id: $response.body#/pet}
components:
  schemas:
    Pet:
      $id: https://example.com/pet.json
      type: object
      properties:
        name: {$ref: "#/$defs/Name"}
        owner: {$ref: owner.json}
        tag: {$ref: "#tag"}
      $defs:
        Name: {type: string, maxLength: 20}
        Tag: {$anchor: tag, type: string}
    Owner:
      $id: https://example.com/owner.json
      type: object
      properties:
        node: {$ref: "#/components/schemas/Tree"}
    Tree:
      $dynamicAnchor: node
      type: object
      properties:
        children: {type: array, items: {$ref: "#node"}}
