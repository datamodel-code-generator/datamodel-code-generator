openapi: 3.1.0
info:
  title: Raw text bodies
  version: 1.0.0
servers:
  - url: https://raw.example.com
paths:
  /reports:
    get:
      operationId: downloadReport
      responses:
        '200':
          description: The report as CSV, in whatever bytes it holds.
          content:
            text/csv:
              schema: {type: string, format: binary}
  /notes:
    post:
      operationId: uploadNote
      requestBody:
        required: true
        content:
          text/plain:
            schema: {$ref: '#/components/schemas/Note'}
      responses:
        '200':
          description: The stored note.
          content:
            text/plain:
              schema: {$ref: '#/components/schemas/Note'}
  /drafts:
    post:
      operationId: uploadDraft
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              allOf:
                - {type: string, format: binary}
      responses:
        '200':
          description: The stored draft.
          content:
            text/plain:
              schema:
                anyOf:
                  - {type: string, format: binary}
  /letters:
    post:
      operationId: uploadLetter
      requestBody:
        required: true
        content:
          text/plain:
            schema: {$ref: '#/components/schemas/Letter'}
      responses:
        '200':
          description: The stored letter.
          content:
            text/csv:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/Note'}
  /memos:
    post:
      operationId: uploadMemo
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              allOf:
                - {type: string, format: binary}
                - {maxLength: 16}
      responses:
        '200':
          description: The stored memo, or nothing.
          content:
            text/plain:
              schema:
                anyOf:
                  - {type: string, format: binary}
                  - {type: 'null'}
  /pages:
    post:
      operationId: uploadPage
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              anyOf:
                - {type: string, format: binary}
                - {type: string, format: binary, maxLength: 3}
      responses:
        '200':
          description: The stored page, short or not.
          content:
            text/plain:
              schema:
                anyOf:
                  - {$ref: '#/components/schemas/Note'}
                  - allOf:
                      - {type: string, format: binary}
                      - {maxLength: 3}
components:
  schemas:
    Note: {type: string, format: binary}
    Letter:
      description: A note behind a wrapper.
      allOf:
        - {$ref: '#/components/schemas/Note'}
