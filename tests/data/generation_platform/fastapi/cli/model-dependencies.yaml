openapi: 3.1.0
info:
  title: Contacts
  version: "1"
paths:
  /contacts:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Contact"
      responses:
        "201":
          description: The stored contact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
components:
  schemas:
    EmailStr:
      type: string
      format: email
    Identifier:
      type: string
      format: ulid
    Contact:
      type: object
      required: [id, mail]
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        mail:
          $ref: "#/components/schemas/EmailStr"
        born:
          type: string
          format: date
