[tool.datamodel-codegen]
output-model-type = "pydantic_v2.BaseModel"
openapi-scopes = ["schemas", "api"]
target-python-version = "3.11"
formatters = ["builtin"]
custom-formatters = "tests.data.python.custom_formatters.shift_frozen_time"

[tool.datamodel-codegen.jobs.server]
input = "pets.yaml"
input-file-type = "openapi"
output = "models.py"
generate-server = "fastapi"
server-output = "server"
server-package = "server"
server-model-package = "models"

[tool.datamodel-codegen.jobs.admin]
input = "pets.yaml"
input-file-type = "openapi"
output = "models.py"
generate-server = "fastapi"
server-output = "admin"
server-package = "admin"
server-model-package = "models"
server-handler-mode = "async"
