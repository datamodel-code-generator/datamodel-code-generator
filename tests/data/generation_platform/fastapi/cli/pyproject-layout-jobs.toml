[tool.datamodel-codegen]
output-model-type = "pydantic_v2.BaseModel"
openapi-scopes = ["schemas", "api"]
target-python-version = "3.11"
formatters = ["builtin"]
disable-timestamp = true
input-file-type = "openapi"

[tool.datamodel-codegen.profiles.server]
generate-server = "fastapi"
server-package = "server"
server-model-package = "models"

[tool.datamodel-codegen.jobs.nested]
profile = "server"
input = "pets.yaml"
output = "nested/models.py"
server-output = "nested/server"

[tool.datamodel-codegen.jobs.modular]
profile = "server"
input = "spec/modular.yaml"
output = "modular/models"
server-output = "modular/server"
