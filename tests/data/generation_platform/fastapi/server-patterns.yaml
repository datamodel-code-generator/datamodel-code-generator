openapi: 3.1.0
info: {title: Server patterns that need Python's regex engine, version: "1.0"}
paths:
  /values:
    get:
      operationId: getValues
      parameters:
        - {name: label, in: query, schema: {type: string, pattern: "^(?!x)[a-z]+$"}}
        - {name: codes, in: query, explode: false, schema: {type: array, items: {type: string, pattern: "^(?!x)[a-z]+$"}}}
        - {name: plain, in: query, schema: {type: string, pattern: "^[a-z]+$"}}
      responses:
        "204": {description: Done.}
