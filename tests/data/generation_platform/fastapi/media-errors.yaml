openapi: 3.1.0
info: {title: Media errors, version: "1.0"}
paths:
  /encoded:
    post:
      operationId: postEncoded
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                meta: {type: object, properties: {name: {type: string}}}
            encoding:
              meta: {contentType: application/xml}
      responses:
        "204": {description: Done.}
  /union-parts:
    post:
      operationId: postUnionParts
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              anyOf:
                - {type: object, properties: {a: {type: integer}}}
                - {type: object, properties: {b: {type: string}}}
      responses:
        "204": {description: Done.}
  /encoded-types:
    post:
      operationId: postEncodedTypes
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                meta: {type: object, properties: {name: {type: string}}}
            encoding:
              meta: {contentType: "application/json, application/xml"}
      responses:
        "204": {description: Done.}
  /encoded-quoted:
    post:
      operationId: postEncodedQuoted
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                meta: {type: object, properties: {name: {type: string}}}
            encoding:
              meta: {contentType: 'application/json; a="x,y"'}
      responses:
        "204": {description: Done.}
  /encoded-file:
    post:
      operationId: postEncodedFile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: {type: string, format: binary}
            encoding:
              file: {contentType: application/json}
      responses:
        "204": {description: Done.}
  /encoded-styled:
    post:
      operationId: postEncodedStyled
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                ids: {type: array, items: {type: integer}}
            encoding:
              ids: {style: form, contentType: application/json}
      responses:
        "204": {description: Done.}
  /mixed-encoded:
    post:
      operationId: postMixedEncoded
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, properties: {ids: {type: array, items: {type: integer}}}}
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                ids: {type: array, items: {type: integer}}
            encoding:
              ids: {style: spaceDelimited}
      responses:
        "204": {description: Done.}
  /delimited:
    post:
      operationId: postDelimited
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                ids: {type: array, items: {type: integer}}
            encoding:
              ids: {style: form, explode: false}
      responses:
        "204": {description: Done.}
  /piped:
    post:
      operationId: postPiped
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                ids: {type: array, items: {type: integer}}
            encoding:
              ids: {style: pipeDelimited}
      responses:
        "204": {description: Done.}
  /reserved:
    post:
      operationId: postReserved
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                path: {type: string}
            encoding:
              path: {allowReserved: true}
      responses:
        "204": {description: Done.}
  /typed:
    post:
      operationId: postTyped
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                meta: {type: object, properties: {name: {type: string}}}
            encoding:
              meta: {contentType: application/json}
      responses:
        "204": {description: Done.}
  /parts:
    post:
      operationId: postParts
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                ids: {type: array, items: {type: integer}}
            encoding:
              ids: {style: form, explode: false}
      responses:
        "204": {description: Done.}
  /members:
    post:
      operationId: postMembers
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name: {type: string}
                location: {type: object, properties: {x: {type: integer}}}
                stops: {type: array, items: {type: object, properties: {x: {type: integer}}}}
                level: {type: [integer, boolean]}
      responses:
        "204": {description: Done.}
  /inherited:
    post:
      operationId: postInherited
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              allOf:
                - {$ref: "#/components/schemas/Base"}
                - {type: object, properties: {name: {type: string}}}
      responses:
        "204": {description: Done.}
  /extras:
    post:
      operationId: postExtras
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name: {type: string}
              additionalProperties: {type: object, properties: {x: {type: integer}}}
      responses:
        "204": {description: Done.}
  /extra-lists:
    post:
      operationId: postExtraLists
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name: {type: string}
              additionalProperties: {type: array, items: {type: object, properties: {x: {type: integer}}}}
      responses:
        "204": {description: Done.}
  /extra-kinds:
    post:
      operationId: postExtraKinds
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name: {type: string}
              additionalProperties: {type: [integer, boolean]}
      responses:
        "204": {description: Done.}
  /extra-bases:
    post:
      operationId: postExtraBases
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              allOf:
                - {$ref: "#/components/schemas/Others"}
                - {type: object, properties: {name: {type: string}}}
      responses:
        "204": {description: Done.}
  /extra-patterns:
    post:
      operationId: postExtraPatterns
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name: {type: string}
              patternProperties: {"^x-": {type: string}}
              additionalProperties: {type: object, properties: {x: {type: integer}}}
      responses:
        "204": {description: Done.}
  /form-patterns:
    post:
      operationId: postFormPatterns
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              patternProperties: {"^x-": {type: string}}
      responses:
        "204": {description: Done.}
  /form-shapes:
    post:
      operationId: postFormShapes
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: {type: array, items: {type: string}}
          application/x-www-form-urlencoded; charset=utf-8:
            schema: {type: string}
          application/x-www-form-urlencoded; v=untyped:
            schema:
              properties: {a: {type: string}}
      responses:
        "204": {description: Done.}
  /invalid:
    post:
      operationId: postInvalid
      requestBody:
        content:
          multipart/form data:
            schema: {type: object, properties: {a: {type: string}}}
      responses:
        "200":
          description: Done.
          content:
            application/json; charset:
              schema: {type: string}
  /labelled:
    post:
      operationId: postLabelled
      requestBody:
        content:
          "text/plain; label=\"caf\u00e9\"":
            schema: {type: string}
      responses:
        "200":
          description: Done.
          content:
            "application/json; v=\"\u00e9\"":
              schema: {type: string}
  /spread:
    post:
      operationId: postSpread
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                point: {type: object, properties: {x: {type: integer}}}
            encoding:
              point: {style: form, explode: true}
      responses:
        "204": {description: Done.}
  /spread-parts:
    post:
      operationId: postSpreadParts
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                point: {type: object, properties: {x: {type: integer}}}
            encoding:
              point: {explode: true}
      responses:
        "204": {description: Done.}
  /schemaless:
    post:
      operationId: postSchemaless
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded: {}
      responses:
        "204": {description: Done.}
  /mixed:
    post:
      operationId: postMixed
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
          multipart/form-data:
            schema: {type: object}
      responses:
        "204": {description: Done.}
  /form-response:
    get:
      operationId: getForm
      responses:
        "200":
          description: A form.
          content:
            application/x-www-form-urlencoded:
              schema: {type: object}
components:
  schemas:
    Base:
      type: object
      properties:
        loc: {type: object, properties: {x: {type: integer}}}
    Others:
      type: object
      properties:
        base: {type: string}
      additionalProperties: {type: object, properties: {x: {type: integer}}}
