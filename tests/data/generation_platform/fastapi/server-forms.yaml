openapi: 3.1.0
info: {title: Server forms, version: "1.0"}
paths:
  /forms:
    post:
      operationId: postForm
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string}
                count: {type: integer, default: 1}
                tags: {type: array, items: {type: string}}
            encoding:
              tags: {style: form, explode: true}
      responses:
        "204": {description: Done.}
  /notes:
    post:
      operationId: postNotes
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: {type: object, additionalProperties: {type: string}}
      responses:
        "204": {description: Done.}
  /uploads:
    post:
      operationId: upload
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
                note: {type: string}
      responses:
        "204": {description: Done.}
  /batches:
    post:
      operationId: uploadMany
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files: {type: array, items: {type: string, format: binary}}
                label: {type: string}
      responses:
        "204": {description: Done.}
  /searches:
    post:
      operationId: search
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [filter]
              properties:
                filter: {$ref: "#/components/schemas/Filter"}
                filters: {type: array, items: {$ref: "#/components/schemas/Filter"}}
                tags: {type: array, items: {type: string}}
                file: {type: string, format: binary}
            encoding:
              tags: {contentType: application/json}
      responses:
        "204": {description: Done.}
  /pets:
    post:
      operationId: postPets
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [pet]
              properties:
                pet:
                  oneOf: [{$ref: "#/components/schemas/Cat"}, {$ref: "#/components/schemas/Dog"}]
                  discriminator: {propertyName: kind}
                pets:
                  type: array
                  items:
                    oneOf: [{$ref: "#/components/schemas/Cat"}, {$ref: "#/components/schemas/Dog"}]
                    discriminator: {propertyName: kind}
      responses:
        "204": {description: Done.}
  /extras:
    post:
      operationId: postExtras
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name: {type: string}
                maxAge: {type: integer}
              additionalProperties: {$ref: "#/components/schemas/Filter"}
      responses:
        "204": {description: Done.}
  /extra-lists:
    post:
      operationId: postExtraLists
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name: {type: string}
              additionalProperties: {type: array, items: {$ref: "#/components/schemas/Filter"}}
      responses:
        "204": {description: Done.}
  /extra-scores:
    post:
      operationId: postExtraScores
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name: {type: string}
              additionalProperties: {type: array, items: {type: integer}}
      responses:
        "204": {description: Done.}
  /extra-bases:
    post:
      operationId: postExtraBases
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              allOf:
                - {$ref: "#/components/schemas/Others"}
                - {type: object, properties: {name: {type: string}}}
      responses:
        "204": {description: Done.}
  /extra-patterns:
    post:
      operationId: postExtraPatterns
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name: {type: string}
              patternProperties: {"^x-": {type: string}}
              additionalProperties: {$ref: "#/components/schemas/Filter"}
      responses:
        "204": {description: Done.}
  /extra-profiles:
    post:
      operationId: postExtraProfiles
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name: {type: string}
              additionalProperties: {type: integer}
          application/x-www-form-urlencoded; profile=words:
            schema:
              type: object
              properties:
                count: {type: integer}
              additionalProperties: {type: array, items: {type: string}}
      responses:
        "204": {description: Done.}
  /spreads:
    post:
      operationId: postSpreads
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [filter]
              properties:
                filter: {$ref: "#/components/schemas/Filter"}
                ids: {type: array, items: {type: integer}}
                meta: {$ref: "#/components/schemas/Filter"}
            encoding:
              filter: {explode: true}
              ids: {style: pipeDelimited}
              meta: {contentType: application/json}
      responses:
        "204": {description: Done.}
components:
  schemas:
    Others:
      type: object
      properties:
        base: {type: string}
      additionalProperties: {$ref: "#/components/schemas/Filter"}
    Filter:
      type: object
      properties:
        color: {type: string}
        minAge: {type: integer, minimum: 0}
    Cat:
      type: object
      required: [kind]
      properties:
        kind: {const: cat}
        meows: {type: integer}
    Dog:
      type: object
      required: [kind]
      properties:
        kind: {const: dog}
        barks: {type: integer}
