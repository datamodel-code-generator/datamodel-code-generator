openapi: 3.0.3
info: {title: Server required nullable parameters, version: "1.0"}
paths:
  /items/{id}/{label}:
    get:
      operationId: getItem
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, nullable: true}}
        - {name: label, in: path, required: true, schema: {$ref: "#/components/schemas/Label"}}
        - {name: q, in: query, required: true, schema: {type: string, nullable: true}}
        - {name: kind, in: query, required: true, schema: {$ref: "#/components/schemas/Kind"}}
        - {name: ids, in: query, required: true, schema: {$ref: "#/components/schemas/Ids"}}
        - {name: tags, in: query, required: true, schema: {type: array, nullable: true, items: {type: integer}}}
        - {name: weights, in: query, required: true, style: deepObject, explode: true, schema: {$ref: "#/components/schemas/Weights"}}
        - {name: X-Trace, in: header, required: true, schema: {type: integer, nullable: true}}
        - {name: session, in: cookie, required: true, schema: {type: string, nullable: true}}
        - name: blob
          in: query
          required: true
          content: {application/json: {schema: {type: integer, nullable: true}}}
        - {name: cap, in: query, schema: {type: integer, nullable: true}}
        - {name: mode, in: query, schema: {type: string, nullable: true, default: fast}}
      responses:
        "204": {description: Done.}
components:
  schemas:
    Kind:
      type: string
      nullable: true
      enum: [a, b, null]
    Label:
      type: string
      nullable: true
    Ids:
      type: array
      nullable: true
      items: {type: integer}
    Weights:
      type: object
      nullable: true
      additionalProperties: {type: integer}
