openapi: 3.2.0
info:
  title: Scripted parameters
  version: "1"
paths:
  /items/{item}:
    get:
      parameters:
        - name: item
          in: path
          required: true
          style: simple
          explode: false
          schema:
            $ref: "#/components/schemas/Echo"
        - name: q
          in: query
          style: form
          explode: false
          schema:
            $ref: "#/components/schemas/Echo"
        - name: other
          in: query
          schema:
            type: string
        - name: X-Echo
          in: header
          style: simple
          explode: false
          schema:
            $ref: "#/components/schemas/Echo"
        - name: echo
          in: cookie
          style: form
          explode: false
          schema:
            $ref: "#/components/schemas/Echo"
      responses:
        "204":
          description: No content.
  /search:
    get:
      parameters:
        - name: qs
          in: querystring
          content:
            application/x-www-form-urlencoded:
              schema:
                $ref: "#/components/schemas/Echo"
      responses:
        "200":
          description: Matching items, one JSON object per line.
          content:
            application/jsonl:
              itemSchema:
                $ref: "#/components/schemas/Echo"
components:
  schemas:
    Echo:
      type: object
