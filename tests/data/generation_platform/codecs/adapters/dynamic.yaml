openapi: 3.1.0
info:
  title: Models whose module reads like dynamic bindings
  version: "1"
paths:
  /scopes:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Scope"
      responses:
        "204":
          description: No content.
components:
  schemas:
    Scope:
      type: object
      properties:
        name:
          type: string
