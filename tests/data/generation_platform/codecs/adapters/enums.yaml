openapi: 3.1.0
info:
  title: Enum discriminators and fixed tuples
  version: "1"
paths:
  /cats:
    post:
      parameters:
        - name: pair
          in: query
          explode: false
          schema:
            type: array
            prefixItems:
              - type: string
              - type: string
            items: false
            minItems: 2
            maxItems: 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Cat"
      responses:
        "204":
          description: No content.
components:
  schemas:
    Kind:
      type: string
      enum: [cat, dog]
    Cat:
      type: object
      required: [kind]
      properties:
        kind:
          $ref: "#/components/schemas/Kind"
    Dog:
      type: object
      required: [kind]
      properties:
        kind:
          $ref: "#/components/schemas/Kind"
    Pet:
      oneOf:
        - $ref: "#/components/schemas/Cat"
        - $ref: "#/components/schemas/Dog"
      discriminator:
        propertyName: kind
        mapping:
          cat: "#/components/schemas/Cat"
          dog: "#/components/schemas/Dog"
