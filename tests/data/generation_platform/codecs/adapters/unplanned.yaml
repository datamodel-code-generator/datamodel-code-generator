openapi: 3.1.0
info:
  title: Parameters without a builtin form
  version: "1"
paths:
  /tags:
    get:
      parameters:
        - name: tags
          in: cookie
          style: form
          explode: false
          schema:
            $ref: "#/components/schemas/Tags"
      responses:
        "204":
          description: No content.
  /pairs:
    get:
      parameters:
        - name: pair
          in: query
          explode: false
          schema:
            type: array
            prefixItems:
              - type: string
              - type: string
            items: false
            minItems: 2
            maxItems: 2
      responses:
        "204":
          description: No content.
components:
  schemas:
    Tags:
      type: array
      items:
        type: string
