openapi: 3.1.0
info: {title: Parameters that the builtin codecs encode, version: "1"}
paths:
  /pages:
    get:
      parameters:
        - {name: x-token, in: header, schema: {type: string}}
        - {name: page, in: query, schema: {type: integer}}
        - {name: pager, in: query, schema: {type: object, properties: {size: {type: integer}}, additionalProperties: false}}
      responses:
        "204": {description: none}
  /options:
    get:
      parameters:
        - {name: opts, in: query, schema: {type: object}}
      responses:
        "204": {description: none}
  /more:
    get:
      parameters:
        - {name: more, in: query, schema: {type: object}}
      responses:
        "204": {description: none}
  /headers:
    get:
      parameters:
        - {name: flag, in: header, schema: {enum: [true, false]}}
        - {name: ratio, in: header, schema: {enum: [0.5, 1.5]}}
        - {name: mode, in: header, schema: {enum: [null, a]}}
        - {name: shaped, in: header, schema: {const: {a: 1}}}
        - {name: counts, in: header, explode: true, schema: {type: object, additionalProperties: {type: integer}}}
        - {name: anyMap, in: header, explode: true, schema: {type: object, additionalProperties: {}}}
        - name: plain
          in: header
          content:
            text/plain: {}
      responses:
        "204": {description: none}
  /kinds:
    get:
      parameters:
        - {name: amount, in: header, schema: {type: number, format: decimal}}
        - {name: amounts, in: header, schema: {type: array, items: {type: number, format: decimal}}}
        - {name: scales, in: header, schema: {type: array, items: {type: [integer, number]}}}
        - {name: mixed, in: header, schema: {anyOf: [{type: integer}, {type: string}]}}
        - {name: anything, in: header, schema: {}}
        - {name: noItems, in: header, schema: {type: array}}
        - {name: anyItems, in: header, schema: {type: array, items: true}}
        - {name: loose, in: header, schema: {anyOf: [{type: string}, {minLength: 1}]}}
        - {name: composed, in: header, schema: {allOf: [{$ref: "#/components/schemas/Counts"}]}}
        - {name: only, in: header, schema: {oneOf: [{type: array, items: {type: integer}}]}}
        - {name: maybe, in: header, schema: {type: [array, "null"], items: {type: integer}}}
        - {name: whatever, in: header, schema: true}
        - name: prices
          in: header
          explode: true
          schema:
            type: object
            properties: {net: {type: number, format: decimal}, count: {type: integer}}
            additionalProperties: {type: number, format: decimal}
      responses:
        "204": {description: none}
components:
  schemas:
    Counts: {type: array, items: {type: integer}}
