openapi: 3.2.0
info: {title: Wire plan 3.2 diagnostics, version: "1"}
paths:
  /search:
    get:
      parameters:
        - name: query
          in: querystring
          content:
            application/x-www-form-urlencoded:
              schema: {type: string}
        - {name: prefs, in: cookie, style: form, explode: false, schema: {type: array, items: {type: string}}}
      responses:
        "204": {description: none}
  /alternatives:
    get:
      security:
        - Token: []
        - Lower: []
      responses:
        "204": {description: none}
    post:
      security:
        - Token: []
        - Token: []
          Lower: []
      parameters:
        - {name: X-Trace, in: header, schema: {type: string}}
      responses:
        "204": {description: none}
components:
  securitySchemes:
    Token: {type: apiKey, in: header, name: X-Token}
    Lower: {type: apiKey, in: header, name: x-token}
