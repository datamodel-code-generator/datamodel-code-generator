openapi: 3.2.0
info: {title: Wire plan 3.2, version: "1"}
paths:
  /search:
    get:
      parameters:
        - name: query
          in: querystring
          content:
            application/x-www-form-urlencoded:
              schema:
                type: object
                properties:
                  q: {type: string}
                  tags: {type: array, items: {type: string}}
                  n: {type: integer}
                additionalProperties: false
        - {name: theme, in: cookie, style: cookie, schema: {type: string}}
        - {name: prefs, in: cookie, style: cookie, explode: true, schema: {type: object, properties: {a: {type: string}}, additionalProperties: false}}
      responses:
        "204": {description: none}
  /raw:
    post:
      parameters:
        - name: body
          in: querystring
          content:
            application/json:
              schema: {type: object}
        - name: note
          in: header
          content:
            text/plain:
              schema: {type: string}
      responses:
        "204": {description: none}
