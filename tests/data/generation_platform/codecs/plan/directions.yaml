openapi: 3.1.0
info:
  title: Directions
  version: "1"
paths:
  /items:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Item"
      responses:
        "200":
          description: The stored item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
  /contexts:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContextA"
      responses:
        "201":
          description: The second context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextB"
    put:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContextB"
      responses:
        "204":
          description: Stored.
  /guarded:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Guarded"
      responses:
        "204":
          description: Stored.
components:
  schemas:
    Mode:
      anyOf:
        - $ref: "#/components/schemas/Mode"
        - type: integer
          readOnly: true
    Item:
      type: object
      required: [id, name, token, mode, both]
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
        token:
          type: string
          writeOnly: true
        mode:
          $ref: "#/components/schemas/Mode"
        both:
          type: string
          readOnly: true
          writeOnly: true
        tags:
          type: array
          items:
            type: object
            required: [label, secret]
            properties:
              label:
                type: string
              secret:
                type: string
                writeOnly: true
        pair:
          type: array
          prefixItems:
            - type: object
              required: [key]
              properties:
                key:
                  type: string
                  readOnly: true
          items: false
      patternProperties:
        "^x-":
          type: object
          required: [hidden]
          properties:
            hidden:
              type: string
              writeOnly: true
      dependentRequired:
        name: [id, token]
      dependentSchemas:
        token:
          required: [id]
      if:
        required: [name]
      then:
        required: [id]
      else:
        required: [token]
      not:
        required: [missing]
    Shared:
      required: [key]
    ContextA:
      allOf:
        - $ref: "#/components/schemas/Shared"
        - properties:
            key:
              type: string
              readOnly: true
    ContextB:
      allOf:
        - $ref: "#/components/schemas/Shared"
        - properties:
            key:
              type: string
    Guarded:
      type: object
      required: [name]
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
        note:
          type: string
      not:
        required: [id]
      if:
        required: [id]
      then:
        required: [note]
      allOf:
        - $ref: "#/components/schemas/Stamp"
      anyOf:
        - not:
            $ref: "#/components/schemas/Stamp"
        - type: object
    Stamp:
      required: [id]
      properties:
        id:
          type: integer
          readOnly: true
        parent:
          $ref: "#/components/schemas/Stamp"
