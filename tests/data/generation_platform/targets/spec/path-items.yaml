openapi: 3.1.0
info:
  title: Path items
  version: 1.0.0
paths:
  /pets:
    $ref: "#/components/pathItems/Pets"
  /store:
    get:
      operationId: getStore
      tags: [store]
      responses:
        "204":
          description: Done
components:
  pathItems:
    Pets:
      get:
        operationId: listPets
        tags: [pets]
        responses:
          "200":
            description: Pets
            content:
              application/json:
                schema:
                  type: array
                  items:
                    type: string
    Orphans:
      get:
        operationId: listOrphans
        tags: [orphans]
        responses:
          "204":
            description: Done
