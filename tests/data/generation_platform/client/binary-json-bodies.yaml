openapi: 3.0.3
info:
  title: Binary JSON bodies
  version: 1.0.0
servers:
  - url: https://api.example.com
paths:
  /exports/{name}:
    parameters:
      - {name: name, in: path, required: true, schema: {type: string}}
    get:
      operationId: getExport
      responses:
        '200':
          description: The export, as raw octets of the media type asked for.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/File'}
            image/png:
              schema: {$ref: '#/components/schemas/File'}
    put:
      operationId: putExport
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: string, format: binary}
      responses:
        '204':
          description: Stored.
components:
  schemas:
    File:
      type: string
      format: binary
