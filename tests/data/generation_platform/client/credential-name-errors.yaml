openapi: 3.1.0
info:
  title: Credential argument names
  version: 1.0.0
servers:
  - url: https://api.example.com
paths:
  /named:
    get:
      operationId: named
      security:
        - options: []
        - api-key: []
        - api_key: []
        - '-': []
        - flowless: []
        - implicit_only: []
        - relative: []
      responses:
        '204':
          description: No content
components:
  securitySchemes:
    options:
      type: apiKey
      in: header
      name: X-Options
    api-key:
      type: apiKey
      in: header
      name: X-Key
    api_key:
      type: apiKey
      in: query
      name: key
    '-':
      type: http
      scheme: bearer
    flowless:
      type: oauth2
    implicit_only:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://auth.example.com/authorize
          scopes: {}
    relative:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /token
          scopes: {}
