openapi: 3.1.0
info:
  title: Every operation refused
  version: 1.0.0
servers:
  - url: https://api.example.com
paths:
  /pets/{petId}:
    get:
      operationId: getPet
      responses:
        '200': {description: The pet.}
  /search:
    get:
      operationId: searchPets
      parameters:
        - name: kind
          in: query
          schema:
            oneOf:
              - {type: string}
              - {type: array, items: {type: string}}
      responses:
        '204': {description: Found.}
