schema_version: 1
helpers:
  stripe.event:
    kind: webhook
    event_schema:
      discriminator: {from: body, pointer: /type}
      mapping:
        invoice.paid: {pointer: /components/schemas/Invoice}
        invoice.updated: {pointer: /components/schemas/Invoice}
        customer.created: {pointer: /components/schemas/Customer}
    signature: {kind: adapter, timestamp: required, delivery_id: none}
  adapted.message:
    kind: webhook
    event_schema: {pointer: /components/schemas/Message}
    signature: {kind: adapter, timestamp: required, delivery_id: required}
  adapted.plain:
    kind: webhook
    event_schema: {pointer: /components/schemas/Message}
    duplicates: reject
    signature: {kind: adapter, timestamp: none, delivery_id: none}
  mapped.event:
    kind: webhook
    event_schema:
      discriminator: {from: body, pointer: /type}
      mapping:
        invoice.paid: {pointer: /components/schemas/Invoice}
        customer.created: {pointer: /components/schemas/Customer}
    signature:
      kind: hmac-sha256
      header: X-Signature
      encoding: hex
      prefix: ""
      separator: none
      key_id: none
      timestamp: none
      delivery_id: none
      signed_parts: [raw-body]
  unsigned.event:
    kind: webhook
    event_schema:
      discriminator: {from: body, pointer: /meta/type}
      mapping:
        invoice.paid: {pointer: /components/schemas/Invoice}
        customer.created: {pointer: /components/schemas/Customer}
    signature: {kind: none}
  unsigned.message:
    kind: webhook
    event_schema: {pointer: /webhooks/message/post/requestBody/content/application~1json/schema}
    signature: {kind: none}
