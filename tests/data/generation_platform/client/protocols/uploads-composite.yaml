          in: path
          name: fileId
        value:
          source: initial
          selector:
            from: body
            pointer: /id
      parts:
        in: body
        pointer: /parts
      index_field: index
      receipt_field: receipt
      result_schema:
        pointer: /components/schemas/Stored
    limits:
      max_parts: 10
      max_part_bytes: 4
      min_part_bytes: 3
      last_part_may_be_smaller: true
