          selector:
            from: body
            pointer: /id
      items:
        from: body
        pointer: /parts
      index:
        from: body
        pointer: /index
      receipt:
        from: body
        pointer: /receipt
      digest:
        from: body
        pointer: /digest
    upload_part:
