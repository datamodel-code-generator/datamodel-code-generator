schema_version: 1
helpers:
  users.created:
    kind: cache
    operation: /paths/~1users/post
    validator: etag
    authenticated: false
  users.checked:
    kind: cache
    operation: /paths/~1users~1{userId}/head
    validator: etag
    authenticated: false
  reports.get:
    kind: cache
    operation: /paths/~1reports/get
    validator: etag
    authenticated: false
    statuses: [200, 204]
  users.statuses:
    kind: cache
    operation: /paths/~1users~1{userId}/get
    validator: etag
    authenticated: false
    statuses: [404, 201, 203]
  secure.anonymous:
    kind: cache
    operation: /paths/~1secure~1users~1{userId}/get
    validator: etag
    authenticated: false
  secure.varying:
    kind: cache
    operation: /paths/~1secure~1users~1{userId}/get
    validator: etag
    authenticated: true
    vary_allowlist: [Accept, authorization, Cookie]
  users.tagged:
    kind: cache
    operation: /paths/~1users/get
    validator: etag
    authenticated: false
    tags: ["{fields}", "page:{page}", "{role}", plain]
    mutations:
      refetch:
        operation: /paths/~1users~1{userId}/get
        invalidate_tags: ["user:{userId}"]
      create:
        operation: /paths/~1users/post
        invalidate_tags: ["{userId}"]
  items.ambiguous:
    kind: cache
    operation: /paths/~1items~1{id}/get
    validator: etag
    authenticated: false
    tags: ["item:{id}", "{kinds}"]
