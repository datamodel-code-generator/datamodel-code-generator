schema_version: 1
helpers:
  users.all:
    kind: pagination
    operation: /paths/~1users/get
    items: {from: body, pointer: /data}
    item_schema: {pointer: /components/schemas/User}
    continuation:
      kind: cursor
      read: {from: body, pointer: /next_cursor}
      write: {in: query, name: cursor}
      end: [{kind: "null"}]
      empty_string: end
  users.offsets:
    kind: pagination
    operation: /paths/~1users/get
    items: {from: body, pointer: /data}
    item_schema: {pointer: /components/schemas/User}
    continuation: {kind: offset, write: {in: query, name: offset}, first: 0, step: {literal: 20}, has_more: {from: body, pointer: /has_more}}
  users.pages:
    kind: pagination
    operation: /paths/~1users/get
    items: {from: body, pointer: /data}
    item_schema: {pointer: /components/schemas/User}
    continuation: {kind: page, write: {in: query, name: page}, first: 1, step: {literal: 1}, total: {from: body, pointer: /total}}
  users.follow:
    kind: pagination
    operation: /paths/~1users/get
    items: {from: body, pointer: /data}
    item_schema: {pointer: /components/schemas/User}
    continuation: {kind: next_url, read: {from: body, pointer: /next_url}, end: [{kind: missing}]}
  users.linked:
    kind: pagination
    operation: /paths/~1users/get
    items: {from: body, pointer: /data}
    item_schema: {pointer: /components/schemas/User}
    continuation: {kind: link, header: Link}
  tags.all:
    kind: pagination
    operation: /paths/~1tags/get
    items: {from: body, pointer: /data}
    item_schema: {pointer: /components/schemas/NamePage/properties/data/items}
    continuation:
      kind: cursor
      read: {from: body, pointer: /next_cursor}
      write: {in: query, name: cursor}
      end: [{kind: "null"}]
      empty_string: end
  labels.all:
    kind: pagination
    operation: /paths/~1labels/get
    items: {from: body, pointer: /data}
    item_schema: {pointer: /components/schemas/NamePage/properties/data/items}
    continuation: {kind: link, header: Link}
  jobs.run:
    kind: polling
    create: /paths/~1jobs/post
    accepted_statuses: [202]
    poll: /paths/~1jobs~1{jobId}/get
    bindings:
      - target: {in: path, name: jobId}
        value: {source: initial, selector: {from: body, pointer: /id}}
    state: {from: body, pointer: /status}
    pending: [queued]
    succeeded: [done]
    result: {kind: none}
  events.watch:
    kind: sse
    operation: /paths/~1events/get
    media: text/event-stream
    event_schema: {pointer: /components/schemas/UserEvent}
    completion: {kind: eof}
  records.watch:
    kind: ndjson
    operation: /paths/~1records/get
    media: application/x-ndjson
    event_schema: {pointer: /components/schemas/Record, document: ../helpers-external.yaml}
    completion: {kind: eof}
    final_line: require_newline
  records.off:
    kind: ndjson
    enabled: false
    operation: /paths/~1records/get
    media: application/x-ndjson
    event_schema: {pointer: /components/schemas/Record, document: ../helpers-external.yaml}
    completion: {kind: eof}
    final_line: require_newline
