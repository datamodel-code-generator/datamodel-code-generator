    media: text/event-stream
    event_schema: {discriminator: {from: event_type}, mapping: {done: {pointer: /components/schemas/Created}}}
    completion: {kind: event_type, value: done}
  checks.terminal_error:
    kind: sse
    operation: /paths/~1events/get
    media: text/event-stream
    event_schema: {discriminator: {from: event_type}, mapping: {created: {pointer: /components/schemas/Created}}}
    error_events: {stop: {pointer: /components/schemas/StreamError}}
    completion: {kind: event_type, value: stop}
  checks.envelope:
    {kind: sse, operation: /paths/~1events/get, media: text/event-stream, event_schema: {pointer: /components/schemas/Secret}, completion: {kind: eof}}
  checks.discriminator_absent:
    kind: sse
    operation: /paths/~1events/get
    media: text/event-stream
    event_schema: {discriminator: {from: body, pointer: /kind}, mapping: {created: {pointer: /components/schemas/Created}}}
    completion: {kind: eof}
  checks.discriminator_type:
    kind: sse
    operation: /paths/~1events/get
    media: text/event-stream
    event_schema: {discriminator: {from: body, pointer: /type}, mapping: {counted: {pointer: /components/schemas/Counted}, created: {pointer: /components/schemas/Created}}}
    completion: {kind: eof}
