schema_version: 1
helpers:
  checks.media:
    {kind: sse, operation: /paths/~1events/get, media: text/plain, event_schema: {pointer: /components/schemas/Message}, completion: {kind: eof}}
  checks.response:
    {kind: sse, operation: /paths/~1status/get, media: text/event-stream, event_schema: {pointer: /components/schemas/Message}, completion: {kind: eof}}
  checks.resume:
