schema_version: 1
helpers:
  finds.all:
    kind: pagination
    operation: /paths/~1finds/get
    items: {from: body, pointer: /data}
    item_schema: {pointer: /components/schemas/Item}
    continuation:
      kind: offset
      write: {in: querystring, name: criteria, pointer: /start}
      first: 0
      step: {literal: 2}
      has_more: {from: body, pointer: /has_more}
    bindings:
      - target: {in: querystring, name: criteria, pointer: /term}
        value: {literal: null}
  shelves.walk:
    kind: pagination
    operation: /paths/~1shelves~1{shelf}~1{rack}~1{slot}/get
    items: {from: body, pointer: /data}
    item_schema: {pointer: /components/schemas/Item}
    continuation:
      kind: cursor
      read: {from: body, pointer: /next}
      write: {in: path, name: rack}
      end: [{kind: missing}, {kind: "null"}]
      empty_string: value
    bindings:
      - target: {in: path, name: shelf}
        value: {literal: "."}
      - target: {in: path, name: slot}
        value: {source: previous, selector: {from: body, pointer: /slot}}
  jobs.report:
    kind: polling
    create: /paths/~1jobs/post
    accepted_statuses: [202]
    poll: /paths/~1jobs~1{jobId}/get
    bindings:
      - target: {in: path, name: jobId}
        value: {source: initial, selector: {from: body, pointer: /id}}
    state: {from: body, pointer: /status}
    pending: [queued]
    succeeded: [done]
    result:
      kind: operation
      operation: /paths/~1reports/get
      bindings:
        - target: {in: header, name: X-Tags}
          value: {source: initial, selector: {from: body, pointer: /tags}}
    interval: {seconds: 0.000001}
