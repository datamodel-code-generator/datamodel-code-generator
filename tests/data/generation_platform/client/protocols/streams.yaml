schema_version: 1
helpers:
  events.messages:
    kind: sse
    operation: /paths/~1events/get
    media: text/event-stream
    event_schema: {pointer: /components/schemas/Message}
    completion: {kind: eof}
  events.typed:
    kind: sse
    operation: /paths/~1events/get
    media: text/event-stream
    event_schema:
      discriminator: {from: event_type}
      mapping:
        created: {pointer: /components/schemas/Created}
        deleted: {pointer: /components/schemas/Deleted}
    unknown: raw
    error_events:
      error: {pointer: /components/schemas/StreamError}
    completion: {kind: event_type, value: done}
  events.tagged:
    kind: sse
    operation: /paths/~1events/get
    media: text/event-stream
    event_schema:
      discriminator: {from: body, pointer: /type}
      mapping:
        created: {pointer: /components/schemas/Created}
        deleted: {pointer: /components/schemas/Deleted}
    error_events:
      failed: {pointer: /components/schemas/Failure}
    completion: {kind: sentinel, value: '[DONE]'}
  feed.all:
    kind: sse
    operation: /paths/~1feed/post
    media: text/event-stream
    event_schema: {pointer: /components/schemas/Message}
    completion: {kind: sentinel, value: '[DONE]'}
