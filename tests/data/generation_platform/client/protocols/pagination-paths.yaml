schema_version: 1
helpers:
  reserved.all:
    kind: pagination
    operation: /paths/~1reserved~1{name}/get
    items: {from: body, pointer: /data}
    item_schema: {pointer: /components/schemas/User}
    continuation:
      kind: cursor
      read: {from: body, pointer: /next_cursor}
      write: {in: path, name: name}
      end: [{kind: missing}, {kind: "null"}]
      empty_string: value
  labels.all:
    kind: pagination
    operation: /paths/~1labels~1{name}/get
    items: {from: body, pointer: /data}
    item_schema: {pointer: /components/schemas/User}
    continuation:
      kind: cursor
      read: {from: body, pointer: /next_cursor}
      write: {in: path, name: name}
      end: [{kind: missing}, {kind: "null"}]
      empty_string: value
  files.all:
    kind: pagination
    operation: /paths/~1files~1{name}.json/get
    items: {from: body, pointer: /data}
    item_schema: {pointer: /components/schemas/User}
    continuation:
      kind: cursor
      read: {from: body, pointer: /next_cursor}
      write: {in: path, name: name}
      end: [{kind: missing}, {kind: "null"}]
      empty_string: value
  pairs.all:
    kind: pagination
    operation: /paths/~1pairs~1{owner}{name}/get
    items: {from: body, pointer: /data}
    item_schema: {pointer: /components/schemas/User}
    continuation:
      kind: cursor
      read: {from: body, pointer: /next_cursor}
      write: {in: path, name: name}
      end: [{kind: missing}, {kind: "null"}]
      empty_string: value
  scopes.all:
    kind: pagination
    operation: /paths/~1scopes~1{scope}~1items/get
    items: {from: body, pointer: /data}
    item_schema: {pointer: /components/schemas/User}
    continuation:
      kind: cursor
      read: {from: body, pointer: /next_cursor}
      write: {in: query, name: cursor}
      end: [{kind: missing}, {kind: "null"}]
      empty_string: end
    bindings:
      - target: {in: path, name: scope}
        value: {literal: ..}
  tags.all:
    kind: pagination
    operation: /paths/~1tags~1{tags}/get
    items: {from: body, pointer: /data}
    item_schema: {pointer: /components/schemas/User}
    continuation:
      kind: cursor
      read: {from: body, pointer: /next_cursor}
      write: {in: query, name: cursor}
      end: [{kind: missing}, {kind: "null"}]
      empty_string: end
    bindings:
      - target: {in: path, name: tags}
        value: {source: previous, selector: {from: header, name: X-Tag, occurrence: all}}
