openapi: 3.2.0
info:
  title: Batch operations
  version: 1.0.0
servers:
  - url: https://api.example.com
security:
  - bearer: []
paths:
  /users/batch:
    post:
      operationId: createUsers
      tags: [users]
      parameters:
        - name: dryRun
          in: query
          schema: {type: boolean}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateUsersRequest'}
      responses:
        '200':
          description: One result per user.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreateUsersResponse'}
  /tags/batch:
    put:
      operationId: putTags
      tags: [tags]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: {$ref: '#/components/schemas/Tag'}
      responses:
        '200':
          description: One result per tag, in order.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PutTagsResponse'}
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  schemas:
    NewUser:
      type: object
      required: [id, name]
      properties:
        id: {type: string}
        name: {type: string}
    User:
      type: object
      required: [id, name]
      properties:
        id: {type: string}
        name: {type: string}
        created: {type: boolean}
    ItemError:
      type: object
      required: [code]
      properties:
        code: {type: string}
        message: {type: string}
    CreateUsersRequest:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items: {$ref: '#/components/schemas/NewUser'}
        notify: {type: boolean}
    UserResult:
      type: object
      properties:
        id: {type: string}
        user:
          anyOf:
            - {$ref: '#/components/schemas/User'}
            - {type: 'null'}
        error: {$ref: '#/components/schemas/ItemError'}
    CreateUsersResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: {$ref: '#/components/schemas/UserResult'}
    Tag:
      type: object
      required: [label]
      properties:
        label: {type: string}
        color: {type: string}
    TagResult:
      type: object
      properties:
        color: {type: string}
        tag: {$ref: '#/components/schemas/Tag'}
        error: {$ref: '#/components/schemas/ItemError'}
    PutTagsResponse:
      type: object
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/TagResult'}
