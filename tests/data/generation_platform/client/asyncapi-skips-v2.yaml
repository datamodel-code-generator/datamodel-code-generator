asyncapi: 2.4.0
info:
  title: Skipped AsyncAPI 2 channels
  version: 1.0.0
defaultContentType: application/json
servers:
  socket:
    url: socket.example.com/v2
    protocol: ws
  broker:
    url: kafka.example.com:9092
    protocol: kafka
channels:
  /rooms/{room}:
    servers: [socket]
    parameters:
      room:
        schema:
          type: string
          format: binary
    subscribe:
      message:
        payload:
          type: string
  /feed:
    servers: [socket]
    publish:
      security:
        - token: []
      message:
        payload:
          type: object
    subscribe:
      message:
        oneOf:
          - payload:
              type: object
              properties:
                a:
                  type: string
          - payload:
              type: object
              properties:
                b:
                  type: string
  /avro:
    servers: [socket]
    subscribe:
      message:
        schemaFormat: application/vnd.apache.avro;version=1.9.0
        payload:
          type: record
          name: Reading
          fields:
            - name: value
              type: double
  /empty:
    servers: [socket]
    subscribe:
      message:
        name: heartbeat
  /orders:
    servers: [broker, missing]
    subscribe:
      message:
        payload:
          type: string
  /declared:
    servers: [socket]
    publish: {}
  /notes:
    servers: [socket]
    subscribe:
      message:
        $ref: 'asyncapi-other.yaml#/components/messages/note'
  /:
    subscribe:
      message:
        contentType: text/plain
        payload:
          type: string
  /readings:
    servers: [socket]
    bindings:
      $ref: '#/components/channelBindings/queried'
    subscribe:
      message:
        traits:
          - $ref: '#/components/messageTraits/avro'
        payload:
          type: string
  /guarded:
    servers: [socket]
    subscribe:
      traits:
        - $ref: '#/components/operationTraits/secured'
      message:
        payload:
          type: object
  /delegated:
    servers: [socket]
    subscribe:
      traits:
        - $ref: 'asyncapi-other.yaml#/components/operationTraits/audited'
      message:
        payload:
          type: object
  /packed:
    servers: [socket]
    subscribe:
      message:
        contentType: text/plain
        traits:
          - $ref: '#/components/messageTraits/packed'
        payload:
          type: string
components:
  operationTraits:
    secured:
      security:
        - token: []
  channelBindings:
    queried:
      ws:
        query:
          type: object
  messageTraits:
    packed:
      contentType: application/x-msgpack
    avro:
      schemaFormat: application/vnd.apache.avro;version=1.9.0
  securitySchemes:
    token:
      type: httpApiKey
      in: query
      name: token
