openapi: 3.1.0
info:
  title: Binary form-data members typed by overrides
  version: "1"
servers:
  - url: https://api.example.com
paths:
  /files:
    post:
      operationId: sendFiles
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: "#/components/schemas/Files"}
            encoding:
              notes: {contentType: "text/plain; charset=iso-8859-1"}
      responses:
        "204":
          description: Stored.
  /stamps:
    post:
      operationId: sendStamp
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: "#/components/schemas/Stamp"}
      responses:
        "204":
          description: Stored.
components:
  schemas:
    Files:
      type: object
      required: [file, raw]
      properties:
        file: {type: string, format: binary}
        raw: {type: string, format: binary}
        icon: {type: string, contentMediaType: image/png}
        notes: {type: string, format: binary}
    Stamp:
      type: object
      required: [taken]
      properties:
        taken: {type: string, format: binary}
