openapi: 3.2.0
$self: https://example.com/apis/v1/openapi.yaml
info: {title: Self references, version: "1.0"}
servers: [{url: https://api.example.com}]
paths:
  /pets:
    parameters:
      - {$ref: "https://example.com/apis/v1/openapi.yaml#/components/parameters/Trace"}
    get:
      operationId: listPets
      parameters:
        - {$ref: "https://example.com/apis/v1/openapi.yaml#/components/parameters/Limit"}
      responses:
        "200": {$ref: "https://example.com/apis/v1/openapi.yaml#/components/responses/Pets"}
    post:
      operationId: createPet
      requestBody: {$ref: "https://example.com/apis/v1/openapi.yaml#/components/requestBodies/Pet"}
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Pet"}
  /owners:
    $ref: "https://example.com/apis/v1/openapi.yaml#/components/pathItems/Owners"
components:
  parameters:
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1}}
    Trace: {name: X-Trace, in: header, schema: {type: string}}
  requestBodies:
    Pet:
      required: true
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Pet"}
  responses:
    Pets:
      description: The pets.
      headers:
        X-Total: {$ref: "https://example.com/apis/v1/openapi.yaml#/components/headers/Total"}
      content:
        application/json:
          schema: {type: array, items: {$ref: "#/components/schemas/Pet"}}
  headers:
    Total: {schema: {type: integer}}
  pathItems:
    Owners:
      get:
        operationId: listOwners
        parameters:
          - {$ref: "https://example.com/apis/v1/openapi.yaml#/components/parameters/Limit"}
        responses:
          "200":
            description: The owners.
            content:
              application/json:
                schema: {type: array, items: {type: string}}
  schemas:
    Pet:
      type: object
      required: [id, name]
      properties:
        id: {type: integer}
        name: {type: string}
