openapi: 3.2.0
$self: https://example.com/apis/v1/openapi.yaml
info: {title: References, version: "1.0"}
servers: [{url: https://api.example.com}]
security:
  - bearer_alias: []
paths:
  /pets:
    parameters:
      - {$ref: "https://example.com/apis/v1/openapi.yaml#/components/parameters/Trace"}
    get:
      operationId: listPets
      parameters:
        - {$ref: "https://example.com/apis/v1/openapi.yaml#/components/parameters/Limit"}
        - {$ref: "references-library.yaml#/components/parameters/Page"}
      responses:
        "200": {$ref: "https://example.com/apis/v1/openapi.yaml#/components/responses/Pets"}
    post:
      operationId: createPet
      security:
        - library_key: []
      requestBody: {$ref: "https://example.com/apis/v1/openapi.yaml#/components/requestBodies/Pet"}
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Pet"}
          links:
            pets: {$ref: "https://example.com/apis/v1/openapi.yaml#/components/links/Pets"}
            owners: {$ref: "references-library.yaml#/components/links/Alias"}
      callbacks:
        created: {$ref: "https://example.com/apis/v1/openapi.yaml#/components/callbacks/Created"}
  /owners:
    $ref: "https://example.com/apis/v1/openapi.yaml#/components/pathItems/Owners"
components:
  securitySchemes:
    bearer: {type: http, scheme: bearer}
    bearer_alias: {$ref: "https://example.com/apis/v1/openapi.yaml#/components/securitySchemes/bearer"}
    library_key: {$ref: "references-library.yaml#/components/securitySchemes/alias"}
  parameters:
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1}}
    Trace: {name: X-Trace, in: header, schema: {type: string}}
  requestBodies:
    Pet:
      required: true
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Pet"}
  responses:
    Pets:
      description: The pets.
      headers:
        X-Total: {$ref: "https://example.com/apis/v1/openapi.yaml#/components/headers/Total"}
      content:
        application/json:
          schema: {type: array, items: {$ref: "#/components/schemas/Pet"}}
  headers:
    Total: {schema: {type: integer}}
  links:
    Pets: {operationId: listPets, description: The pets.}
  callbacks:
    Created:
      "{$request.body#/url}":
        post:
          requestBody: {$ref: "https://example.com/apis/v1/openapi.yaml#/components/requestBodies/Pet"}
          responses:
            "204": {description: Received.}
  pathItems:
    Owners:
      get:
        operationId: listOwners
        parameters:
          - {$ref: "https://example.com/apis/v1/openapi.yaml#/components/parameters/Limit"}
        responses:
          "200":
            description: The owners.
            content:
              application/json:
                schema: {type: array, items: {type: string}}
  schemas:
    Pet:
      type: object
      required: [id, name]
      properties:
        id: {type: integer}
        name: {type: string}
