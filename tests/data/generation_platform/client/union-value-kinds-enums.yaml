openapi: 3.1.0
info: {title: Settings, version: "1"}
servers: [{url: "https://api.example.com"}]
paths:
  /settings:
    get:
      operationId: getSettings
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Settings"}
components:
  schemas:
    Settings:
      type: object
      properties:
        verifyDepsBeforeRun:
          oneOf:
            - {type: string, enum: [install, warn, error, prompt]}
            - {type: boolean, enum: [false]}
        ratio:
          anyOf:
            - {enum: [1.5, 2.5]}
            - {type: string}
        level:
          anyOf:
            - {enum: [1, 2]}
            - {type: string}
        mode:
          anyOf:
            - {enum: [fast, null]}
            - {type: integer}
