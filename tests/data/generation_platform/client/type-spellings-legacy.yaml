openapi: 3.1.0
info:
  title: Legacy type spellings
  version: "1"
servers:
  - url: https://spellings.example.com
paths:
  /pets:
    get:
      operationId: listPets
      parameters:
        - name: limit
          in: query
          schema: {$ref: "#/components/schemas/Limit"}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0}
        - name: handle
          in: query
          schema: {type: string, pattern: "^(?!admin)[a-z]+$", maxLength: 20}
        - name: kind
          in: query
          schema: {$ref: "#/components/schemas/Kind"}
        - name: mode
          in: query
          schema: {type: string, enum: [fast]}
        - name: tags
          in: query
          schema:
            type: array
            items: {type: string}
        - name: since
          in: query
          schema: {type: [string, "null"], format: date-time}
      responses:
        "200":
          description: The pets.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Pet"}
        "404":
          description: No pets.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Problem"}
    post:
      operationId: addPets
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items: {$ref: "#/components/schemas/Pet"}
      responses:
        "200":
          description: The stored pets by name.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {$ref: "#/components/schemas/Pet"}
  /jobs:
    post:
      operationId: createJob
      responses:
        "200":
          description: The finished job.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Job"}
        "202":
          description: The job was accepted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Job"}
  /jobs/{jobId}:
    get:
      operationId: getJob
      parameters:
        - name: jobId
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Job"}
components:
  schemas:
    Job:
      type: object
      required: [id, status]
      properties:
        id: {type: string}
        status: {type: string}
        result:
          oneOf:
            - {$ref: "#/components/schemas/Pet"}
            - {$ref: "#/components/schemas/Problem"}
            - {type: "null"}
    Limit:
      type: integer
      minimum: 1
      maximum: 100
    Kind:
      type: string
      enum: [cat, dog]
    Pet:
      type: object
      required: [name]
      properties:
        name: {type: string}
        kind: {$ref: "#/components/schemas/Kind"}
        tags:
          type: array
          items: {type: string}
    Problem:
      type: object
      properties:
        detail: {type: [string, "null"]}
