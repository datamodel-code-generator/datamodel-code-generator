openapi: 3.1.0
info:
  title: Retry contracts
  version: 1.0.0
servers:
  - url: https://api.example.com
paths:
  /safe:
    get:
      operationId: getSafe
      tags: [retry]
      responses:
        '200':
          description: Accepted
          content:
            text/plain:
              schema:
                type: string
        default:
