openapi: 3.1.0
info:
  title: Fingerprint write-only
  version: 1.0.0
servers:
  - url: https://api.example.com
paths:
  /things:
    get:
      operationId: listThings
      parameters:
        - name: offset
          in: query
          schema: {type: integer}
      responses:
        '200':
          description: One page of things, declared inline.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Thing'}
                  has_more: {type: boolean}
                  token: {type: string, writeOnly: true}
                  cursor:
                    allOf:
                      - $ref: '#/components/schemas/Cursor'
components:
  schemas:
    Cursor:
      type: string
      writeOnly: true
    Thing:
      type: object
      properties:
        id: {type: integer}
