asyncapi: 3.0.0
info: {title: Lobby, version: 1.0.0}
servers:
  main: {host: example.com, protocol: wss}
channels:
  room:
    address: room
    messages:
      join:
        payload:
          type: object
          required: [who]
          properties:
            kind: {const: join}
            who: {type: string}
      leave:
        payload:
          type: object
          required: [who]
          properties:
            kind: {const: leave}
            who: {type: string}
operations:
  announce: {action: send, channel: {$ref: '#/channels/room'}}
