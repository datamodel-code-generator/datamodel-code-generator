openapi: 3.1.0
info:
  title: Scoped compatibility
  version: "1"
servers:
  - url: https://api.example.com
paths:
  /local:
    get:
      operationId: getLocal
      responses:
        "200":
          description: A component of the root document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Local"
  /remote:
    get:
      operationId: getRemote
      responses:
        "200":
          description: A component of another document.
          content:
            application/json:
              schema:
                $ref: "compatibility-external.yaml#/components/schemas/Remote"
components:
  schemas:
    Local:
      type: object
      required: [name]
      properties:
        name:
          type: string
