[tool.datamodel-codegen]
output-model-type = "pydantic_v2.BaseModel"
openapi-scopes = ["schemas", "api"]
target-python-version = "3.11"
formatters = ["builtin"]
disable-timestamp = true

[tool.datamodel-codegen.jobs.server]
input = "options.yaml"
input-file-type = "openapi"
output = "models.py"
generate-server = "fastapi"
server-output = "server"
server-package = "server"
server-model-package = "models"

[tool.datamodel-codegen.jobs.client]
input = "options.yaml"
input-file-type = "openapi"
output = "models.py"
generate-client = "httpx2"
client-output = "client"
client-package = "client"
client-model-package = "models"
custom-file-header = "# client"
