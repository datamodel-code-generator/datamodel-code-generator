asyncapi: 3.0.0
info:
  title: Market feed
  version: 1.0.0
servers:
  production:
    host: feed.example.com
    pathname: /ws
    protocol: wss
  sandbox:
    host: '{region}.sandbox.example.com'
    protocol: ws
    variables:
      region:
        default: eu
        enum: [eu, us]
  broker:
    host: kafka.example.com
    protocol: kafka
channels:
  market:
    address: /v1/market/{pair}
    servers:
      - $ref: '#/servers/production'
      - $ref: '#/servers/sandbox'
    parameters:
      pair:
        description: The trading pair.
    messages:
      subscribe:
        $ref: '#/components/messages/subscribe'
      trade:
        $ref: '#/components/messages/trade'
  ticker:
    address: /v1/ticker
    servers:
      - $ref: '#/servers/production'
    messages:
      tick:
        contentType: text/plain
        payload:
          type: string
  audio:
    address: /v1/audio
    servers:
      - $ref: '#/servers/production'
    messages:
      frame:
        contentType: application/octet-stream
        payload:
          type: string
          format: binary
      status:
        payload:
          type: object
          properties:
            level:
              type: integer
          required: [level]
  status:
    address: /v1/status
    messages:
      update:
        payload:
          $ref: '#/components/schemas/Status'
operations:
  onSubscribe:
    action: receive
    channel:
      $ref: '#/channels/market'
    messages:
      - $ref: '#/channels/market/messages/subscribe'
  publishTrade:
    action: send
    channel:
      $ref: '#/channels/market'
    messages:
      - $ref: '#/channels/market/messages/trade'
  publishTick:
    action: send
    channel:
      $ref: '#/channels/ticker'
  onFrame:
    action: receive
    channel:
      $ref: '#/channels/audio'
    messages:
      - $ref: '#/channels/audio/messages/frame'
  publishStatus:
    action: send
    channel:
      $ref: '#/channels/audio'
    messages:
      - $ref: '#/channels/audio/messages/status'
  publishStatusUpdate:
    action: send
    channel:
      $ref: '#/channels/status'
components:
  messages:
    subscribe:
      payload:
        $ref: '#/components/schemas/Subscribe'
    trade:
      contentType: application/json
      payload:
        $ref: '#/components/schemas/Trade'
  schemas:
    Subscribe:
      type: object
      properties:
        event:
          type: string
          const: subscribe
        channels:
          type: array
          items:
            type: string
      required: [event, channels]
    Trade:
      type: object
      properties:
        event:
          type: string
          const: trade
        price:
          type: number
        volume:
          type: number
      required: [event, price]
    Status:
      type: object
      properties:
        state:
          type: string
          enum: [online, maintenance]
      required: [state]
