openapi: 3.0.3
info:
  title: Charges in brackets
  version: 1.0.0
servers:
  - url: https://api.example.com
paths:
  /v1/charges/{charge}:
    get:
      operationId: GetChargesCharge
      tags: [charges]
      parameters:
        - {name: charge, in: path, required: true, schema: {type: string}}
        - name: expand
          in: query
          style: deepObject
          explode: true
          schema:
            type: array
            items: {type: string}
        - name: limit
          in: query
          style: deepObject
          explode: true
          schema: {type: integer}
        - name: created
          in: query
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              gt: {type: integer}
      responses:
        '204':
          description: The charge.
  /v1/customers:
    get:
      operationId: GetCustomers
      tags: [customers]
      parameters:
        - name: expand
          in: query
          style: deepObject
          explode: true
          schema:
            type: array
            items: {type: string}
        - name: ids
          in: query
          style: deepObject
          explode: true
          schema:
            oneOf:
              - {type: string}
              - type: array
                items: {type: string}
      responses:
        '204':
          description: The customers.
    post:
      operationId: PostCustomers
      tags: [customers]
      requestBody:
        content:
          application/x-www-form-urlencoded:
            encoding:
              balance: {style: deepObject, explode: true}
              expand: {style: deepObject, explode: true}
              metadata: {style: deepObject, explode: true}
              tax_rates: {style: deepObject, explode: true}
            schema:
              type: object
              properties:
                balance: {type: integer}
                email: {type: string}
                expand:
                  type: array
                  items: {type: string}
                metadata:
                  type: object
                  additionalProperties: {type: string}
                tax_rates:
                  anyOf:
                    - type: array
                      items: {type: string}
                    - {type: string, enum: ['']}
      responses:
        '204':
          description: The customer.
