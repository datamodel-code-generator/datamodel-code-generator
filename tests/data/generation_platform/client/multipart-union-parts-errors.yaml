openapi: 3.0.3
info:
  title: Form-data bodies of objects that disagree on a property
  version: 1.0.0
servers:
  - url: https://api.example.com
paths:
  /events:
    patch:
      operationId: updateEvents
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              oneOf:
                - type: object
                  properties:
                    method: {type: string}
                    params:
                      type: object
                      properties:
                        room: {type: string}
                - type: object
                  properties:
                    method: {type: string}
                    params: {type: string}
      responses:
        '204':
          description: Updated.
  /counts:
    patch:
      operationId: updateCounts
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              oneOf:
                - type: object
                  properties:
                    count: {type: integer}
                - type: object
                  properties:
                    count: {type: string}
      responses:
        '204':
          description: Updated.
  /notes:
    post:
      operationId: createNote
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              oneOf:
                - {type: string}
                - type: object
                  properties:
                    text: {type: string}
      responses:
        '204':
          description: Created.
  /rooms:
    patch:
      operationId: updateRooms
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              oneOf:
                - type: object
                  properties:
                    params:
                      type: object
                      properties:
                        room: {type: string}
                - type: object
                  properties:
                    params:
                      type: object
                      properties:
                        floor: {type: integer}
      responses:
        '204':
          description: Updated.
  /tags:
    patch:
      operationId: updateTags
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              oneOf:
                - type: object
                  properties:
                    tags: {type: array, items: {type: string}}
                - type: object
                  properties:
                    tags: {type: array, items: {type: string, format: date}}
      responses:
        '204':
          description: Updated.
  /uploads:
    post:
      operationId: createUpload
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              oneOf:
                - type: object
                  properties:
                    note:
                      type: object
                      properties:
                        text: {type: string}
                - type: object
                  properties:
                    note: {type: string}
            encoding:
              note: {contentType: text/plain}
      responses:
        '204':
          description: Created.
  /labels:
    post:
      operationId: createLabel
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              oneOf:
                - $ref: '#/components/schemas/Color'
                - type: object
                  properties:
                    name: {type: string}
      responses:
        '204':
          description: Created.
components:
  schemas:
    Color:
      type: string
      enum: [red, green]
