openapi: 3.0.3
info:
  title: Form-data bodies of objects that disagree on a property
  version: 1.0.0
servers:
  - url: https://api.example.com
paths:
  /events:
    patch:
      operationId: updateEvents
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              oneOf:
                - type: object
                  properties:
                    method: {type: string}
                    params:
                      type: object
                      properties:
                        room: {type: string}
                - type: object
                  properties:
                    method: {type: string}
                    params: {type: string}
      responses:
        '204':
          description: Updated.
  /counts:
    patch:
      operationId: updateCounts
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              oneOf:
                - type: object
                  properties:
                    count: {type: integer}
                - type: object
                  properties:
                    count: {type: string}
      responses:
        '204':
          description: Updated.
  /notes:
    post:
      operationId: createNote
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              oneOf:
                - {type: string}
                - type: object
                  properties:
                    text: {type: string}
      responses:
        '204':
          description: Created.
