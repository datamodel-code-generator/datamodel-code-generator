openapi: 3.1.1
info:
  title: Referenced part items
  version: 1.0.0
servers:
  - url: https://api.example.com
paths:
  /files:
    post:
      operationId: uploadFiles
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files, tags]
              properties:
                files: {$ref: '#/components/schemas/FileList'}
                tags: {$ref: '#/components/schemas/TagList'}
      responses:
        '204':
          description: Uploaded.
components:
  schemas:
    FileList:
      type: array
      items: {type: string, format: binary}
    TagList:
      type: array
      items: {type: integer}
