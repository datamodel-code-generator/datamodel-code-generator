openapi: 3.1.0
info:
  title: Pagination limits
  version: 1.0.0
servers:
  - url: https://api.example.com
paths:
  /codes:
    get:
      operationId: listCodes
      tags: [codes]
      parameters:
        - name: cursor
          in: query
          schema: {type: string, maxLength: 4}
      responses:
        '200':
          description: One page of codes.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CodePage'}
  /users:
    get:
      operationId: listUsers
      tags: [users]
      parameters:
        - name: offset
          in: query
          schema: {$ref: '#/components/schemas/Offset'}
      responses:
        '200':
          description: One page of users.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CodePage'}
components:
  schemas:
    Offset: {type: integer, minimum: 0}
    Code:
      type: object
      required: [id]
      properties:
        id: {type: string}
    CodePage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/Code'}
        next: {type: string}
        has_more: {type: boolean}
