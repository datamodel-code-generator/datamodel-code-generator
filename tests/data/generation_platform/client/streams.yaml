openapi: 3.1.0
info:
  title: Streams
  version: 1.0.0
servers:
  - url: https://api.example.com
paths:
  /events:
    get:
      operationId: streamEvents
      tags: [events]
      parameters:
        - name: topic
          in: query
          schema: {type: string}
        - name: Last-Event-ID
          in: header
          schema: {type: string}
      responses:
        '200':
          description: The events of a topic.
          content:
            text/event-stream:
              schema: {type: string}
        '204':
          description: The topic has no events.
        '404':
          description: The topic does not exist.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Problem'}
  /feed:
    post:
      operationId: streamFeed
      tags: [feed]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FeedQuery'}
      responses:
        '200':
          description: The feed's messages.
          content:
            text/event-stream:
              schema: {type: string}
  /status:
    get:
      operationId: getStatus
      tags: [status]
      responses:
        '200':
          description: The service's status.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Message'}
components:
  schemas:
    Message:
      type: object
      required: [text]
      properties:
        text: {type: string}
    Created:
      type: object
      required: [type, id]
      properties:
        type: {type: string}
        id: {type: string}
    Deleted:
      type: object
      required: [type, id]
      properties:
        type: {type: string, const: deleted}
        id: {type: string}
    Failure:
      type: object
      required: [type, message]
      properties:
        type: {type: string}
        message: {type: string}
    StreamError:
      type: object
      required: [message]
      properties:
        message: {type: string}
    Problem:
      type: object
      properties:
        detail: {type: string}
    FeedQuery:
      type: object
      properties:
        topic: {type: string}
    Counted:
      type: object
      required: [type]
      properties:
        type: {type: integer}
    Secret:
      type: object
      required: [id, token]
      properties:
        id: {type: string}
        token: {type: string, writeOnly: true}
