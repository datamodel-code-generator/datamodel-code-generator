openapi: 3.1.0
info: {title: Form members declared by boolean schemas, version: "1"}
servers: [{url: "https://example.com"}]
paths:
  /boxes:
    post:
      operationId: sendBox
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: '#/components/schemas/Box'}
            encoding:
              free: {contentType: text/plain}
      responses:
        "200":
          description: sent
          content:
            multipart/form-data:
              schema: {$ref: '#/components/schemas/Box'}
  /crates:
    post:
      operationId: sendCrate
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: {$ref: '#/components/schemas/Crate'}
      responses:
        "200":
          description: sent
          content:
            multipart/form-data:
              schema: {$ref: '#/components/schemas/Crate'}
components:
  schemas:
    Box:
      type: object
      properties:
        free: true
        size: {type: integer}
      additionalProperties: {type: integer}
    Crate:
      type: object
      allOf:
        - $ref: '#/components/schemas/Box'
        - type: object
          properties:
            open: true
      properties:
        label: {type: string}
