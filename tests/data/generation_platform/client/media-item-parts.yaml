openapi: 3.2.0
info:
  title: Item parts
  version: 1.0.0
servers:
  - url: https://api.example.com
paths:
  /parts:
    post:
      operationId: sendParts
      requestBody:
        required: true
        content:
          multipart/form-data:
            itemSchema:
              type: object
              properties:
                name: {type: string}
              additionalProperties: false
      responses:
        '200':
          description: Parts back.
          content:
            multipart/form-data:
              itemSchema:
                type: object
                properties:
                  name: {type: string}
                additionalProperties: false
