asyncapi: 3.0.0
info:
  title: Ticker stream
  version: 1.0.0
servers:
  live:
    host: ticker.example.com
    protocol: wss
channels:
  ticks:
    address: /ticks
    bindings:
      ws:
        query:
          type: object
          properties:
            token:
              $ref: '#/components/schemas/Token'
            alias:
              $ref: '#/components/schemas/TokenAlias'
            beside:
              $ref: '#/components/schemas/TokenAlias'
              default: near
        headers:
          type: object
          properties:
            X-Token:
              $ref: '#/components/schemas/TokenAlias'
    messages:
      tick:
        payload:
          type: object
          properties:
            price:
              type: number
operations:
  receiveTicks:
    action: receive
    channel:
      $ref: '#/channels/ticks'
components:
  schemas:
    TokenAlias:
      $ref: '#/components/schemas/Token'
    Token:
      type: string
      default: base
