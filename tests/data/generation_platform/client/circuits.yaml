openapi: 3.1.0
info:
  title: Circuit groups
  version: 1.0.0
servers:
  - url: https://api.example.com
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  schemas:
    Status:
      type: object
      properties:
        state:
          type: string
      required: [state]
paths:
  /status:
    get:
      operationId: getStatus
      tags: [backend]
      responses:
        '200':
          description: The backend's state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        default:
          description: Failure
          content:
            text/plain:
              schema:
                type: string
  /account:
    get:
      operationId: getAccount
      tags: [backend]
      security:
        - bearer: []
      responses:
        '200':
          description: The caller's account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /search:
    get:
      operationId: search
      tags: [search]
      responses:
        '200':
          description: Results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /uploads:
    post:
      operationId: upload
      tags: [backend]
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '204':
          description: Stored
  /health:
    get:
      operationId: getHealth
      tags: [backend]
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
