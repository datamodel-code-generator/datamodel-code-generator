      $ref: '#/channels/crowded'
    security: *either
  crowd20:
    action: receive
    channel:
      $ref: '#/channels/crowded'
    security: *either
  crowd21:
    action: receive
    channel:
      $ref: '#/channels/crowded'
    security: *either
  crowd22:
    action: receive
    channel:
      $ref: '#/channels/crowded'
    security: *either
  crowd23:
    action: receive
    channel:
      $ref: '#/channels/crowded'
    security: *either
  crowd24:
    action: receive
    channel:
      $ref: '#/channels/crowded'
    security: *either
  crowd25:
    action: receive
    channel:
      $ref: '#/channels/crowded'
    security: *either
components:
  schemas:
    Line:
      allOf:
        - type: string
          maxLength: 80
  operationTraits:
    secured:
      security:
        - $ref: '#/components/securitySchemes/user'
  servers:
    shared:
      host: shared.example.com
      pathname: /v3
      protocol: ws
  securitySchemes:
    user:
      type: userPassword
    digest:
      type: http
      scheme: digest
    bearer:
      type: http
      scheme: bearer
    key:
      type: httpApiKey
      in: query
      name: key
    partner:
      $ref: 'asyncapi-other.yaml#/components/securitySchemes/partner'
  channelBindings:
    posted:
      ws:
        method: POST
  messageTraits:
    packed:
      contentType: application/x-msgpack
