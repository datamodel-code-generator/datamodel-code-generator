openapi: 3.1.0
info:
  title: Blobs
  version: 1.0.0
servers:
  - url: https://api.example.com
paths:
  /blob:
    post:
      operationId: putBlob
      tags: [blobs]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: string, format: byte}
      responses:
        '200':
          description: The stored bytes
          content:
            application/json:
              schema: {type: string, format: byte}
  /alias:
    post:
      operationId: putAlias
      tags: [blobs]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Blob'}
      responses:
        '200':
          description: The stored bytes
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Blob'}
  /chunks:
    post:
      operationId: putChunks
      tags: [blobs]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: array, items: {$ref: '#/components/schemas/Blob'}}
      responses:
        '200':
          description: The stored chunks
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Blob'}}
  /count:
    post:
      operationId: putCount
      tags: [blobs]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: integer}
      responses:
        '200':
          description: The count's label
          content:
            application/json:
              schema: {type: string}
components:
  schemas:
    Blob: {type: string, format: byte}
