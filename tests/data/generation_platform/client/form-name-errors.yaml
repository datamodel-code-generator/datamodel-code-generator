openapi: 3.1.0
info: {title: Form name errors, version: "1.0"}
servers:
  - {url: https://forms.example.com}
paths:
  /absorbing-form:
    post:
      operationId: postAbsorbingForm
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                page: {type: object, properties: {size: {type: integer}}}
                filter: {type: object, additionalProperties: {type: string}}
            encoding:
              page: {explode: true}
              filter: {explode: true}
      responses:
        "204": {description: Done.}
  /absorbing-parts:
    post:
      operationId: postAbsorbingParts
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                labels: {type: object, additionalProperties: {type: string}}
                deep: {type: object, properties: {name: {type: string}}}
            encoding:
              labels: {explode: true}
              deep: {style: deepObject, explode: true}
      responses:
        "204": {description: Done.}
