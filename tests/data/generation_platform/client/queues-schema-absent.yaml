openapi: 3.2.0
info:
  title: Offline orders
  version: 1.0.0
servers:
  - url: https://api.example.com
paths:
  /orders:
    post:
      operationId: createOrder
      tags: [orders]
      parameters:
        - name: X-Trace
          in: header
          content:
            application/json: {}
        - name: session
          in: cookie
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NewOrder'}
      responses:
        '201':
          description: The order was created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '409':
          description: The order conflicts with another.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Problem'}
  /orders/{orderId}:
    get:
      operationId: getOrder
      tags: [orders]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: {type: string}
        - name: verbose
          in: query
          schema: {type: boolean}
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
  /orders/{orderId}/notes:
    post:
      operationId: addNote
      tags: [orders]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Note'}
      responses:
        '204':
          description: The note was added.
  /orders/{orderId}/receipt:
    put:
      operationId: putReceipt
      tags: [orders]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        '204':
          description: The receipt was stored.
  /filtered:
    get:
      operationId: listFiltered
      tags: [filtered]
      parameters:
        - name: queue_options
          in: query
          schema: {type: string}
      responses:
        '200':
          description: The filtered orders.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Order'}
  /account:
    get:
      operationId: getAccount
      tags: [account]
      security:
        - bearer: []
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Account'}
    patch:
      operationId: updateAccount
      tags: [account]
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Account'}
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Account'}
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  schemas:
    NewOrder:
      type: object
      required: [item, quantity]
      properties:
        item: {type: string}
        quantity: {type: integer, minimum: 1}
    Order:
      type: object
      required: [id, item]
      properties:
        id: {type: string}
        item: {type: string}
        quantity: {type: integer}
    Note:
      type: object
      required: [text]
      properties:
        text: {type: string}
    Problem:
      type: object
      required: [code]
      properties:
        code: {type: string}
    Account:
      type: object
      required: [name]
      properties:
        name: {type: string}
