openapi: 3.1.0
info:
  title: Parameters taking one item or an array of them that the client cannot write
  version: "1"
servers:
  - url: https://api.example.com
paths:
  /delimited:
    get:
      operationId: delimited
      parameters:
        - name: tags
          in: query
          style: pipeDelimited
          explode: false
          schema:
            oneOf:
              - {type: string}
              - {type: array, items: {type: string}}
      responses:
        "204":
          description: Listed.
  /kinds:
    get:
      operationId: kinds
      parameters:
        - name: ids
          in: query
          schema:
            oneOf:
              - {type: string}
              - {type: array, items: {type: integer}}
      responses:
        "204":
          description: Listed.
  /headers:
    get:
      operationId: headers
      parameters:
        - name: X-Tags
          in: header
          schema:
            anyOf:
              - {type: string}
              - {type: array, items: {type: string}}
      responses:
        "204":
          description: Listed.
  /search:
    get:
      operationId: search
      parameters:
        - name: tags
          in: query
          schema:
            anyOf:
              - {type: string}
              - {type: array, items: {type: string}}
      responses:
        "204":
          description: Listed.
  /read:
    get:
      operationId: read
      responses:
        "204":
          description: Listed.
          headers:
            X-Tags:
              schema:
                oneOf:
                  - {type: string}
                  - {type: array, items: {type: string}}
