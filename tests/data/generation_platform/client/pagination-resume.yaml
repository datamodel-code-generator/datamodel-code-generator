openapi: 3.1.0
info:
  title: Pagination resume
  version: 1.0.0
servers:
  - url: https://api.example.com/v1
paths:
  /users:
    get:
      operationId: listUsers
      tags: [users]
      parameters:
        - name: cursor
          in: query
          schema: {type: string, maxLength: 8}
        - name: offset
          in: query
          schema: {type: integer}
        - name: limit
          in: query
          schema: {type: integer}
        - name: X-Trace
          in: header
          schema: {type: string}
        - name: session
          in: cookie
          schema: {type: string}
      responses:
        '200':
          description: One page of users.
          headers:
            Link:
              schema: {type: string}
            X-Snapshot:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserPage'}
  /searches:
    post:
      operationId: search
      tags: [searches]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SearchQuery'}
      responses:
        '200':
          description: One page of matching users.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserPage'}
  /archive/{cursor}:
    get:
      operationId: listArchive
      tags: [archive]
      parameters:
        - name: cursor
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: One page of archived users.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserPage'}
  /secure/users:
    get:
      operationId: listSecureUsers
      tags: [secure]
      security:
        - bearer: []
      parameters:
        - name: cursor
          in: query
          schema: {type: string}
      responses:
        '200':
          description: One page of users for a bearer.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserPage'}
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  schemas:
    User:
      type: object
      required: [id]
      properties:
        id: {type: string}
    UserPage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/User'}
        next_cursor: {type: [string, 'null']}
        next: {type: string}
        has_more: {type: boolean}
    SearchQuery:
      type: object
      required: [query]
      properties:
        query: {type: string}
        cursor: {type: string}
