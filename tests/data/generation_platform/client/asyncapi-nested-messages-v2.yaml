asyncapi: 2.6.0
info:
  title: Nested
  version: 1.0.0
servers:
  production:
    url: wss://gateway.example.com
    protocol: wss
channels:
  feed:
    publish:
      message:
        oneOf:
          - $ref: '#/components/messages/Order'
          - $ref: '#/components/messages/Admin'
    subscribe:
      message:
        payload:
          $ref: '#/components/schemas/Ack'
components:
  messages:
    Order:
      payload:
        $ref: '#/components/schemas/Order'
    Admin:
      oneOf:
        - $ref: '#/components/messages/Ban'
        - $ref: '#/components/messages/Kick'
    Ban:
      payload:
        $ref: '#/components/schemas/Ban'
    Kick:
      payload:
        $ref: '#/components/schemas/Kick'
  schemas:
    Order:
      type: object
      properties:
        id:
          type: string
    Ack:
      type: object
      properties:
        ok:
          type: boolean
    Ban:
      type: object
      properties:
        user:
          type: string
    Kick:
      type: object
      properties:
        reason:
          type: string
