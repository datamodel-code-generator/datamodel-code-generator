openapi: 3.2.0
info:
  title: Parameter adapters
  version: "1"
servers:
  - url: https://api.example.com
paths:
  /tags:
    get:
      operationId: listTags
      parameters:
        - name: tags
          in: cookie
          style: form
          explode: false
          schema:
            $ref: "#/components/schemas/Tags"
        - name: session
          in: cookie
          schema:
            type: string
        - name: where
          in: query
          style: deepObject
          explode: true
          schema:
            $ref: "#/components/schemas/Filter"
        - name: X-Labels
          in: header
          schema:
            type: array
            items:
              type: string
      responses:
        "204":
          description: No content.
  /items/{key}:
    get:
      operationId: getItem
      parameters:
        - name: key
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Key"
      responses:
        "204":
          description: No content.
  /segments/{segment}:
    get:
      operationId: getSegment
      parameters:
        - name: segment
          in: path
          required: true
          schema:
            type: string
        - name: X-Raw
          in: header
          schema:
            type: string
      responses:
        "204":
          description: No content.
  /finds:
    get:
      operationId: find
      parameters:
        - name: criteria
          in: querystring
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Criteria"
      responses:
        "200":
          description: One page of found items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page"
  /search:
    get:
      operationId: search
      parameters:
        - name: opts
          in: query
          schema:
            $ref: "#/components/schemas/Options"
        - name: a
          in: query
          schema:
            type: string
        - name: near
          in: query
          style: deepObject
          explode: true
          schema:
            $ref: "#/components/schemas/Members"
      responses:
        "204":
          description: No content.
  /spread:
    get:
      operationId: spread
      parameters:
        - name: opts
          in: query
          schema:
            $ref: "#/components/schemas/Members"
        - name: filter
          in: query
          schema:
            $ref: "#/components/schemas/Members"
      responses:
        "204":
          description: No content.
components:
  schemas:
    Members:
      type: object
      properties:
        b:
          type: string
    Tags:
      type: array
      items:
        type: string
    Filter:
      type: object
      properties:
        range:
          type: object
          properties:
            min:
              type: integer
            max:
              type: integer
        name:
          type: string
    Key:
      type: object
      required: [a]
      properties:
        a:
          type: integer
    Criteria:
      type: object
      properties:
        term:
          type: [string, "null"]
        start:
          type: integer
    Options:
      type: object
      properties:
        a:
          type: string
    Page:
      type: object
      required: [data, has_more]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Item"
        has_more:
          type: boolean
    Item:
      type: object
      required: [id]
      properties:
        id:
          type: string
