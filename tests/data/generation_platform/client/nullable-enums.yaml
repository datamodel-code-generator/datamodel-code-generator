openapi: 3.1.0
info: {title: Nullable enums, version: "1.0"}
servers: [{url: "https://api.example.com"}]
paths:
  /pets:
    get:
      operationId: listPets
      responses:
        "200":
          description: Pets
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/Pet"}}
    post:
      operationId: createPet
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Pet"}
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Pet"}
components:
  schemas:
    Color:
      type: [string, "null"]
      enum: [red, green, null]
    Pet:
      type: object
      required: [name, color]
      properties:
        name: {type: string}
        color: {$ref: "#/components/schemas/Color"}
        size: {type: [integer, "null"], enum: [1, 2, null]}
