openapi: 3.0.3
info:
  title: Parameter content defaults
  version: 1.0.0
servers:
  - url: https://api.example.com
paths:
  /search:
    get:
      operationId: search
      parameters:
        - name: q
          in: query
          content:
            application/json:
              schema: {type: string, default: abc}
      responses:
        '204':
          description: Searched.
