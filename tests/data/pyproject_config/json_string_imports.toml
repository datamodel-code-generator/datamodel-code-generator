[tool.datamodel-codegen]
target-python-version = "3.11"
formatters = ["builtin"]
disable-timestamp = true
use-default = true
aliases = "aliases.json"
default-values = "defaults.json"
extra-template-data = "extra_string.json"
custom-formatters = "tests.data.python.custom_formatters.replace_text"
base-class-map = "base_class_map.json"
custom-formatters-kwargs = "formatter_kwargs.json"
duplicate-name-suffix = "duplicate_name_suffix.json"
enum-field-as-literal-map = "enum_field_as_literal_map.json"
import-overrides = "import_overrides.json"
model-name-map = "model_name_map.json"
serialization-aliases = "serialization_aliases.json"
type-overrides = "type_overrides.json"
validators = "validators.json"
