openapi: 3.0.3
info:
  title: Variants generated before the module whose union tags their base struct
  version: '1'
paths: {}
components:
  schemas:
    animals.Pet:
      type: object
      required:
      - petType
      properties:
        petType:
          type: string
        id:
          type: integer
    animals.Bird:
      type: object
      required:
      - petType
      properties:
        petType:
          type: string
    pets.Cat:
      allOf:
      - $ref: '#/components/schemas/animals.Pet'
      - type: object
        properties:
          name:
            type: string
    pets.Dog:
      allOf:
      - $ref: '#/components/schemas/animals.Pet'
      - type: object
        properties:
          bark:
            type: boolean
    pets.Owner:
      type: object
      properties:
        pet:
          oneOf:
          - $ref: '#/components/schemas/pets.Cat'
          - $ref: '#/components/schemas/pets.Dog'
          discriminator:
            propertyName: petType
            mapping:
              cat: '#/components/schemas/pets.Cat'
              dog: '#/components/schemas/pets.Dog'
    animals.Shelter:
      type: object
      properties:
        animal:
          oneOf:
          - $ref: '#/components/schemas/animals.Pet'
          - $ref: '#/components/schemas/animals.Bird'
          discriminator:
            propertyName: petType
            mapping:
              pet: '#/components/schemas/animals.Pet'
              bird: '#/components/schemas/animals.Bird'
