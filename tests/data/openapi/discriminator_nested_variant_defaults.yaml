openapi: 3.1.0
info:
  title: Discriminated unions that take a root model with a default as a variant
  version: "0.1.0"
paths: {}
components:
  schemas:
    Cat:
      type: object
      properties:
        type:
          const: cat
      required:
        - type
    Dog:
      type: object
      properties:
        type:
          const: dog
      required:
        - type
    Bird:
      type: object
      properties:
        type:
          const: bird
      required:
        - type
    DogOrBird:
      oneOf:
        - $ref: "#/components/schemas/Dog"
        - $ref: "#/components/schemas/Bird"
      discriminator:
        propertyName: type
    Pets:
      type: object
      properties:
        pet:
          oneOf:
            - $ref: "#/components/schemas/Cat"
            - $ref: "#/components/schemas/DogOrBird"
          discriminator:
            propertyName: type
    PlainDogOrBird:
      oneOf:
        - $ref: "#/components/schemas/Dog"
        - $ref: "#/components/schemas/Bird"
    PlainPets:
      type: object
      properties:
        pet:
          oneOf:
            - $ref: "#/components/schemas/Cat"
            - $ref: "#/components/schemas/PlainDogOrBird"
          discriminator:
            propertyName: type
    ChainedDogOrBird:
      oneOf:
        - $ref: "#/components/schemas/DogOrBird"
    ChainedPets:
      type: object
      properties:
        pet:
          oneOf:
            - $ref: "#/components/schemas/Cat"
            - $ref: "#/components/schemas/ChainedDogOrBird"
          discriminator:
            propertyName: type
