openapi: "3.1.0"
info:
  title: Required inherited collisions
  version: "1.0"
paths: {}
components:
  schemas:
    CollisionBase:
      type: object
      properties:
        x-y:
          type: string
          minLength: 1
        a-b:
          type: string
    CollisionDerived:
      type: object
      required:
        - x-y
        - a-b
      allOf:
        - $ref: "#/components/schemas/CollisionBase"
      properties:
        x_y:
          type: integer
        a_b:
          type: integer
