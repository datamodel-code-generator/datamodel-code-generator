openapi: 3.1.0
info:
  title: Boolean parameter schemas
  version: "1"
paths:
  /pets/{petId}:
    parameters:
      - name: trace
        in: query
        schema: true
    get:
      operationId: getPet
      parameters:
        - name: petId
          in: path
          required: true
          schema: true
        - name: anything
          in: query
          schema: true
        - name: nothing
          in: query
          schema: false
        - name: X-Request-Tag
          in: header
          schema: true
        - $ref: "#/components/parameters/Shared"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
          headers:
            X-Rate-Limit:
              schema: true
            X-Trace:
              $ref: "#/components/headers/Trace"
webhooks:
  petAdded:
    post:
      parameters:
        - name: source
          in: query
          required: true
          schema: true
      responses:
        "200":
          description: ok
components:
  schemas:
    Pet:
      type: object
      properties:
        name:
          type: string
  parameters:
    Shared:
      name: shared
      in: query
      schema: true
  headers:
    Trace:
      schema: true
