openapi: 3.1.0
info: {title: discriminator with pattern, version: "1"}
paths: {}
components:
  schemas:
    Card:
      type: object
      properties:
        type: {type: string, pattern: 'card|wallet|bank|cash'}
      required: [type]
    Wallet:
      type: object
      properties:
        type: {type: string, pattern: 'card|wallet|bank|cash', maxLength: 50, minLength: 0}
      required: [type]
    Bank:
      type: object
      properties:
        type: {type: string, const: bank, pattern: 'card|wallet|bank|cash'}
      required: [type]
    Cash:
      type: object
      properties:
        type: {type: string, maxLength: 10}
      required: [type]
    Voucher:
      type: object
      properties:
        type: {type: string, pattern: '^\p{Ll}+$'}
      required: [type]
    PaymentRequest:
      type: object
      properties:
        paymentMethod:
          oneOf:
            - $ref: '#/components/schemas/Card'
            - $ref: '#/components/schemas/Wallet'
            - $ref: '#/components/schemas/Bank'
            - $ref: '#/components/schemas/Cash'
            - $ref: '#/components/schemas/Voucher'
          discriminator:
            propertyName: type
            mapping:
              card: '#/components/schemas/Card'
              wallet: '#/components/schemas/Wallet'
              bank: '#/components/schemas/Bank'
              cash: '#/components/schemas/Cash'
              voucher: '#/components/schemas/Voucher'
