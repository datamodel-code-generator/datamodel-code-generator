openapi: 3.1.0
info:
  title: Parameter reuse
  version: 1.0.0
paths:
  /items:
    get:
      operationId: listItems
      parameters:
        - {name: first, in: query, schema: {type: integer, maximum: 50}}
        - {name: limit, in: query, schema: {$ref: 'api_scope_parameter_reuse_limit.yaml#/Limit'}}
      responses:
        '200':
          description: The limit.
          content:
            application/json:
              schema: {$ref: 'api_scope_parameter_reuse_limit.yaml#/Limit'}
