openapi: 3.0.3
info: {title: pets, version: "1"}
paths: {}
components:
  schemas:
    OwnedPet:
      allOf:
        - $ref: '#/components/schemas/Pet'
        - type: object
          properties: {owner: {type: string}}
          required: [owner, name]
    Pet:
      oneOf:
        - $ref: '#/components/schemas/Cat'
        - $ref: '#/components/schemas/Dog'
      discriminator:
        propertyName: kind
        mapping: {cat: '#/components/schemas/Cat', dog: '#/components/schemas/Dog'}
    Dog:
      oneOf:
        - $ref: '#/components/schemas/BigDog'
        - $ref: '#/components/schemas/SmallDog'
    Cat:
      type: object
      properties: {kind: {type: string}, meow: {type: boolean}, name: {type: string}}
      required: [kind, meow]
    BigDog:
      type: object
      properties: {kind: {type: string}, big: {type: boolean}, name: {type: string}}
      required: [kind, big]
    SmallDog:
      type: object
      properties: {kind: {type: string}, small: {type: boolean}, name: {type: string}}
      required: [kind, small]
