openapi: 3.1.0
info:
  title: Maps and arrays that admit nothing
  version: '1.0'
paths:
  /maps:
    put:
      operationId: putMap
      parameters:
      - name: ids
        in: query
        schema:
          type: array
          items:
            allOf:
            - false
      - name: filter
        in: query
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                allOf:
                - false
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                allOf:
                - false
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                  - false
components:
  schemas:
    Empty:
      type: object
      additionalProperties:
        allOf:
        - false
    Nothing:
      type: array
      items:
        allOf:
        - false
    Holder:
      type: object
      properties:
        m:
          type: object
          additionalProperties:
            allOf:
            - false
        l:
          type: array
          items:
            allOf:
            - false
