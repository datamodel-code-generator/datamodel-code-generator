openapi: "3.1.0"
info:
  title: No-merge inherited literal false schema
  version: "1.0"
paths: {}
components:
  schemas:
    Base:
      type: object
      required:
        - value
      properties:
        value:
          type: string

    Derived:
      allOf:
        - $ref: "#/components/schemas/Base"
        - type: object
          properties:
            value:
              allOf:
                - false
                - minLength: 2
