openapi: 3.1.0
info:
  title: type overrides constructor order
  version: 1.0.0
paths: {}
components:
  schemas:
    Nullable:
      type: [object, "null"]
      properties:
        a:
          type: string
    TwoKept:
      type: object
      properties:
        n1:
          $ref: '#/components/schemas/Nullable'
        n2:
          $ref: '#/components/schemas/Nullable'
    Constrained:
      type: object
      required: [n, q]
      properties:
        d:
          type: string
          default: x
        n:
          type: integer
          minimum: 1
        q:
          type: string
    Gain:
      type: object
      required: [g, q]
      properties:
        g:
          type: array
          items:
            type: string
          minimum: 5
        q:
          type: string
        d:
          type: string
          default: x
    Base:
      type: object
      properties:
        x:
          type: string
          default: a
    Child:
      allOf:
        - $ref: '#/components/schemas/Base'
        - type: object
          required: [y]
          properties:
            y:
              type: string
