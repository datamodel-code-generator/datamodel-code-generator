openapi: 3.1.0
info:
  title: A parameter document that a pointer into it loaded first, beside a cycle of root models
  version: "1.0"
paths:
  /notes:
    get:
      parameters:
        - $ref: parameter.yaml
      responses:
        "200":
          description: The notes.
components:
  schemas:
    A:
      type: array
      items:
        $ref: "#/components/schemas/B"
    B:
      type: array
      items:
        $ref: "#/components/schemas/A"
    Pair:
      anyOf:
        - $ref: "#/components/schemas/A"
        - $ref: "#/components/schemas/B"
    Size:
      $ref: parameter.yaml#/schema/properties/size
