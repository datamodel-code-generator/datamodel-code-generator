openapi: 3.1.0
info:
  title: Reused variants that keep the tag of the model they reuse
  version: "1"
paths: {}
components:
  schemas:
    Cat:
      type: object
      required: [kind]
      properties:
        kind:
          const: cat
        name:
          type: string
    Kitten:
      type: object
      required: [kind]
      properties:
        kind:
          const: cat
        name:
          type: string
    Dog:
      type: object
      required: [kind]
      properties:
        kind:
          const: dog
    Bird:
      type: object
      required: [kind]
      properties:
        kind:
          const: bird
    Pet:
      oneOf:
        - $ref: "#/components/schemas/Kitten"
        - $ref: "#/components/schemas/Dog"
      discriminator:
        propertyName: kind
    Animal:
      oneOf:
        - $ref: "#/components/schemas/Kitten"
        - $ref: "#/components/schemas/Bird"
      discriminator:
        propertyName: kind
