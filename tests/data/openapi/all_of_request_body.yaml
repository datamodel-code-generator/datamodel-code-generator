openapi: 3.1.0
info:
  title: Pets
  version: "1"
paths:
  /pets:
    post:
      operationId: createPet
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Pet'
                - required: [name]
      responses:
        "200":
          description: OK
components:
  schemas:
    Pet:
      type: object
      properties:
        name:
          type: string
