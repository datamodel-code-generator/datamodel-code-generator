openapi: 3.1.0
info:
  title: Discriminator values from the mapping
  version: "1"
paths: {}
components:
  schemas:
    Pet:
      oneOf:
        - $ref: "#/components/schemas/Cat"
        - $ref: "#/components/schemas/Dog"
      discriminator:
        propertyName: pet-type
        mapping:
          cat: "#/components/schemas/Cat"
          dog: "#/components/schemas/Dog"
    Animal:
      oneOf:
        - $ref: "#/components/schemas/Cat"
        - $ref: "#/components/schemas/Bird"
      discriminator:
        propertyName: pet-type
        mapping:
          feline: "#/components/schemas/Cat"
          bird: "#/components/schemas/Bird"
    Owner:
      type: object
      required: [vehicle]
      properties:
        vehicle:
          oneOf:
            - $ref: "#/components/schemas/Car"
            - $ref: "#/components/schemas/Bike"
          discriminator:
            propertyName: kind
        shape:
          oneOf:
            - $ref: "#/components/schemas/Circle"
            - $ref: "#/components/schemas/Square"
          discriminator:
            propertyName: shapeType
            mapping:
              circle: "#/components/schemas/Circle"
              round: "#/components/schemas/Circle"
              square: "#/components/schemas/Square"
    Cat:
      type: object
      required: [pet-type, name]
      properties:
        pet-type:
          type: string
        name:
          type: string
    Dog:
      type: object
      required: [pet-type, name]
      properties:
        pet-type:
          type: string
        name:
          type: string
    Bird:
      type: object
      required: [pet-type]
      properties:
        pet-type:
          type: string
    Car:
      type: object
      required: [kind, wheels]
      properties:
        kind:
          type: string
        wheels:
          type: integer
    Bike:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
    Circle:
      type: object
      required: [shapeType, radius]
      properties:
        shapeType:
          type: string
        radius:
          type: number
    Square:
      type: object
      required: [shapeType, side]
      properties:
        shapeType:
          type: string
        side:
          type: number
