openapi: 3.0.0
info:
  title: Test API
  version: 1.0.0
paths: {}
components:
  schemas:
    NullableChild:
      nullable: true
      type: object
      properties:
        name:
          type: string
    NonNullableChild:
      type: object
      properties:
        name:
          type: string
    Parent:
      type: object
      required:
        - nullableChild
        - nonNullableChild
      properties:
        nullableChild:
          $ref: "#/components/schemas/NullableChild"
        nonNullableChild:
          $ref: "#/components/schemas/NonNullableChild"
        optionalNullableChild:
          $ref: "#/components/schemas/NullableChild"
        optionalNullableWrapper:
          $ref: "#/components/schemas/NullableWrapper"
        optionalNullableExtended:
          $ref: "#/components/schemas/NullableExtended"
        optionalNullableMerged:
          $ref: "#/components/schemas/NullableMerged"
        describedNullableChild:
          description: A nullable child with a description.
          allOf:
            - $ref: "#/components/schemas/NullableChild"
        nullableChildren:
          type: array
          items:
            $ref: "#/components/schemas/NullableChild"
        nullableChildMap:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/NullableChild"
    NullableWrapper:
      nullable: true
      allOf:
        - $ref: "#/components/schemas/NonNullableChild"
    NullableExtended:
      nullable: true
      allOf:
        - $ref: "#/components/schemas/NonNullableChild"
        - type: object
          properties:
            note:
              type: string
    NullableMerged:
      nullable: true
      allOf:
        - type: object
          properties:
            first:
              type: string
        - type: object
          properties:
            second:
              type: integer
