openapi: '3.1.0'
info: {title: A variant whose nullable tag property admits several values, version: 1.0.0}
paths: {}
components:
  schemas:
    Cat:
      type: object
      required: [kind]
      properties:
        kind: {type: [string, "null"], enum: [cat, kitty]}
        name: {type: string}
    Dog:
      type: object
      required: [kind]
      properties:
        kind: {type: string, enum: [dog]}
        bark: {type: boolean}
    Pet:
      oneOf:
        - $ref: '#/components/schemas/Cat'
        - $ref: '#/components/schemas/Dog'
      discriminator:
        propertyName: kind
