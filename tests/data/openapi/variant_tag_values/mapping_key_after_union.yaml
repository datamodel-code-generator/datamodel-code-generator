openapi: '3.1.0'
info: {title: A mapping key naming a subclass of a variant an earlier union tagged, version: 1.0.0}
paths: {}
components:
  schemas:
    Base:
      type: object
      required: [kind]
      properties:
        kind: {type: integer, enum: [1, 2]}
    Child:
      allOf:
        - $ref: '#/components/schemas/Base'
        - type: object
          properties:
            name: {type: string}
    Other:
      type: object
      required: [kind]
      properties:
        kind: {type: integer, const: 5}
    First:
      oneOf:
        - $ref: '#/components/schemas/Base'
        - $ref: '#/components/schemas/Other'
      discriminator:
        propertyName: kind
        mapping:
          '1': '#/components/schemas/Base'
          '5': '#/components/schemas/Other'
    Second:
      oneOf:
        - $ref: '#/components/schemas/Child'
        - $ref: '#/components/schemas/Other'
      discriminator:
        propertyName: kind
        mapping:
          '2': '#/components/schemas/Child'
          '5': '#/components/schemas/Other'
