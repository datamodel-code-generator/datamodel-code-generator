openapi: '3.1.0'
info: {title: Inline variants whose inherited tag property admits several values, version: 1.0.0}
paths: {}
components:
  schemas:
    Cat:
      type: object
      required: [kind]
      properties:
        kind: {type: string, enum: [cat, kitty]}
    Dog:
      type: object
      required: [kind]
      properties:
        kind: {type: string, enum: [dog]}
    Pet:
      oneOf:
        - allOf:
            - $ref: '#/components/schemas/Cat'
            - properties:
                note: {type: string}
        - allOf:
            - $ref: '#/components/schemas/Dog'
            - properties:
                note: {type: string}
      discriminator:
        propertyName: kind
