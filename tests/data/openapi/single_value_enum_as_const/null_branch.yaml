openapi: 3.1.0
info:
  title: Item references
  version: 1.0.0
paths: {}
components:
  schemas:
    ItemReference:
      type: object
      properties:
        id: {type: string}
        type:
          anyOf:
            - {type: string, enum: [item_reference]}
            - {type: 'null'}
        kind:
          oneOf:
            - {type: string, enum: [reference]}
            - {type: 'null'}
        version:
          default: 2
          oneOf:
            - {type: integer, enum: [2]}
            - {type: 'null'}
        source:
          type: [string, 'null']
          oneOf:
            - {enum: [user]}
            - {type: 'null'}
      required: [id, kind]
    Marker:
      anyOf:
        - {type: string, enum: [marker]}
        - {type: 'null'}
