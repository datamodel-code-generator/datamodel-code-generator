openapi: 3.1.0
info:
  title: Mixed types
  version: 1.0.0
paths: {}
components:
  schemas:
    Kind:
      oneOf:
        - {type: string, const: named}
        - {type: integer, const: 1}
    Settings:
      type: object
      properties:
        kind: {$ref: '#/components/schemas/Kind'}
        limit:
          anyOf:
            - {type: string, const: unlimited}
            - {type: integer, const: 0}
            - {type: 'null'}
        cache:
          oneOf:
            - {type: boolean, const: false}
            - {type: string, const: auto}
        level:
          oneOf:
            - {type: string, const: low}
            - {type: string, const: high}
      required: [kind]
