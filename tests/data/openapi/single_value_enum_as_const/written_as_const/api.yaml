openapi: 3.1.0
info:
  title: Runs
  version: 1.0.0
servers:
  - url: https://{region}.example.com
    variables:
      region: {default: us, enum: [us]}
paths:
  /runs:
    get:
      operationId: listRuns
      parameters:
        - name: order
          in: query
          schema: {type: string, const: newest}
      responses:
        '200':
          description: Runs.
          headers:
            x-mode:
              schema: {type: string, const: fast}
            X-Rate:
              $ref: 'headers.yaml#/x-rate'
            server:
              schema: {type: string, const: edge}
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Run'}
          links:
            first:
              operationId: listRuns
              parameters: {order: {enum: [newest]}}
        default:
          description: Error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: string, const: error}
                required: [code]
    post:
      operationId: createRun
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                default: {type: string, const: upload}
            encoding:
              default:
                headers:
                  X-Part:
                    schema: {type: string, const: part}
      callbacks:
        examples:
          '{$request.query.url}':
            post:
              operationId: runCallback
              requestBody:
                content:
                  application/json:
                    schema: {type: string, const: called}
              responses:
                '200': {description: Received.}
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: {$ref: 'schemas.yaml#/created'}
webhooks:
  default:
    post:
      operationId: runEvent
      requestBody:
        content:
          application/json:
            schema: {type: string, const: hook}
      responses:
        '200': {description: Received.}
components:
  schemas:
    Status:
      description: Run status.
      oneOf:
        - {type: string, const: queued, description: Waiting to start.}
        - {type: string, const: running, description: Running now.}
    Run:
      type: object
      properties:
        kind: {type: string, const: run}
        status: {$ref: '#/components/schemas/Status'}
        region: {$ref: 'region.yaml'}
        note: {$ref: 'common.yaml#/Note'}
        retries: {type: integer, const: 0, default: 0}
      required: [kind, status]
