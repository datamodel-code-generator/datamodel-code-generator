openapi: 3.1.0
info: {title: Paths, version: 1.0.0}
paths:
  /x-ray:
    get:
      operationId: getXRay
      parameters:
        - name: x-mode
          in: query
          schema:
            oneOf:
              - {type: string, enum: [fast]}
              - {type: 'null'}
      responses:
        '200':
          description: X-ray.
          content:
            application/json:
              schema:
                oneOf:
                  - {type: string, enum: [ok]}
                  - {type: 'null'}
  /ray:
    get:
      operationId: getRay
      parameters:
        - name: mode
          in: query
          schema:
            oneOf:
              - {type: string, enum: [fast]}
              - {type: 'null'}
      responses:
        '200':
          description: Ray.
          content:
            application/json:
              schema:
                oneOf:
                  - {type: string, enum: [ok]}
                  - {type: 'null'}
  /x-settings:
    get:
      operationId: getXSettings
      responses:
        '200':
          description: Settings.
          content:
            application/json:
              schema:
                oneOf:
                  - {type: string, enum: [auto]}
                  - {type: integer, enum: [1]}
  /x-things:
    get:
      operationId: getXThings
      responses:
        '200':
          description: Things.
          content:
            application/json:
              schema: {$ref: '#/x-responses/Thing'}
x-responses:
  Thing:
    oneOf:
      - {type: string, const: thing}
      - {type: 'null'}
components:
  schemas: {}
