openapi: 3.0.3
info:
  title: First
  version: 1.0.0
paths: {}
components:
  schemas:
    Pet:
      type: object
      required: [petType]
      properties:
        petType: {type: string}
      discriminator:
        propertyName: petType
    Cat:
      allOf:
        - {$ref: '#/components/schemas/Pet'}
        - type: object
          properties:
            meow: {type: string}
    Holder:
      type: object
      properties:
        pet: {$ref: '#/components/schemas/Pet'}
