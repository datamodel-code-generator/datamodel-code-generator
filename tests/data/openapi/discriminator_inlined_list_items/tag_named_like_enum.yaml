openapi: 3.1.0
info: {title: tag property named like its Enum in a collapsed union, version: "1"}
paths: {}
components:
  schemas:
    Kind:
      type: string
      enum: [cat, dog]
    Cat:
      type: object
      required: [Kind]
      properties:
        Kind: {$ref: '#/components/schemas/Kind'}
        lives: {type: integer}
    Dog:
      type: object
      required: [Kind]
      properties:
        Kind: {$ref: '#/components/schemas/Kind'}
        bark: {type: boolean}
    Pet:
      oneOf:
        - $ref: '#/components/schemas/Cat'
        - $ref: '#/components/schemas/Dog'
      discriminator:
        propertyName: Kind
        mapping:
          cat: '#/components/schemas/Cat'
          dog: '#/components/schemas/Dog'
    Shelter:
      type: object
      properties:
        pets:
          type: array
          items: {$ref: '#/components/schemas/Pet'}
