openapi: 3.1.0
info:
  title: Enum const positions
  version: "1"
paths:
  /kinds:
    post:
      operationId: postKind
      requestBody:
        content:
          application/json:
            schema:
              type: string
              enum: [a, b]
              const: a
      responses:
        "200":
          description: The kind kept.
          content:
            application/json:
              schema:
                type: string
                enum: [a, b, c]
                const: c
                x-enum-varnames: [ALPHA, BRAVO, CHARLIE]
components:
  schemas:
    Picked:
      type: string
      enum: [a, b]
      const: b
    Holder:
      type: object
      properties:
        kind:
          type: string
          enum: [a, b]
          const: a
        kinds:
          type: array
          items:
            type: string
            enum: [a, b]
            const: b
