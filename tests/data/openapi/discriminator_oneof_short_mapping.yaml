openapi: 3.0.3
info:
  title: Short discriminator mapping
  version: 1.0.0
paths: {}
components:
  schemas:
    Pet:
      oneOf:
        - {$ref: '#/components/schemas/Cat'}
        - {$ref: '#/components/schemas/Dog'}
      discriminator:
        propertyName: petType
        mapping:
          cat: Cat
          dog: Dog
    Cat:
      type: object
      required: [petType]
      properties:
        petType: {type: string}
        meow: {type: string}
    Dog:
      type: object
      required: [petType]
      properties:
        petType: {type: string}
        bark: {type: string}
