openapi: "3.0.3"
info:
  title: Nullable roots
  version: "1.0.0"
paths: {}
components:
  schemas:
    Item:
      type: object
      properties:
        id:
          type: integer
    Name:
      type: string
      nullable: true
    Items:
      type: array
      items:
        type: string
        nullable: true
    Holder:
      type: object
      properties:
        name:
          type: string
          nullable: true
        items:
          $ref: "#/components/schemas/Items"
