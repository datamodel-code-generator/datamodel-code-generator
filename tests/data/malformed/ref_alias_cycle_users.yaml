openapi: 3.1.0
info:
  title: Components that only reference each other, used through an alias, a map value and a map key
  version: '1.0'
paths: {}
components:
  schemas:
    A:
      $ref: '#/components/schemas/B'
    B:
      $ref: '#/components/schemas/A'
    C:
      type: array
      items:
        $ref: '#/components/schemas/A'
    Holder:
      type: object
      properties:
        c:
          $ref: '#/components/schemas/C'
        values:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/A'
        keys:
          type: object
          propertyNames:
            $ref: '#/components/schemas/A'
        count:
          type: integer
      additionalProperties:
        $ref: '#/components/schemas/A'
