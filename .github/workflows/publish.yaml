name: Publish

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+rc[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+\+backport-[0-9]+'
  workflow_dispatch:
    inputs:
      skip_test_gate:
        description: "Skip the test-gate check for an emergency release. Run only with --ref <tag>."
        required: false
        default: false
        type: boolean
      alias_only:
        description: "Publish only the datamodel-codegen alias of the release at --ref <tag> (the release itself is on PyPI)."
        required: false
        default: false
        type: boolean

env:
  dists-artifact-name: python-package-distributions
  alias-dists-artifact-name: alias-package-distributions

jobs:
  verify:
    name: Verify release gate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
    steps:
      - name: Validate release tag
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_REF" != "refs/tags/$RELEASE_TAG" ]; then
            echo "Publish must run from a release tag ref. Use: gh workflow run publish.yaml --ref <tag>" >&2
            exit 1
          fi
          python3 - <<'PY'
          import os
          import re
          import sys

          tag = os.environ["RELEASE_TAG"]
          if re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:rc[0-9]+|\+backport-[0-9]+)?", tag):
              sys.exit(0)
          print(f"Release tag {tag!r} must look like 0.66.3, 0.66.3rc1, or 0.2.11+backport-1.", file=sys.stderr)
          sys.exit(1)
          PY
      - name: Verify test-gate passed
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_test_gate == false }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          response="$(
            gh api "repos/${REPOSITORY}/commits/refs/tags/${RELEASE_TAG}/check-runs?check_name=test-gate&filter=latest"
          )"
          runs="$(
            jq -c '
              [
                .check_runs[]?
                | select(.name == "test-gate")
                | {
                    status,
                    conclusion,
                    completed_at,
                    started_at,
                    head_sha,
                    html_url,
                    run_id: (try ((.html_url // "") | capture("/actions/runs/(?<id>[0-9]+)/job/").id) catch "")
                  }
              ]
              | sort_by(.completed_at // .started_at // "")
              | reverse
              | .[]
            ' <<< "$response"
          )"
          if [ -z "$runs" ]; then
            echo "No test-gate check run was found for tag ${RELEASE_TAG}." >&2
            echo "Wait for Test on main to finish, then re-run Publish. For emergency releases, dispatch with skip_test_gate=true." >&2
            exit 1
          fi

          while IFS= read -r run; do
            run_id="$(jq -r '.run_id' <<< "$run")"
            head_sha="$(jq -r '.head_sha' <<< "$run")"
            if [ -z "$run_id" ]; then
              continue
            fi
            metadata="$(gh api "repos/${REPOSITORY}/actions/runs/${run_id}")"
            if ! jq -e --arg head_sha "$head_sha" \
              '.name == "Test" and .event == "push" and .head_branch == "main" and .head_sha == $head_sha' \
              <<< "$metadata" > /dev/null; then
              continue
            fi
            status="$(jq -r '.status' <<< "$run")"
            conclusion="$(jq -r '.conclusion' <<< "$run")"
            html_url="$(jq -r '.html_url' <<< "$run")"
            if [ "$status" != "completed" ]; then
              echo "test-gate for tag ${RELEASE_TAG} is ${status}; re-run Publish after it completes." >&2
              exit 1
            fi
            if [ "$conclusion" != "success" ]; then
              echo "test-gate for tag ${RELEASE_TAG} concluded ${conclusion}: ${html_url}" >&2
              exit 1
            fi
            exit 0
          done <<< "$runs"

          echo "Found test-gate check runs for tag ${RELEASE_TAG}, but none came from the Test workflow push on main." >&2
          echo "Wait for Test on main to finish, then re-run Publish. For emergency releases, dispatch with skip_test_gate=true." >&2
          exit 1
      - name: Report skipped test gate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_test_gate }}
        run: echo "::warning::test-gate verification was skipped for this manual release."

  build:
    needs:
      - verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Build package
        run: uv build --python 3.13 --python-preference only-managed --sdist --wheel . --out-dir dist
      - name: Store the distribution packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.dists-artifact-name }}
          path: dist/*

  build_alias:
    name: Build the datamodel-codegen alias
    # Its own job, so that an alias failure never stops the release. The alias pins the release it installs, so a local
    # backport version (+backport-N), which PyPI refuses, has none.
    if: ${{ !contains(github.ref_name, '+') }}
    needs:
      - verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Build the datamodel-codegen alias
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          alias=pypi-alias/datamodel-codegen/pyproject.toml
          sed -i -e "s/^version = \"0\.0\.0\"$/version = \"${VERSION}\"/" \
            -e "s/\"datamodel-code-generator\" \]$/\"datamodel-code-generator==${VERSION}\" ]/" "$alias"
          grep -qx "version = \"${VERSION}\"" "$alias"
          grep -qF "\"datamodel-code-generator==${VERSION}\" ]" "$alias"
          uv build --python 3.13 --python-preference only-managed --sdist --wheel pypi-alias/datamodel-codegen --out-dir dist-alias
      - name: Store the alias packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.alias-dists-artifact-name }}
          path: dist-alias/*

  release:
    name: Publish package to PyPI
    # Needs both builds, as release_alias does, so that both jobs wait for the pypi environment at the same time and one
    # approval starts both. A failed alias build does not stop the release.
    if: >-
      ${{ !cancelled() && needs.build.result == 'success' &&
      !(github.event_name == 'workflow_dispatch' && inputs.alias_only) }}
    needs:
      - build
      - build_alias
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/datamodel-code-generator/${{ github.ref_name }}
    permissions:
      id-token: write
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.dists-artifact-name }}
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true

  release_alias:
    name: Publish the datamodel-codegen alias to PyPI
    # Starts with release, so that one approval of the pypi environment starts both; it uploads only after pip finds the
    # release it pins, so that installing the alias always finds it. A failure here leaves the release as is.
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build_alias.result == 'success' }}
    needs:
      - build
      - build_alias
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/datamodel-codegen/${{ github.ref_name }}
    permissions:
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Wait until pip finds the release the alias pins
        # The alias installs only once its pinned release resolves; an alias-only run of a tag that has no release stops here.
        timeout-minutes: 25
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          python -m pip --disable-pip-version-check install --no-cache-dir --no-deps --upgrade -r requirements-pip.txt
          deadline=$((SECONDS + 1200))
          found_since=""
          while [ "$SECONDS" -lt "$deadline" ]; do
            rm -rf "$RUNNER_TEMP/pypi-release"
            if python -m pip --disable-pip-version-check download --quiet --no-cache-dir --no-deps \
                --dest "$RUNNER_TEMP/pypi-release" "datamodel-code-generator==${VERSION}"; then
              found_since=${found_since:-$SECONDS}
              if [ $((SECONDS - found_since)) -ge 180 ]; then
                exit 0
              fi
            else
              found_since=""
            fi
            sleep 15
          done
          echo "pip did not find datamodel-code-generator==${VERSION} on every lookup for 3 minutes within 20 minutes." >&2
          exit 1
      - name: Download the alias packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.alias-dists-artifact-name }}
          path: dist-alias/
      - name: Publish the alias to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist-alias/
          attestations: true
          # A rerun after a partial upload publishes the missing file; the ones already on PyPI are the same build input.
          skip-existing: true

  push_to_registry:
    name: Push Docker image to Docker Hub
    # Reads release's result directly, so that a failed or skipped alias build never skips the image.
    if: ${{ !cancelled() && needs.release.result == 'success' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    needs: release
    permissions:
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Docker meta
        id: docker_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: koxudaxi/datamodel-code-generator
          tags: |
            type=semver,pattern={{raw}}
      - name: Login to DockerHub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Wait until pip finds the release on PyPI
        timeout-minutes: 25
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          # Right after the upload, PyPI can answer some lookups without the new release, so one hit is not enough.
          python -m pip --disable-pip-version-check install --no-cache-dir --no-deps --upgrade -r requirements-pip.txt
          deadline=$((SECONDS + 1200))
          found_since=""
          while [ "$SECONDS" -lt "$deadline" ]; do
            rm -rf "$RUNNER_TEMP/pypi-release"
            if python -m pip --disable-pip-version-check download --quiet --no-cache-dir --no-deps \
                --dest "$RUNNER_TEMP/pypi-release" "datamodel-code-generator==${VERSION}"; then
              found_since=${found_since:-$SECONDS}
              if [ $((SECONDS - found_since)) -ge 180 ]; then
                exit 0
              fi
            else
              found_since=""
            fi
            sleep 15
          done
          echo "pip did not find datamodel-code-generator==${VERSION} on every lookup for 3 minutes within 20 minutes." >&2
          exit 1
      - name: Build Docker image for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          pull: true
          no-cache: true
          tags: datamodel-code-generator:smoke
          build-args: |
            VERSION=${{ github.ref_name }}
      - name: Smoke test Docker image
        uses: ./.github/actions/smoke-docker-image
        with:
          image: datamodel-code-generator:smoke
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: true
          pull: true
          no-cache: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          build-args: |
            VERSION=${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
