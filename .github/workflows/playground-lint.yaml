name: Playground Lint

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/playground-lint.yaml'
      - 'docs/assets/playground/**'
      - 'docs/playground.md'
      - 'pyproject.toml'
      - 'scripts/build_playground_assets.py'
      - 'tox.ini'
      - 'uv.lock'
      - 'zensical.toml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/playground-lint.yaml'
      - 'docs/assets/playground/**'
      - 'docs/playground.md'
      - 'pyproject.toml'
      - 'scripts/build_playground_assets.py'
      - 'tox.ini'
      - 'uv.lock'
      - 'zensical.toml'
  workflow_dispatch:

concurrency:
  group: playground-lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playground-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-suffix: playground-lint
      - name: Setup Python
        run: uv python install 3.14.6
        env:
          UV_PYTHON_PREFERENCE: "only-managed"
      - name: Install tox
        run: uv tool install --python-preference only-managed --python 3.14.6 tox --with tox-uv
      - name: Run playground lint
        run: tox run -e playground-lint
        env:
          UV_PYTHON_PREFERENCE: "only-managed"
