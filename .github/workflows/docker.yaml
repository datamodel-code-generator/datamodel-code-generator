name: Docker

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - .github/actions/smoke-docker-image/action.yml
      - .github/workflows/docker.yaml
      - .github/workflows/publish.yaml
      - tests/data/jsonschema/simple_string.json
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - .github/actions/smoke-docker-image/action.yml
      - .github/workflows/docker.yaml
      - .github/workflows/publish.yaml
      - tests/data/jsonschema/simple_string.json
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Resolve latest release version
        id: release
        run: |
          set -euo pipefail
          version="$(
            curl -fsSL https://pypi.org/pypi/datamodel-code-generator/json \
              | python3 -c 'import json, sys; print(json.load(sys.stdin)["info"]["version"])'
          )"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          pull: true
          no-cache: true
          tags: datamodel-code-generator:smoke
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
      - name: Smoke test Docker image
        uses: ./.github/actions/smoke-docker-image
        with:
          image: datamodel-code-generator:smoke
