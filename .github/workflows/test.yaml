  coverage:
    name: combine coverage
    runs-on: ubuntu-latest
    needs:
      - test-coverage
      - test-formatter-coverage
      - test-http-backends
      - test-shard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-local-path: .tox/uv-cache
          cache-dependency-glob: |
            pyproject.toml
            tox.ini
            uv.lock
          cache-suffix: coverage
      - name: Install tox
        run: uv tool install --python-preference only-managed --python 3.13 tox --with tox-uv
      - name: Setup coverage tool
        run: tox run -e coverage --notest
        env:
          UV_PYTHON_PREFERENCE: only-managed
      - name: Download coverage data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: .tox/coverage-input
          pattern: .coverage.*
          merge-multiple: false
      - name: Validate coverage inputs
        run: python scripts/ci_coverage.py prepare .tox/coverage-input --run-id "$GITHUB_RUN_ID" --sha "$GITHUB_SHA"
      - name: Combine and report coverage
        id: coverage
        run: |
          .tox/coverage/bin/coverage combine
          .tox/coverage/bin/coverage xml -o .tox/coverage.xml
          .tox/coverage/bin/diff-cover --compare-branch "${DIFF_AGAINST:-origin/main}" .tox/coverage.xml
          .tox/coverage/bin/coverage report --fail-under=100 --skip-covered --show-missing
        continue-on-error: true
        env:
          COVERAGE_FILE: .tox/.coverage
      - name: Show uncovered lines on failure
        if: steps.coverage.outcome == 'failure'
        run: |
          echo "::error::Coverage check failed. Lines not covered:"
          COVERAGE_FILE=.tox/.coverage .tox/coverage/bin/coverage report --show-missing --fail-under=0 | grep -v "100%"
      - name: Generate HTML report on failure
        if: steps.coverage.outcome == 'failure'
        run: COVERAGE_FILE=.tox/.coverage .tox/coverage/bin/coverage html --fail-under=0 -d .tox/htmlcov
      - name: Upload HTML report
        if: steps.coverage.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: html-report
          path: .tox/htmlcov
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7
        with:
          flags: unittests
          files: .tox/coverage.xml
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Fail if coverage check failed
        if: steps.coverage.outcome == 'failure'
        run: exit 1

  check:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-local-path: .tox/uv-cache
          cache-dependency-glob: |
            pyproject.toml
            tox.ini
            uv.lock
          cache-suffix: check
      - name: Setup docs Python
        run: uv python install 3.14.6
      - name: Install tox
        run: uv tool install --python-preference only-managed --python 3.13 tox --with tox-uv
      - name: Setup check suites
        id: setup-check-suites
        continue-on-error: true
        run: |
          set -uo pipefail
          failed=0
          for tox_env in type docs pkg_meta cli-doc-coverage; do
            if ! tox r -vv --notest --skip-missing-interpreters false -e "$tox_env"; then
              failed=1
            fi
          done
          exit "$failed"
        env:
          UV_PYTHON_PREFERENCE: "only-managed"
      - name: Run check suites
        id: run-check-suites
        continue-on-error: true
        run: |
          set -uo pipefail
          failed=0
          for tox_env in type docs pkg_meta cli-doc-coverage; do
            if ! tox run --skip-uv-sync --skip-pkg-install -e "$tox_env"; then
              failed=1
            fi
          done
          exit "$failed"
        env:
          UV_PYTHON_PREFERENCE: "only-managed"
      - name: Check compiled templates
        id: compiled-templates
        continue-on-error: true
        run: tox exec -e type -- python scripts/compile_builtin_templates.py --check
      - name: Fail if any check suite failed
        if: always()
        run: |
          setup_outcome='${{ steps.setup-check-suites.outcome }}'
          run_outcome='${{ steps.run-check-suites.outcome }}'
          compiled_templates_outcome='${{ steps.compiled-templates.outcome }}'

          echo "setup check suites: ${setup_outcome}"
          echo "run check suites: ${run_outcome}"
          echo "compiled templates: ${compiled_templates_outcome}"

          [ "${setup_outcome}" = "success" ] || exit 1
          [ "${run_outcome}" = "success" ] || exit 1
          [ "${compiled_templates_outcome}" = "success" ] || exit 1

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-local-path: .tox/uv-cache
          cache-dependency-glob: |
            pyproject.toml
            tox.ini
            uv.lock
          cache-suffix: e2e
      - name: Install tox
        run: uv tool install --python-preference only-managed --python 3.13 tox --with tox-uv
      - name: Setup e2e suites
        id: setup-e2e-suites
        continue-on-error: true
        run: |
          set -uo pipefail
          failed=0
          for tox_env in \
            w3c-xmlschema-e2e \
            jsonschema-suite-conformance \
            asyncapi-spec-json-schemas-e2e \
            apache-avro-schema-pass-e2e \
            protobuf-official-e2e; do
            if ! tox r -vv --notest --skip-missing-interpreters false -e "$tox_env"; then
              failed=1
            fi
          done
          exit "$failed"
        env:
          UV_PYTHON_PREFERENCE: "only-managed"
      - name: Restore W3C XML Schema Test Suite
        id: cache-w3c-xsdtests
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tox/w3c-xsdtests
          key: e2e-xsdtests-7bc3365c652a322f3d762021b3879eb92dae7e30
      - name: Checkout W3C XML Schema Test Suite
        id: checkout-w3c-xsdtests
        if: steps.cache-w3c-xsdtests.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          git clone --filter=blob:none https://github.com/w3c/xsdtests.git .tox/w3c-xsdtests
          git -C .tox/w3c-xsdtests checkout 7bc3365c652a322f3d762021b3879eb92dae7e30
      - name: Save W3C XML Schema Test Suite
        if: steps.cache-w3c-xsdtests.outputs.cache-hit != 'true' && steps.checkout-w3c-xsdtests.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tox/w3c-xsdtests
          key: e2e-xsdtests-7bc3365c652a322f3d762021b3879eb92dae7e30
      - name: Run W3C XML Schema e2e suite
        id: run-w3c-xmlschema-e2e
        continue-on-error: true
        run: |
          tox run --skip-uv-sync --skip-pkg-install -e w3c-xmlschema-e2e -- \
            .tox/w3c-xsdtests \
            --expected-documents 5284 \
            --expected-unique-documents 5283
        env:
          UV_PYTHON_PREFERENCE: "only-managed"
      - name: Restore JSON-Schema-Test-Suite
