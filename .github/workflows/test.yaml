name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTEST_COVERAGE_REPORT: ""

permissions:
  contents: read

jobs:
  test-coverage:
    name: ${{ matrix.name }} on Ubuntu
    strategy:
      fail-fast: false
      matrix:
        include:
          - tox_env: migration-legacy
            name: migration-legacy
            coverage_name: migration-legacy
          - tox_env: migration-boundary
            name: migration-boundary
            coverage_name: migration-boundary
          - tox_env: pydantic200
            name: pydantic200
            coverage_name: pydantic200
          - tox_env: pydantic20
            name: pydantic20
            coverage_name: pydantic20
          - tox_env: pydantic25
            name: pydantic25
            coverage_name: pydantic25
          - tox_env: pydantic213
            name: pydantic213
            coverage_name: pydantic213
    runs-on: ubuntu-24.04
    env:
      OS: ubuntu-24.04
      TOX_ENV: ${{ matrix.tox_env }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 1
        persist-credentials: false
    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        enable-cache: true
        cache-local-path: .tox/uv-cache
        cache-dependency-glob: |
          pyproject.toml
          tox.ini
          uv.lock
        cache-suffix: "${{ matrix.tox_env }}"
    - name: Install tox
      run: uv tool install --python-preference only-managed --python 3.13 tox --with tox-uv
    - name: Setup Python test environment
      run: |
        tox run -vv --notest --skip-missing-interpreters false -e "$TOX_ENV"
      shell: bash
      env:
        UV_PYTHON_PREFERENCE: "only-managed"
    - name: Run test suite
      run: |
        tox run --skip-uv-sync --skip-pkg-install -e "$TOX_ENV"
      shell: bash
      env:
        UV_PYTHON_PREFERENCE: "only-managed"
    - name: Rename coverage report file
      run: |
        import os

        os.rename(
            f".tox/.coverage.{os.environ['TOX_ENV']}",
            f".tox/.coverage.${{ matrix.coverage_name }}-{os.environ['OS']}",
        )
      shell: python
    - name: Record coverage provenance
      run: python scripts/ci_coverage.py record ".tox/$COVERAGE_NAME" --run-id "$GITHUB_RUN_ID" --sha "$GITHUB_SHA"
      shell: bash
      env:
        COVERAGE_NAME: .coverage.${{ matrix.coverage_name }}-ubuntu-24.04
    - name: Upload coverage data
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        include-hidden-files: true
        name: .coverage.${{ matrix.coverage_name }}-ubuntu-24.04
        path: ".tox/.coverage.*"
        retention-days: 3

  test-formatter-coverage:
    name: ${{ matrix.name }} coverage on Ubuntu
    strategy:
      fail-fast: false
      matrix:
        include:
          - tox_env: py312-blacklatest-parallel
            name: py312-black-latest
            coverage_name: py312-black-latest
            pytest_workers: 0
          - tox_env: py312-black22-parallel
            name: py312-black22
            coverage_name: py312-black22
            pytest_workers: auto
    runs-on: ubuntu-24.04
    env:
      OS: ubuntu-24.04
      TOX_ENV: ${{ matrix.tox_env }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 1
        persist-credentials: false
    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        enable-cache: true
        cache-local-path: .tox/uv-cache
        cache-dependency-glob: |
          pyproject.toml
          tox.ini
          uv.lock
        cache-suffix: "${{ matrix.tox_env }}-coverage"
    - name: Install tox
      run: uv tool install --python-preference only-managed --python 3.13 tox --with tox-uv
    - name: Setup Python test environment
      run: |
        tox run -vv --notest --skip-missing-interpreters false -e "$TOX_ENV"
      shell: bash
      env:
        UV_PYTHON_PREFERENCE: "only-managed"
    - name: Select formatter coverage tests
      run: |
        case "$TOX_ENV" in
          py312-blacklatest-parallel)
            cat > .tox/formatter-coverage-tests.txt <<'EOF'
        tests/test_main_kr.py::test_main_no_file
        EOF
            ;;
          py312-black22-parallel)
            cat > .tox/formatter-coverage-tests.txt <<'EOF'
        tests/test_types.py
        tests/main/jsonschema/test_main_jsonschema.py::test_main_keep_model_order_matrix_keep_model_order_field_references[3.13-True-False]
        tests/main/jsonschema/test_main_jsonschema.py::test_main_combined_array
        tests/main/jsonschema/test_main_jsonschema.py::test_main_strict_types_all
        tests/main/openapi/test_main_openapi.py::test_pyproject
        tests/main/openapi/test_main_openapi.py::test_main_use_generic_container_types
        tests/main/openapi/test_main_openapi.py::test_main_use_generic_container_types_standard_collections
        tests/main/openapi/test_main_openapi.py::test_main_openapi_enum_models_as_literal_all
        tests/main/openapi/test_main_openapi.py::test_main_openapi_enum_models_as_literal
        tests/parser/test_openapi.py::test_openapi_parser_with_query_parameters
        tests/parser/test_openapi.py::test_openapi_parser_with_include_path_parameters
        tests/test_main_kr.py::test_main_no_file
        tests/test_main_kr.py::test_pyproject
        EOF
            ;;
          *)
            echo "Unsupported formatter coverage tox env: $TOX_ENV" >&2
            exit 1
            ;;
        esac
      shell: bash
    - name: Run formatter coverage tests
      run: |
        mapfile -t test_paths < .tox/formatter-coverage-tests.txt
        tox run --skip-uv-sync --skip-pkg-install -e "$TOX_ENV" -- \
          -n "${{ matrix.pytest_workers }}" \
          --dist=worksteal \
          --color=yes \
          -m "not perf" \
          --cov datamodel_code_generator \
          --cov tests \
          --cov-config=pyproject.toml \
          --cov-fail-under=0 \
          --no-cov-on-fail \
          --cov-report= \
          "${test_paths[@]}"
      shell: bash
      env:
        UV_PYTHON_PREFERENCE: "only-managed"
    - name: Rename coverage report file
      run: |
        import os

        os.rename(
            f".tox/.coverage.{os.environ['TOX_ENV']}",
            f".tox/.coverage.${{ matrix.coverage_name }}-{os.environ['OS']}",
        )
      shell: python
    - name: Record coverage provenance
      run: python scripts/ci_coverage.py record ".tox/$COVERAGE_NAME" --run-id "$GITHUB_RUN_ID" --sha "$GITHUB_SHA"
      shell: bash
      env:
        COVERAGE_NAME: .coverage.${{ matrix.coverage_name }}-ubuntu-24.04
    - name: Upload coverage data
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        include-hidden-files: true
        name: .coverage.${{ matrix.coverage_name }}-ubuntu-24.04
        path: ".tox/.coverage.*"
        retention-days: 3

  test-http-backends:
    name: >-
      ${{ matrix.name }} on
      ${{ matrix.os == 'windows-latest' && 'Windows' || (matrix.os == 'macos-latest' && 'macOS' || 'Ubuntu') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - tox_env: httpx-e2e
            name: HTTPX HTTP(S) e2e
            os: ubuntu-24.04
            coverage: true
          - tox_env: httpx2-min-e2e
            name: HTTPX2 minimum HTTP(S) e2e
            os: ubuntu-24.04
            coverage: true
    runs-on: ${{ matrix.os }}
    env: &test-http-backends-env
      OS: ${{ matrix.os }}
      TOX_ENV: ${{ matrix.tox_env }}
    steps: &test-http-backends-steps
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 1
        persist-credentials: false
    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        enable-cache: true
        cache-local-path: .tox/uv-cache
        cache-dependency-glob: |
          pyproject.toml
          tox.ini
          uv.lock
        cache-suffix: "${{ matrix.tox_env }}-${{ matrix.os }}"
    - name: Install tox
      run: uv tool install --python-preference only-managed --python 3.13 tox --with tox-uv
    - name: Setup HTTP backend e2e environment
      run: tox run -vv --notest --skip-missing-interpreters false -e "$TOX_ENV"
      shell: bash
      env:
        UV_PYTHON_PREFERENCE: "only-managed"
    - name: Run HTTP backend e2e suite
      run: tox run --skip-uv-sync --skip-pkg-install -e "$TOX_ENV"
      shell: bash
      env:
        UV_PYTHON_PREFERENCE: "only-managed"
    - name: Rename coverage report file
      if: matrix.coverage == true
      run: |
        import os

        os.rename(
            f".tox/.coverage.{os.environ['TOX_ENV']}",
            f".tox/.coverage.{os.environ['TOX_ENV']}-{os.environ['OS']}",
        )
      shell: python
    - name: Record coverage provenance
      if: matrix.coverage == true
      run: python scripts/ci_coverage.py record ".tox/$COVERAGE_NAME" --run-id "$GITHUB_RUN_ID" --sha "$GITHUB_SHA"
      shell: bash
      env:
        COVERAGE_NAME: .coverage.${{ matrix.tox_env }}-${{ matrix.os }}
    - name: Upload coverage data
      if: matrix.coverage == true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        include-hidden-files: true
        name: .coverage.${{ matrix.tox_env }}-${{ matrix.os }}
        path: ".tox/.coverage.*"
        retention-days: 3

  test-http-backends-nocov:
    name: >-
      ${{ matrix.name }} on
      ${{ matrix.os == 'windows-latest' && 'Windows' || (matrix.os == 'macos-latest' && 'macOS' || 'Ubuntu') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - tox_env: httpx2-max-nocov-e2e
            name: HTTPX2 latest HTTP(S) e2e
            os: windows-latest
            coverage: false
          - tox_env: httpx-both-nocov-e2e
            name: HTTPX + HTTPX2 HTTP(S) e2e
            os: macos-latest
            coverage: false
    runs-on: ${{ matrix.os }}
    env: *test-http-backends-env
    steps: *test-http-backends-steps

  test-shard:
    name: >-
      ${{ matrix.name }} on
      ${{ matrix.os == 'windows-latest' && 'Windows' || (matrix.os == 'macos-latest' && 'macOS' || 'Ubuntu') }}
      shard ${{ matrix.shard }}/${{ matrix.shard_total }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - tox_env: py314-parallel
            name: "3.14"
            os: ubuntu-24.04
            coverage: true
            shard: 1
            shard_total: 2
            extra_tests: tests/cli_doc/test_cli_options_sync.py
          - tox_env: py314-parallel
            name: "3.14"
            os: ubuntu-24.04
            coverage: true
            shard: 2
            shard_total: 2
          - tox_env: py313-parallel
            name: "3.13"
            os: ubuntu-24.04
            coverage: true
            shard: 1
            shard_total: 3
          - tox_env: py313-parallel
            name: "3.13"
            os: ubuntu-24.04
            coverage: true
            shard: 2
            shard_total: 3
          - tox_env: py313-parallel
            name: "3.13"
            os: ubuntu-24.04
            coverage: true
            shard: 3
            shard_total: 3
          - tox_env: py312-parallel
            name: "3.12"
            os: ubuntu-24.04
            coverage: true
            shard: 1
            shard_total: 3
          - tox_env: py312-parallel
            name: "3.12"
            os: ubuntu-24.04
            coverage: true
            shard: 2
            shard_total: 3
          - tox_env: py312-parallel
            name: "3.12"
            os: ubuntu-24.04
            coverage: true
            shard: 3
            shard_total: 3
          - tox_env: py311-parallel
            name: "3.11"
            os: ubuntu-24.04
            coverage: true
            shard: 1
            shard_total: 3
          - tox_env: py311-parallel
            name: "3.11"
            os: ubuntu-24.04
            coverage: true
            shard: 2
            shard_total: 3
          - tox_env: py311-parallel
            name: "3.11"
            os: ubuntu-24.04
            coverage: true
            shard: 3
            shard_total: 3
          - tox_env: py310-parallel
            name: "3.10"
            os: ubuntu-24.04
            coverage: true
            shard: 1
            shard_total: 3
          - tox_env: py310-parallel
            name: "3.10"
            os: ubuntu-24.04
            coverage: true
            shard: 2
            shard_total: 3
          - tox_env: py310-parallel
            name: "3.10"
            os: ubuntu-24.04
            coverage: true
            shard: 3
            shard_total: 3
    runs-on: ${{ matrix.os }}
    env: &test-shard-env
      OS: ${{ matrix.os }}
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_TOTAL: ${{ matrix.shard_total }}
      TOX_ENV: ${{ matrix.tox_env }}
      EXTRA_TESTS: ${{ matrix.extra_tests }}
      SHARD_PROFILE: ${{ matrix.os == 'windows-latest' && 'windows' || (matrix.os == 'macos-latest' && 'macos' || (matrix.name == '3.14' && 'default' || 'legacy')) }}
      WINDOWS_TOX_UV_VERSION: "1.35.2"
      WINDOWS_TOX_VERSION: "4.56.1"
      WINDOWS_UV_VERSION: "0.11.26"
    steps: &test-shard-steps
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 1
        persist-credentials: false
    - name: Install uv (Windows)
      if: matrix.os == 'windows-latest'
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        version: ${{ env.WINDOWS_UV_VERSION }}
        enable-cache: true
        cache-local-path: .tox/uv-cache
        cache-python: true
        cache-dependency-glob: |
          pyproject.toml
          tox.ini
          uv.lock
        cache-suffix: "windows-${{ matrix.tox_env }}-uv${{ env.WINDOWS_UV_VERSION }}-tox${{ env.WINDOWS_TOX_VERSION }}-toxuv${{ env.WINDOWS_TOX_UV_VERSION }}"
        save-cache: ${{ matrix.shard == 1 }}
    - name: Install the latest version of uv
      if: matrix.os != 'windows-latest'
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        enable-cache: true
        cache-local-path: .tox/uv-cache
        cache-dependency-glob: |
          pyproject.toml
          tox.ini
          uv.lock
        cache-suffix: "${{ matrix.tox_env }}-${{ matrix.os }}-shard"
        save-cache: ${{ matrix.shard == 1 }}
    - name: Install tox (Windows)
      if: matrix.os == 'windows-latest'
      run: uv tool install --python-preference only-managed --python 3.13 "tox==${{ env.WINDOWS_TOX_VERSION }}" --with "tox-uv==${{ env.WINDOWS_TOX_UV_VERSION }}"
    - name: Install tox
      if: matrix.os != 'windows-latest'
      run: uv tool install --python-preference only-managed --python 3.13 tox --with tox-uv
    - name: Setup Python test environment
      run: |
        tox run -vv --notest --skip-missing-interpreters false -e "$TOX_ENV"
      shell: bash
      env:
        UV_PYTHON_PREFERENCE: "only-managed"
    - name: Select test shard
      run: |
        python scripts/select_ci_test_shard.py --profile "$SHARD_PROFILE" --write-recipe .tox/ci-shard-recipe.json
        python scripts/select_ci_test_shard.py "$SHARD_INDEX" "$SHARD_TOTAL" \
          --recipe .tox/ci-shard-recipe.json | tee .tox/ci-shard-tests.txt
        if [ -n "$EXTRA_TESTS" ]; then
          printf '%s\n' "$EXTRA_TESTS" >> .tox/ci-shard-tests.txt
        fi
      shell: bash
    - name: Run sharded test suite
      run: |
        test_paths=()
        while IFS= read -r test_path; do
          test_paths+=("$test_path")
        done < .tox/ci-shard-tests.txt
        if [ "${#test_paths[@]}" -eq 0 ]; then
          echo "No tests selected for this shard." >&2
          exit 1
        fi
        coverage_args=()
        if [ "${{ matrix.coverage }}" = "true" ]; then
          coverage_args=(
            --cov datamodel_code_generator
            --cov tests
            --cov scripts.ci_coverage
            --cov scripts.select_ci_test_shard
            --cov-config=pyproject.toml
            --cov-fail-under=0
            --no-cov-on-fail
            --cov-report=
          )
        fi
        tox run --skip-uv-sync --skip-pkg-install -e "$TOX_ENV" -- \
          -n auto \
          --dist=worksteal \
          --color=yes \
          -m "not perf" \
          --junitxml ".tox/junit.$TOX_ENV-shard$SHARD_INDEX-$OS.xml" \
          "${coverage_args[@]}" \
          "${test_paths[@]}"
      shell: bash
      env:
        UV_PYTHON_PREFERENCE: "only-managed"
    - name: Upload test durations
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        include-hidden-files: true
        name: junit.${{ matrix.tox_env }}-shard${{ matrix.shard }}-${{ matrix.os }}
        path: ".tox/junit.*"
        retention-days: 3
    - name: Rename coverage report file
      if: matrix.coverage == true
      run: |
        import os

        os.rename(
            f".tox/.coverage.{os.environ['TOX_ENV']}",
            f".tox/.coverage.{os.environ['TOX_ENV']}-shard{os.environ['SHARD_INDEX']}-{os.environ['OS']}",
        )
      shell: python
    - name: Record coverage provenance
      if: matrix.coverage == true
      run: python scripts/ci_coverage.py record ".tox/$COVERAGE_NAME" --run-id "$GITHUB_RUN_ID" --sha "$GITHUB_SHA"
      shell: bash
      env:
        COVERAGE_NAME: .coverage.${{ matrix.tox_env }}-shard${{ matrix.shard }}-${{ matrix.os }}
    - name: Upload coverage data
      if: matrix.coverage == true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        include-hidden-files: true
        name: .coverage.${{ matrix.tox_env }}-shard${{ matrix.shard }}-${{ matrix.os }}
        path: ".tox/.coverage.*"
        retention-days: 3

  test-shard-nocov:
    name: >-
      ${{ matrix.name }} on
      ${{ matrix.os == 'windows-latest' && 'Windows' || (matrix.os == 'macos-latest' && 'macOS' || 'Ubuntu') }}
      shard ${{ matrix.shard }}/${{ matrix.shard_total }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - tox_env: py314-nocov-parallel
            name: "3.14"
            os: windows-latest
            coverage: false
            extra_tests: ""
            shard: 1
            shard_total: 3
          - tox_env: py314-nocov-parallel
            name: "3.14"
            os: windows-latest
            coverage: false
            extra_tests: ""
            shard: 2
            shard_total: 3
          - tox_env: py314-nocov-parallel
            name: "3.14"
            os: windows-latest
            coverage: false
            extra_tests: ""
            shard: 3
            shard_total: 3
          - tox_env: py313-nocov-parallel
            name: "3.13"
            os: windows-latest
            coverage: false
            extra_tests: ""
            shard: 1
            shard_total: 3
          - tox_env: py313-nocov-parallel
            name: "3.13"
            os: windows-latest
            coverage: false
            extra_tests: ""
            shard: 2
            shard_total: 3
          - tox_env: py313-nocov-parallel
            name: "3.13"
            os: windows-latest
            coverage: false
            extra_tests: ""
            shard: 3
            shard_total: 3
          - tox_env: py312-nocov-parallel
            name: "3.12"
            os: windows-latest
            coverage: false
            extra_tests: ""
            shard: 1
            shard_total: 3
          - tox_env: py312-nocov-parallel
            name: "3.12"
            os: windows-latest
            coverage: false
            extra_tests: ""
            shard: 2
            shard_total: 3
          - tox_env: py312-nocov-parallel
            name: "3.12"
            os: windows-latest
            coverage: false
            extra_tests: ""
            shard: 3
            shard_total: 3
          - tox_env: py311-nocov-parallel
            name: "3.11"
            os: windows-latest
            coverage: false
            extra_tests: ""
            shard: 1
            shard_total: 3
          - tox_env: py311-nocov-parallel
            name: "3.11"
            os: windows-latest
            coverage: false
            extra_tests: ""
            shard: 2
            shard_total: 3
          - tox_env: py311-nocov-parallel
            name: "3.11"
            os: windows-latest
            coverage: false
            extra_tests: ""
            shard: 3
            shard_total: 3
          - tox_env: py310-nocov-parallel
            name: "3.10"
            os: windows-latest
            coverage: false
            extra_tests: ""
            shard: 1
            shard_total: 3
          - tox_env: py310-nocov-parallel
            name: "3.10"
            os: windows-latest
            coverage: false
            extra_tests: ""
            shard: 2
            shard_total: 3
          - tox_env: py310-nocov-parallel
            name: "3.10"
            os: windows-latest
            coverage: false
            extra_tests: ""
            shard: 3
            shard_total: 3
          - tox_env: py314-nocov-parallel
            name: "3.14"
            os: macos-latest
            coverage: false
            extra_tests: tests/cli_doc/test_cli_options_sync.py
            shard: 1
            shard_total: 2
          - tox_env: py314-nocov-parallel
            name: "3.14"
            os: macos-latest
            coverage: false
            extra_tests: ""
            shard: 2
            shard_total: 2
          - tox_env: py313-nocov-parallel
            name: "3.13"
            os: macos-latest
            coverage: false
            extra_tests: tests/cli_doc/test_cli_options_sync.py
            shard: 1
            shard_total: 2
          - tox_env: py313-nocov-parallel
            name: "3.13"
            os: macos-latest
            coverage: false
            extra_tests: ""
            shard: 2
            shard_total: 2
          - tox_env: py312-nocov-parallel
            name: "3.12"
            os: macos-latest
            coverage: false
            extra_tests: tests/cli_doc/test_cli_options_sync.py
            shard: 1
            shard_total: 2
          - tox_env: py312-nocov-parallel
            name: "3.12"
            os: macos-latest
