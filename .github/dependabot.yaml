version: 2
updates:
- package-ecosystem: uv
  directory: "/"
  cooldown:
    default-days: 3
    # The owner's own tool: its pins follow its releases the same day, as pyproject.toml exempts it from exclude-newer.
    exclude:
    - heki
  # Move only uv.lock: the ranges in pyproject.toml are what users install.
  versioning-strategy: lockfile-only
  schedule:
    interval: daily
    time: "10:00"
    timezone: Asia/Tokyo
  open-pull-requests-limit: 10
  allow:
  - dependency-type: direct
  - dependency-type: indirect
  ignore:
  - dependency-name: black
  - dependency-name: isort
- package-ecosystem: github-actions
  directory: "/"
  cooldown:
    default-days: 3
  schedule:
    interval: weekly
    day: thursday
    time: "10:30"
    timezone: Asia/Tokyo
  open-pull-requests-limit: 10
  groups:
    github-actions:
      patterns:
      - "*"
- package-ecosystem: docker
  directory: "/"
  cooldown:
    default-days: 3
  schedule:
    interval: weekly
    day: thursday
    time: "10:45"
    timezone: Asia/Tokyo
  open-pull-requests-limit: 5
