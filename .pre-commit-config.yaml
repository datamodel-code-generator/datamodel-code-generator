ci:
  autofix_commit_msg: "style: auto-fix by pre-commit.ci"
  skip: [readme, config-types, schema-docs, compiled-templates]

repos:
- repo: https://github.com/python-jsonschema/check-jsonschema
  rev: 0.38.0
  hooks:
    - id: check-github-workflows
      args: [ "--verbose" ]
- repo: https://github.com/tox-dev/tox-ini-fmt
  rev: "1.9.0"
  hooks:
    - id: tox-ini-fmt
      args: ["-p", "fix"]
- repo: https://github.com/tox-dev/pyproject-fmt
  rev: v2.29.4
  hooks:
    - id: pyproject-fmt
      args: ["--max-supported-python=3.14"]
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: 'v0.16.7'
  hooks:
  - id: ruff-format
    exclude: "^tests/data|^src/datamodel_code_generator/_types/|^src/datamodel_code_generator/model/_compiled_templates/"
  - id: ruff
    exclude: "^tests/data|^src/datamodel_code_generator/_types/|^src/datamodel_code_generator/model/_compiled_templates/"
    # Autouse fixtures intentionally isolate shared state and block accidental network access.
    args: ["--preview", "--fix", "--unsafe-fixes", "--exit-non-zero-on-fix", "--extend-ignore", "D421,PLW0717,RUF067,RUF069,RUF074,RUF075,RUF105,pytest-fixture-autouse"]
- repo: https://github.com/codespell-project/codespell
  rev: v2.4.3
  hooks:
  - id: codespell
    additional_dependencies:
    - tomli
    exclude: "^tests/|^CODE_OF_CONDUCT.md|^docs/cli-reference/"
- repo: local
  hooks:
  - id: readme
    name: Update README command help
    entry: bash -c '[ -x .tox/fix/bin/python ] && PYTHON=.tox/fix/bin/python || PYTHON=.tox/fix/Scripts/python; test -x "$PYTHON" || tox run -e fix --notest -qq; "$PYTHON" scripts/update_command_help_on_markdown.py'
    language: system
    files: ^(src/datamodel_code_generator/arguments\.py|README\.md|docs/index\.md)$
    pass_filenames: false
  - id: config-types
    name: Generate config TypedDicts
    entry: bash -c '[ -x .tox/dev/bin/python ] && PREFIX=.tox/dev/bin || PREFIX=.tox/dev/Scripts; test -x "$PREFIX/python" || tox run -e dev --notest -qq; "$PREFIX/datamodel-codegen" --profile generate-config-dict && "$PREFIX/datamodel-codegen" --profile parser-config-dicts && "$PREFIX/datamodel-codegen" --profile parse-config-dict'
    language: system
    files: ^src/datamodel_code_generator/config\.py$
    pass_filenames: false
  - id: schema-docs
    name: Update schema feature documentation
    entry: bash -c '[ -x .tox/schema-docs/bin/python ] && PYTHON=.tox/schema-docs/bin/python || PYTHON=.tox/schema-docs/Scripts/python; test -x "$PYTHON" || tox run -e schema-docs --notest -qq; "$PYTHON" scripts/build_schema_docs.py'
    language: system
    files: ^(src/datamodel_code_generator/parser/schema_version\.py|scripts/build_schema_docs\.py|docs/supported_formats\.md)$
    pass_filenames: false
  - id: generation-store-usage
    name: Check parser GenerationStore usage
    entry: python scripts/check_generation_store_usage.py
    language: python
    files: ^src/datamodel_code_generator/parser/.*\.py$
    pass_filenames: false
  - id: architecture-boundaries
    name: Check architecture boundaries
    entry: python scripts/check_architecture_boundaries.py
    language: python
    files: ^(src/datamodel_code_generator/.*\.py|scripts/check_architecture_boundaries\.py)$
    pass_filenames: false
  - id: compiled-templates
    name: Check generated built-in template renderers
    entry: bash -c '[ -x .tox/dev/bin/python ] && PYTHON=.tox/dev/bin/python || PYTHON=.tox/dev/Scripts/python; test -x "$PYTHON" || tox run -e dev --notest -qq; "$PYTHON" scripts/compile_builtin_templates.py --check'
    language: system
    files: ^(src/datamodel_code_generator/model/template/.*\.jinja2|scripts/_template_compiler/.*\.py|scripts/compile_builtin_templates\.py|src/datamodel_code_generator/model/_compiled_template_runtime\.py|src/datamodel_code_generator/model/_compiled_templates/.*\.py)$
    pass_filenames: false
