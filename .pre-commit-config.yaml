ci:
  autofix_commit_msg: "style: auto-fix by pre-commit.ci"
  autofix_prs: false
  skip: [readme, config-types, schema-docs, compiled-templates, heki-contracts]

repos:
- repo: https://github.com/python-jsonschema/check-jsonschema
  rev: a76b92851fc9eede9f9bc4073eb55202f34eb0df  # frozen: 0.39.0
  hooks:
    - id: check-github-workflows
      args: [ "--verbose" ]
    - id: check-dependabot
- repo: https://github.com/tox-dev/tox-ini-fmt
  rev: 5958832392866c69b12c4b675ebf6af8ea38be85  # frozen: 1.10.2
  hooks:
    - id: tox-ini-fmt
      args: ["-p", "fix"]
- repo: https://github.com/tox-dev/pyproject-fmt
  rev: 3c6e76e10abcae02303212289efed3413350769c  # frozen: v2.30.6
  hooks:
    - id: pyproject-fmt
      args: ["--max-supported-python=3.15"]
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: c0f278f1254ccc8fb09676bcdb8d847e7db493e5  # frozen: v0.17.4
  hooks:
  - id: ruff-format
    exclude: "^tests/data|^src/datamodel_code_generator/_types/|^src/datamodel_code_generator/(model|_fastapi|_client)/_compiled_templates/"
  - id: ruff
    exclude: "^tests/data|^src/datamodel_code_generator/_types/|^src/datamodel_code_generator/(model|_fastapi|_client)/_compiled_templates/"
    # Autouse fixtures intentionally isolate shared state and block accidental network access.
    args: ["--preview", "--fix", "--unsafe-fixes", "--exit-non-zero-on-fix", "--extend-ignore", "D421,PLW0717,RUF067,RUF069,RUF074,RUF075,RUF105,pytest-fixture-autouse"]
- repo: https://github.com/codespell-project/codespell
  rev: 57b21406f092110c18776e39b0bda50d37c945c8  # frozen: v2.4.3
  hooks:
  - id: codespell
    additional_dependencies:
    - tomli
    exclude: "^tests/|^CODE_OF_CONDUCT.md|^docs/cli-reference/"
- repo: local
  hooks:
  - id: readme
    name: Update README command help
    entry: bash -c 'test -x .tox/fix/bin/python || test -x .tox/fix/Scripts/python || tox run -e fix --notest -qq; [ -x .tox/fix/bin/python ] && PYTHON=.tox/fix/bin/python || PYTHON=.tox/fix/Scripts/python; "$PYTHON" scripts/update_command_help_on_markdown.py'
    language: system
    files: ^(src/datamodel_code_generator/arguments\.py|README\.md|docs/index\.md|scripts/update_command_help_on_markdown\.py|scripts/build_cli_docs\.py)$
    pass_filenames: false
  - id: config-types
    name: Generate config TypedDicts
    entry: bash -c 'test -x .tox/dev/bin/python || test -x .tox/dev/Scripts/python || tox run -e dev --notest -qq; [ -x .tox/dev/bin/python ] && PREFIX=.tox/dev/bin || PREFIX=.tox/dev/Scripts; "$PREFIX/datamodel-codegen" --profile generate-config-dict && "$PREFIX/datamodel-codegen" --profile parser-config-dicts && "$PREFIX/datamodel-codegen" --profile parse-config-dict'
    language: system
    files: ^src/datamodel_code_generator/config\.py$
    pass_filenames: false
  - id: schema-docs
    name: Update schema feature documentation
    entry: bash -c 'test -x .tox/schema-docs/bin/python || test -x .tox/schema-docs/Scripts/python || tox run -e schema-docs --notest -qq; [ -x .tox/schema-docs/bin/python ] && PYTHON=.tox/schema-docs/bin/python || PYTHON=.tox/schema-docs/Scripts/python; "$PYTHON" scripts/build_schema_docs.py'
    language: system
    files: ^(src/datamodel_code_generator/parser/schema_version\.py|scripts/build_schema_docs\.py|docs/supported_formats\.md)$
    pass_filenames: false
  - id: generation-store-usage
    name: Check parser GenerationStore usage
    entry: python scripts/check_generation_store_usage.py
    language: python
    files: ^(src/datamodel_code_generator/parser/.*\.py|scripts/check_generation_store_usage\.py|scripts/fact_tables\.py|scripts/_source_model\.py|src/datamodel_code_generator/model/.*\.py|src/datamodel_code_generator/types\.py)$
    pass_filenames: false
  - id: architecture-boundaries
    name: Check architecture boundaries
    entry: python scripts/check_architecture_boundaries.py
    language: python
    files: ^(src/datamodel_code_generator/.*\.py|scripts/check_architecture_boundaries\.py|scripts/host_private_access_baseline\.toml|scripts/_import_cycles\.py|scripts/_source_model\.py)$
    pass_filenames: false
  - id: source-rules
    name: Check source rules
    entry: python scripts/check_source_rules.py
    language: python
    files: ^((src|scripts|tests)/.*\.py|docs/architecture\.md|tox\.ini|pyproject\.toml|uv\.lock|\.github/workflows/test\.yaml)$
    pass_filenames: false
  - id: compiled-templates
    name: Check generated built-in template renderers
    entry: bash -c 'test -x .tox/dev/bin/python || test -x .tox/dev/Scripts/python || tox run -e dev --notest -qq; [ -x .tox/dev/bin/python ] && PYTHON=.tox/dev/bin/python || PYTHON=.tox/dev/Scripts/python; "$PYTHON" scripts/compile_builtin_templates.py --check'
    language: system
    files: ^(src/datamodel_code_generator/(model/template|_fastapi/templates|_client/templates)/.*\.jinja2|scripts/_template_compiler/.*\.py|scripts/compile_builtin_templates\.py|src/datamodel_code_generator/model/_compiled_template_runtime\.py|src/datamodel_code_generator/(model|_fastapi|_client)/_compiled_templates/.*\.py)$
    pass_filenames: false
  - id: heki-contracts
    name: Check the heki contracts are written from the records
    entry: bash -c 'test -x .tox/dev/bin/python || test -x .tox/dev/Scripts/python || tox run -e dev --notest -qq; [ -x .tox/dev/bin/python ] && PYTHON=.tox/dev/bin/python || PYTHON=.tox/dev/Scripts/python; "$PYTHON" scripts/build_heki_contracts.py --check'
    language: system
    files: ^(scripts/(build_heki_contracts|fact_tables|decision_homes|_decision_home_reads|check_architecture_boundaries|check_generation_store_usage|check_ratchets|check_source_rules|where|_source_model|_ci_lanes|_import_cycles|pass_decls|related_tests)\.py|scripts/heki\.toml|tests/units\.py|src/datamodel_code_generator/.*\.py)$
    pass_filenames: false
  - id: heki
    name: Check the package against the heki contracts
    entry: heki check --config scripts/heki.toml --baseline scripts/heki_baseline.toml src
    language: python
    additional_dependencies: [heki==0.6.0]
    files: ^(src/datamodel_code_generator/.*\.py|scripts/heki\.toml|scripts/heki_baseline\.toml)$
    pass_filenames: false
  - id: zizmor
    name: Audit the workflows, actions and Dependabot configuration with zizmor
    entry: zizmor --offline --config .github/zizmor.yml .
    language: python
    additional_dependencies: [zizmor==1.32.0]
    files: ^(\.github/.*\.ya?ml|action\.yml|\.pre-commit-config\.yaml|\.pre-commit-hooks\.yaml)$
    pass_filenames: false
