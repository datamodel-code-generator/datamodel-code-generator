# Owner-accepted default-output behaviour changes against one base release, read by scripts/behaviour_diff.py.
# Shrink-only within a release cycle: `behaviour_diff.py gate --check` fails on an entry that accepts no change
# (stale), on an entry whose `decision` is not the public PR or issue references of the owner decision (#1234, #1235)
# and on a table whose base is not the gate's base.
# A table whose base is a release before the gate's base accepts nothing and is no error, as that release contains
# its changes; replace the whole table when the next accepted change of the new cycle is added.
# Entry keys: input (glob on the cell's input), backends, aspects, match (regex on the change line), reason,
# decision, release_note.
base = "0.88.0"

[[accepted]]
input = "*msgspec_number_limits*"
aspects = [ "constraints", "type" ]
match = "=-?(?:4611686018427388000\\b.* -> .*=-?4611686018427387904|9223372036854776000\\b.* -> .*=-?9223372036854775808|18446744073709552000\\b.* -> .*=-?18446744073709551616)\\b"
reason = "an integer multipleOf or exclusive bound past 2**53 was read as a float and written as another number (2**64 as 18446744073709552000), so the model rejected values the schema accepts and accepted values it rejects; it is written as the exact integer now (schema-mismatch fix)"
decision = "#5214"
release_note = "an integer multipleOf, exclusiveMinimum or exclusiveMaximum past 2**53 (for example multipleOf 18446744073709551616) is written as that exact integer in the constraints instead of a float-rounded number (18446744073709552000), so the model no longer rejects the multiples the schema accepts"

[[accepted]]
input = "*numeric_constraint_precision*"
aspects = [ "constraints", "type" ]
match = "=-?(?:4611686018427388000\\b.* -> .*=-?4611686018427387904|18446744073709552000\\b.* -> .*=-?18446744073709551616|55340232221128656000\\b.* -> .*=-?55340232221128654848)\\b"
reason = "an integer multipleOf or exclusive bound past 2**53 was read as a float and written as another number (2**64 as 18446744073709552000), so the model rejected values the schema accepts and accepted values it rejects; it is written as the exact integer now (schema-mismatch fix)"
decision = "#5214"
release_note = "an integer multipleOf, exclusiveMinimum or exclusiveMaximum past 2**53 (for example multipleOf 18446744073709551616) is written as that exact integer in the constraints instead of a float-rounded number (18446744073709552000), so the model no longer rejects the multiples the schema accepts"

[[accepted]]
input = "*numeric_constraint_precision*"
aspects = [ "type", "enum-member-removed" ]
match = "^\\[type\\] (?:exact_integer_constraints:)?Model:literal: .*\\bLiteral\\[18446744073709551616, 36893488147419103232, 5\\].* -> .*\\bLiteral\\[18446744073709551616, 36893488147419103232\\]|^\\[enum-member-removed\\] (?:exact_integer_constraints:)?Literal: integer_5$"
reason = "the literal filter read the float-rounded divisor of a multipleOf past 2**53, so a value that is not a multiple of the schema's divisor (5 beside multipleOf 2**64) stayed in the Literal and the enum; it is dropped now (schema-mismatch fix)"
decision = "#5214"
release_note = "a const or enum value that is not a multiple of an integer multipleOf past 2**53 is no longer kept as a member of the Literal"

[[accepted]]
input = "payload:jsonschema/msgspec_number_limits/exact_int_divisors.json"
aspects = [ "payload-verdict" ]
match = "^\\[payload-verdict\\] payload v\\d+: reject -> accept$"
reason = "payloads valid for the schema were rejected by the float-rounded divisor or bound (2**64 beside multipleOf 2**64) and are accepted now (schema-mismatch fix)"
decision = "#5214"
release_note = "a value that is a multiple of an integer multipleOf past 2**53, or beyond an exclusive bound past 2**53, is accepted instead of being rejected as the float-rounded number"
