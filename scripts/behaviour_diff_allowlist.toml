reason = "with --collapse-root-models --use-unique-items-as-set (the practical presets), the root model of a closed prefixItems pair inlined into the items of a set gave set[list[int | str]], which rejects every non-empty array; the root model stays named there and hashes by identity (crash-class fix)"
decision = "#6192"
release_note = "with --collapse-root-models and --use-unique-items-as-set, a root model whose root type has no hashable value stays named as the item of a set instead of being inlined into a set that rejects every non-empty array"
