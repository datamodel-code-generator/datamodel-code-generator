reason = "the items of an array and the values of a map that are objects closed by additionalProperties: false (no property) took a plain dict, which accepted every object, while the schema admits only the empty one; the map keeps its maxProperties 0 on a type alias of its own, as a nested array keeps its item counts (#6171) (schema-mismatch fix)"
