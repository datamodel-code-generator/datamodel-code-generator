# Owner-accepted default-output behaviour changes against one base release, read by scripts/behaviour_diff.py.
# Shrink-only within a release cycle: `behaviour_diff.py gate --check` fails on an entry that accepts no change
# (stale), on an entry whose `decision` is not the public PR or issue references of the owner decision (#1234, #1235)
# and on a table whose base is not the gate's base.
# A table whose base is a release before the gate's base accepts nothing and is no error, as that release contains
# its changes; replace the whole table when the next accepted change of the new cycle is added.
# Entry keys: input (glob on the cell's input), backends, aspects, match (regex on the change line), reason,
# decision, release_note.
base = "0.87.0"

[[accepted]]
input = "tests/data/jsonschema/schema_intersection/allof_scalar_refs.json"
aspects = [ "kind", "type", "name-removed", "probe" ]
match = "\\b(ListItem|LookaheadItems|NullableItem|NumberItem|PatternRefs|RefsItem|TextItem|TwoItem|TwoMap|TwoPatternMap|TwoProp|UntypedTypedItem)\\b"
reason = "an allOf whose parts admit no object was an empty object model that rejected every valid scalar in 0.86.0 (crash class); it is written as the value type now"
decision = "#5401"
release_note = "an allOf of scalar schemas (for example two integer $refs with a sibling minimum) is generated as the constrained scalar type instead of an empty model that rejected every value"

[[accepted]]
input = "tests/data/openapi/schema_intersection"
aspects = [ "kind", "type", "name-removed" ]
match = "root_site_null_oas30:(Model:\\w+: .*\\b(InlineArray|RefArray)\\b|(InlineArray|RefArray):)"
reason = "an allOf whose parts admit no object was an empty object model that rejected every valid scalar in 0.86.0 (crash class); it is written as the value type now"
decision = "#5401"
release_note = "an allOf of scalar schemas (for example two integer $refs with a sibling minimum) is generated as the constrained scalar type instead of an empty model that rejected every value"

