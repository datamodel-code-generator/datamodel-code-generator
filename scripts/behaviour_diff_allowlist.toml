input = "tests/data/openapi/schema_intersection"
aspects = [ "required", "default" ]
match = "^\\[(required|default)\\] root_site_null_oas30:Model:(inline_array|ref_array): "
reason = "the field of an allOf site #5401 writes as its value type instead of an empty model takes the default rules of that type: --use-default-factory-for-optional-nested-models gives a value type no factory and --strip-default-none keeps None only where the type admits null, as 0.87.0 does for the same property written directly as that value type"
