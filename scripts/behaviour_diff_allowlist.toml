# Owner-accepted default-output behaviour changes against one base release, read by scripts/behaviour_diff.py.
# Shrink-only within a release cycle: `behaviour_diff.py gate --check` fails on an entry that accepts no change
# (stale), on an entry whose `decision` is not the public PR or issue references of the owner decision (#1234, #1235)
# and on a table whose base is not the gate's base.
# A table whose base is a release before the gate's base accepts nothing and is no error, as that release contains
# its changes; replace the whole table when the next accepted change of the new cycle is added.
# Entry keys: input (glob on the cell's input), backends, aspects, match (regex on the change line), reason,
# decision, release_note. The aspect `generation` accepts a generation the owner decided to refuse; its change line is
# `[generation] : now fails: <the error>`.
# `[[base_skip]]` names an input that releases are known to hang on, so they do not run for it (the cell is
# `base-skipped` once the candidate generated and imported). Keys: input (glob), bases (releases, `["0.88.0"]`, or a
# maximum, `["<=0.88.0"]`), reason, issue (public issue references, `#1234`). `--check` fails on a missing key and,
# in a run of the whole tier, on an entry that covers no cell; an entry that names no release of the gate's base is
# no error and does nothing. Remove the entry once the input stops mattering for the gate's base.
base = "0.89.0"

[[accepted]]
input = "tests/data/jsonschema/*module_named_like_*"
aspects = [ "generation" ]
match = "^\\[generation\\] : now fails: Cannot write the class '[^']+' in .+ beside the module '[^']+' "
reason = "a class written in a package beside a module of the same name was replaced by the module once anything imported it, so the models that reference the class failed to decode; generation stops with an error that asks to rename the class or the module instead of writing that output (owner decision: error by default, an opt-in rename comes as --rename-submodules-hidden-by-classes)"
decision = "#6067"
release_note = "generation stops with an error instead of writing a class in a package beside a module of the same name, which importing the module replaced, so the models that use the class failed to import or decode"

[[accepted]]
input = "tests/data/jsonschema/schema_intersection/allof_value_unions.json"
aspects = [ "numbered-name-removed", "name-removed", "type", "kind", "constraints", "bases", "default", "required", "constructor-order" ]
reason = "an allOf whose anyOf or oneOf members admit only values was written as a model without fields, which rejects every value the schema accepts in every output form; it is the union of the intersections of one branch of each with the other parts now (rejects-all fix, as #5406 did for an allOf of values), and the numbered classes such a site left, the default factory of its fields, the empty class --reuse-model merged others into and the names --collapse-root-models now inlines go with that model"
decision = "#4495"
release_note = "an allOf whose anyOf or oneOf members hold only values, such as allOf: [{anyOf: [{type: string}, {type: integer}]}, {minLength: 2}], is written as the union of the intersections, RootModel[constr(min_length=2) | int], instead of a model without fields that rejected every value; the numbered classes such a site left are no longer written"

[[accepted]]
input = "tests/data/jsonschema/reserved_target_rewritten_document"
aspects = [ "name-removed", "type" ]
match = "^\\[name-removed\\] box:ItemModel: removed$|^\\[type\\] (?:box:Other|holder:Model:(?:item|other)): .*\\b(?:Any|ItemModel)\\b.* -> .*$"
reason = "a $ref of another file into a property of a definition with an embedded $id read its target from a fresh load of the file, where the property's $ref '#/definitions/Item' (written against the embedded resource) names nothing, so the reference became an Any model with a dangling-reference warning and the model accepted every value where the schema requires a string; the target is read from the prepared document, where the embedded resource resolved the $ref (schema-mismatch fix)"
decision = "#5126"
release_note = "a $ref of another file into a property of a schema that declares an embedded $id resolves the property's own $ref against that $id, so the field takes the type the schema gives (str) instead of an Any model with a dangling-reference warning"
