release_note = "with --use-unique-items-as-set, a uniqueItems array whose items can never be set members (objects, arrays, a tuple holding an array) stays a list instead of a set that rejects every non-empty array, and a list default that cannot be a set keeps its list"

[[accepted]]
input = "*mapping_schema_validators*"
aspects = [ "type" ]
match = "^\\[type\\] Nested:nested: Union\\[(?:None, )?dict\\[str, list\\[object\\]\\](?:, msgspec\\.UnsetType)?\\] -> Union\\[(?:None, )?dict\\[str, set\\[object\\]\\](?:, msgspec\\.UnsetType)?\\]$"
reason = "with --use-unique-items-as-set (the practical presets), the values of a map whose own schema declares uniqueItems were lists, which keep the duplicates the schema rejects; every array whose own schema declares uniqueItems is a set now, as the property of the same array is (owner decision: default under the option)"
decision = "#6163"
release_note = "with --use-unique-items-as-set, every array whose own schema declares uniqueItems is written as a set, also the member of an anyOf or oneOf, the items of an array, the values of a map and a lone allOf member, where a model merged into its model declares it too"

