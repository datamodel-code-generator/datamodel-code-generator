# Owner-accepted default-output behaviour changes against one base release, read by scripts/behaviour_diff.py.
# Shrink-only within a release cycle: `behaviour_diff.py gate --check` fails on an entry that accepts no change
# (stale), on an entry whose `decision` is not the public PR or issue references of the owner decision (#1234, #1235)
# and on a table whose base is not the gate's base.
# A table whose base is a release before the gate's base accepts nothing and is no error, as that release contains
# its changes; replace the whole table when the next accepted change of the new cycle is added.
# Entry keys: input (glob on the cell's input), backends, aspects, match (regex on the change line), reason,
# decision, migration (the id of the upgrade guide entry, docs/data/migration/unreleased/<id>.toml, whose title the
# release notes and the release page use; `scripts/build_migration_docs.py --check` fails while an entry of the
# current cycle names none). The aspect `generation` accepts a generation the owner decided to refuse; its change line
# is `[generation] : now fails: <the error>`.
# `[[base_skip]]` names an input that releases are known to hang on, so they do not run for it (the cell is
# `base-skipped` once the candidate generated and imported). Keys: input (glob), bases (releases, `["0.88.0"]`, or a
# maximum, `["<=0.88.0"]`), reason, issue (public issue references, `#1234`). `--check` fails on a missing key and,
# in a run of the whole tier, on an entry that covers no cell; an entry that names no release of the gate's base is
# no error and does nothing. Remove the entry once the input stops mattering for the gate's base.
base = "0.98.0"

[[accepted]]
input = [ "tests/data/jsonschema/additional_properties_value_constraints_annotated.json", "tests/data/jsonschema/annotated_union_members", "tests/data/jsonschema/annotated_union_members/kinds.json", "tests/data/jsonschema/annotated_union_members/scalar_type_list.yaml", "tests/data/jsonschema/inherited_property_overrides", "tests/data/jsonschema/kubernetes_crd_schema.yaml", "tests/data/jsonschema/number_constraints_on_non_numbers.json", "tests/data/jsonschema/root_multiple_primitive_constraints.json", "tests/data/jsonschema/schema_intersection", "tests/data/jsonschema/string_constraints_on_other_types.json", "tests/data/jsonschema/type_union_constraints" ]
backends = [ "pydantic_v2.BaseModel", "pydantic_v2.dataclass" ]
aspects = [ "constraints", "type" ]
reason = "under --use-annotated (the practical and standard presets set it) a constrained member of a union was written as a con*() call or as Annotated[<type>, StringConstraints(...)] and is written as Annotated[<type>, Field(...)]; only the spelling of the constraint moves, the models accept and reject the same values and the parsed values stay (the gate's validation and payload aspects report no difference); class names, bases, fields, required-ness and field order stay (record annotated-constrained-union-members)"
decision = "#7109"
migration = "annotated-constrained-union-members"
