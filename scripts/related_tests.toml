incident = "a new importer of the source model failed the test that wants a rule for every importer only on hosted CI"
paths = ["scripts/*", "tests/*"]
exclude = ["tests/data/*"]
pattern = "_source_model"
tests = [
  "tests/test_source_model.py::test_rules_declare_what_they_ask",
  "tests/test_source_model.py::test_every_rule_states_its_verdicts",
]

[[rule]]
id = "client-runtime-e2e"
prs = [6600, 6636]
incident = "the client runtime and plans ran only in client-e2e: a changed websocket line and new scenario calls were missed by the full suite"
paths = [
  "src/datamodel_code_generator/_runtime/*",
  "src/datamodel_code_generator/_client/*",
  "src/datamodel_code_generator/_openapi_codec_plan.py",
  "src/datamodel_code_generator/_openapi_wire_plan.py",
  "tests/api_generation/scenarios/client_*",
  "tests/api_generation/support/client_scenarios.py",
  "tests/data/generation_platform/client/*",
]
envs = ["client-e2e"]

[[rule]]
id = "server-runtime-e2e"
prs = [6600, 6636]
incident = "the server runtime and the cross client and server scenarios ran only in fastapi-e2e, which the full suite skips"
paths = [
  "src/datamodel_code_generator/_runtime/*",
  "src/datamodel_code_generator/_fastapi/*",
  "src/datamodel_code_generator/_openapi_codec_plan.py",
  "src/datamodel_code_generator/_openapi_wire_plan.py",
  "tests/data/generation_platform/cross/*",
  "tests/data/generation_platform/fastapi/*",
]
envs = ["fastapi-e2e"]

[[rule]]
id = "generated-package-typing"
prs = [6600]
incident = "stored generated packages that only the typing environments compare moved, and all eight typing shards failed on hosted CI"
paths = [
  "src/datamodel_code_generator/_runtime/*",
  "src/datamodel_code_generator/_client/*",
  "src/datamodel_code_generator/_fastapi/*",
  "src/datamodel_code_generator/_openapi_codec_plan.py",
  "src/datamodel_code_generator/_openapi_wire_plan.py",
]
envs = ["typing-nocov-e2e", "typing-pydantic214-nocov-e2e"]

[[rule]]
id = "generated-layout-install-e2e"
prs = [6626]
incident = "a formatter change moved the layout of every generated package and failed only the install environment of the client"
