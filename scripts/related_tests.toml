  "src/datamodel_code_generator/_builtin_formatter.py",
  "src/datamodel_code_generator/_builtin_line_split.py",
  "src/datamodel_code_generator/format.py",
  "src/datamodel_code_generator/_client/templates/*",
  "src/datamodel_code_generator/_fastapi/templates/*",
  "src/datamodel_code_generator/model/template/*",
  "src/datamodel_code_generator/_client/naming.py",
  "src/datamodel_code_generator/_client/render.py",
  "src/datamodel_code_generator/_registry_render.py",
  "src/datamodel_code_generator/_target_format.py",
  "src/datamodel_code_generator/_target_naming.py",
  "src/datamodel_code_generator/_target_render.py",
  "src/datamodel_code_generator/_target_templates.py",
]
envs = ["client-e2e", "fastapi-e2e", "client-install-nocov-e2e", "fastapi-install-nocov-e2e"]

[[rule]]
id = "builtin-formatter-old-black"
prs = [6676, 6626]
incident = "builtin formatter output compared with black ran on the old black lanes only on hosted CI (black 24 keeps '# type:int')"
paths = [
  "src/datamodel_code_generator/_builtin_formatter.py",
  "src/datamodel_code_generator/_builtin_line_split.py",
  "src/datamodel_code_generator/format.py",
]
envs = ["py312-black22-parallel", "py312-black24-nocov-parallel"]

[[rule]]
id = "black-comparing-tests"
prs = [6676]
incident = "a test that compares builtin formatter output with black.format_str at run time failed on the old black lanes"
paths = ["tests/*.py"]
pattern = "black\\.format_str"
envs = ["py312-black22-parallel", "py312-black24-nocov-parallel"]

[[rule]]
id = "oldest-pydantic-features"
prs = [5007]
incident = "code that reads Pydantic internals or writes a feature with a version floor failed only on the oldest pinned Pydantic lanes"
paths = ["src/datamodel_code_generator/*"]
pattern = "(__pydantic_\\w+__|model_fields|object\\.__new__|union_mode|regex_engine)"
envs = ["pydantic200", "pydantic20", "pydantic25"]

[[rule]]
id = "deleted-test-files"
prs = [6716]
incident = "a deleted test file was still listed by node id in a pinned Pydantic lane, which then collected nothing and failed"
paths = ["tests/*.py"]
status = "D"
envs = ["pydantic200", "pydantic20", "pydantic25", "pydantic212", "pydantic213", "pydantic214"]

[[rule]]
id = "payload-runtime-lanes"
prs = [7164]
incident = "the payload suite changed and 15 cells failed in py311-payload-runtime-min, which only the scheduled workflow runs (its nightly run opened #7162)"
paths = [
  "tests/main/test_payload_validation.py",
  "tests/main/test_payload_validation.refs",
  "tests/main/test_exec_validation.py",
  "tests/main/payload_validation/*",
  "tests/data/payloads/*",
  "tests/data/expected/main/payload_validation/*",
]
envs = [
  "py311-payload-runtime-min",
  "py311-payload-runtime-latest",
  "py314-payload-runtime-min",
  "py314-payload-runtime-latest",
]

[[rule]]
id = "stored-model-output-nightly"
prs = [7117]
incident = "stored model output changed, the pull request tier passed and the nightly tier turned main red"
paths = ["tests/data/expected/main/*.py"]
exclude = ["tests/data/expected/main/generation_platform/*"]
status = "M"
envs = ["nightly-tier"]

[[rule]]
id = "behaviour-gate-nightly"
prs = [7161, 7117]
incident = "the behaviour signature and its allowlist are judged in full only by the nightly tier; a broad entry hid real value changes"
paths = ["scripts/behaviour_diff_allowlist.toml", "scripts/behaviour_diff.py", "scripts/_behaviour_*.py"]
envs = ["nightly-tier"]

[[rule]]
id = "platform-observations-windows"
prs = [7037]
incident = "stored call counts of a platform output changed and their Windows variants came only from a dispatch run"
paths = ["tests/data/expected/main/generation_platform/*"]
status = "M"
envs = ["dispatch"]

[[rule]]
id = "ci-lane-changes"
prs = [6694, 6695]
incident = "moving a lane to another Python recorded its stored outputs under a new key, which only the lanes a pull request skips showed"
paths = ["tox.ini", ".github/workflows/test.yaml"]
pattern = "(base_python|python-version|tox_env|py3[0-9]+)"
envs = ["dispatch"]

[[rule]]
id = "docs-examples-stored-outputs"
prs = [7222, 7223]
incident = "renaming stored outputs under main/ broke the docs examples that read them by name, which no selected test built"
paths = ["tests/data/expected/main/*"]
exclude = ["tests/data/expected/main/generation_platform/*"]
tests = ["tests/test_build_docs_examples_script.py"]

[[rule]]
id = "where-reads-scripts"
prs = [7221]
incident = "a new module under scripts/ changed what `python -m scripts.where` prints; the stored answers failed only on hosted CI"
paths = ["scripts/*.py"]
tests = ["tests/test_where_script.py"]
