[[rule]]
id = "workflows"
prs = [7043]
incident = "a workflow change broke the workflow contract and gate simulation tests; no related test ran for .github"
paths = [".github/workflows/*"]
tests = ["tests/test_ci_workflow.py"]

[[rule]]
