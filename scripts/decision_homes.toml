# Target homes (docs/architecture.md, "Targets"; design: targets-parse-once, T0). The client and server targets read an
# OpenAPI document once, in the API walk, and read model facts only through the homes. A place under `planned` is the
# core a later T PR creates; `audit` ids are the rows of that design (R-nn raw reads, M-nn model facts, C-nn twin
# planning decisions). Each T PR routes its sites and lowers the allowlist.

