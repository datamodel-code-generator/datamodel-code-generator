# Where each decision has its one home, which code shape means "this code decides it", and which sites outside the home
# exist today. Read by scripts/check_decision_homes.py; the design is docs/architecture.md, "One home per decision".
#
# [homes.<id>]: `decision` in words, `core` (the pure function or module that decides) and `adapters` (code that reads
# live objects and calls the core, or is declared to decide for a position). A place is `file`, `dir/` or
# `file:Qualified.function` or `file:Class` below src/datamodel_code_generator/. `planned` lists the core that a later change creates:
# it covers its hits like the core, need not exist yet, and the check fails once it does (move it to `core`).
# A `call` signature never reports a call of a function the home's `core` defines, wherever it is made: callers of the
# core need no adapter entry (an adapter reads raw facts and hands them to the core).
# [homes.<id>.signatures.<name>]: an AST shape that means "this code decides it" (kinds: see the script's docstring).
# The `audit` entry is the id the site was filed under in the DRY audit of 0.87.0 (D-L1-nn, D-PP-nn, D-X-nn).
# [legacy_rows."<row id>"]: every `legacy-*` / `legacy.*` row id that src/ names, with its home and `fix` ("#nnnn" the
# issue that deletes it, a plan group such as "G12", or "keep"); docs/architecture.md, "Legacy rows", lists the same.
# [allow."<path>"."<function>"]: the sites outside a home that exist today. A new site fails the check, and so does an
# entry above what the scan finds: the list only shrinks. Route a site through its home, then run
# `python scripts/check_decision_homes.py --write-allowlist`. Never add an entry without the owner's OK.

