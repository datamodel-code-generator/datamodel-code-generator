# Every `legacy-*` / `legacy.*` row id that src/ names: the home whose decision the row exempts, and what deletes it.
# `fix`: "#nnnn" the issue, a plan group of the DRY audit and the refactor roadmap (G.. group, RP.. render-plan step,
# DC.. decision core, PH.. phase, GR.. graph step, FIX-.. prerequisite fix, OPT-.. opt-in option), or "keep" for a row
# whose 0.86.0 output the default keeps for good (a fix is opt-in). The list only shrinks unless the owner agrees to a
# new row; docs/architecture.md, "Legacy rows", has the same rows with what each keeps.

