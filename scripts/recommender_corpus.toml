# Corpus for scripts/recommender_calibrate.py: public specs pinned to a commit and a sha256.
# Content is downloaded at run time and never committed. `represents` says which schema style an entry stands for;
# calibration entries tune the rules, holdout entries only check that a proposal does not make them worse.
format_version = 1

# Decision grid scored for every schema on top of the latest standard preset (each table = config fields; an empty
# table leaves the decision to the preset, so an unset naming strategy is a value of its own).
[grid]
title-source = [{ use_title_as_name = false }, { use_title_as_name = true }]
naming-strategy = [
  {},
  { naming_strategy = "numbered" },
  { naming_strategy = "primary-first" },
  { naming_strategy = "full-path" },
]
enum-shape = [{ enum_field_as_literal = "one" }, { enum_field_as_literal = "all" }]
reuse = [{ reuse_model = false }, { reuse_model = true, collapse_reuse_models = true }]
union-variant-names = [
  { use_tag_as_union_variant_name = false },
  { use_tag_as_union_variant_name = true, infer_union_variant_names = false },
]

