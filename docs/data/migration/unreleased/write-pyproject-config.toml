[[change]]
id = "write-pyproject-config"
category = "new-surface"
title = "Write the recommended or generated table into pyproject.toml"
summary = "--write-pyproject-config (experimental) writes the table that --recommend-options or --generate-pyproject-config prints into pyproject.toml: the file that gives the table, else ./pyproject.toml, created with the table alone when missing (--generate-pyproject-config always writes ./pyproject.toml). Only the keys to add or change are set; the rest of the file, its line endings and its byte order mark are kept. An edit tomllib does not read back as exactly those keys set, a preset on the command line, relative paths for a pyproject.toml outside the working directory, or a file changed during the run write nothing: the block is printed as before and the command fails with the reason. HTTP headers and query parameters are never written and URLs are written redacted. The JSON payloads of both commands gain written, absent without the option. Generation is unchanged."
refs = ["#7495"]
surface = ["--write-pyproject-config"]
