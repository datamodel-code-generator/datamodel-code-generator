[[change]]
id = "alias-import-shadowed-by-inherited-dataclass-field"
category = "crash-fix"
title = "A pydantic dataclass that redeclares an inherited field aliases the import its base's field name shadows"
summary = "A pydantic dataclass that redeclared a field of its base, in a module whose annotations are strings, failed to import when the annotation loaded a name that the base's class body binds to a field's default, such as user.Address next to the base's field user, date next to a field date, or str next to a field str: pydantic evaluates the annotation in the base's class body and raised a TypeError or an AttributeError. The module now aliases that import as it already did for the fields of the class itself (from . import user as user_aliased, from datetime import date as date_aliased, from builtins import str as str_aliased) and the annotation names the alias. Only modules that failed to import change; class names, field names, bases, field order and parsed values are the same."
refs = ["#7594", "#7561"]
decision = ["#7594"]
kind = "default-output"
action = "none"
source = "release-note"
