[[change]]
id = "forwarded-class-beside-unloaded-submodule"
category = "default-fix"
title = "A module imports the models of a submodule that its package's forwarded class hides, where nothing loads the submodule first"
summary = "Where an import cycle merge moves a class into _internal.py, the package __init__.py only re-exports it (from ._internal import Warn), nothing the __init__.py runs loads the submodule of the same name (pkg/Warn.py) and --all-exports-scope lets the output through, a module that read the submodule wrote from . import Warn with Warn.Detail, which read the class: the module failed to import with AttributeError, and with dataclasses, msgspec or TypedDict every decode or get_type_hints failed. Such a module now imports the model from the submodule (from .Warn import Detail), as --use-exact-imports does and as 0.89.0 does for a package __init__.py that defines the class. Only those modules change; a package whose modules read nothing of the submodule keeps its output, and a reader's attribute Warn, which only the import bound, goes away. Once a reader is imported, the name Warn of the package is the submodule, as --all-exports-scope recursive output already behaves; with dataclasses, msgspec or TypedDict a program that imported a reader and then read the exported class from the package now gets the module."
refs = ["#1", "#7573"]
decision = ["#1"]
kind = "default-output"
action = "review"
source = "release-note"
