[[change]]
id = "bug-g10-msgspec-reuse"
category = "crash-fix"
title = "Flatten msgspec bases under --reuse-model by the models reuse merges"
summary = "With --output-model-type msgspec.Struct, a model with two generated bases whose layouts still conflict once every module is processed stopped with incompatible layouts, for instance under --reuse-model when one base has the field names of another base's ancestor but a different type, default, description or constraint, or when a discriminator field of a base is not tagged. It declares the fields of its bases itself, as it does without --reuse-model."
refs = ["#7445"]
kind = "default-output"
action = "none"
source = "release-note"
