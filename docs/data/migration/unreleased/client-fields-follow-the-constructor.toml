[[change]]
id = "client-fields-follow-the-constructor"
category = "experimental"
kind = "experimental"
action = "review"
title = "Generated clients take a body field as required exactly where the model's constructor requires it"
summary = "With `--generate-client` and `--strip-default-none`, a property the schema leaves optional whose Pydantic model field has no default (`tag: str | None`) is a required field argument of the call that sends the body (`tag: str`, README `tag (required)`, `FieldArguments` flag true): `create_pet(id=1)` raises `TypeError: create_pet() missing required field arguments for application/json: 'tag'` before any request, where it raised `DecodeError(reason='unencodable')` from the model. A property whose schema type includes null (OpenAPI 3.1 `type: [string, \"null\"]`) keeps its `= None` default and stays optional; an OpenAPI 3.0 `nullable: true` property, which the model writes without a default, becomes required like the others. The same holds for the `pydantic_v2.dataclass` output: an OpenAPI 3.0 optional `nullable: true` property with `default: null` under `--strip-default-none` becomes required (the class writes `dn: str | None` without a default), and a required property marked `x-is-classvar` (`--field-include-all-keys`) becomes optional, because a `ClassVar` is not a constructor argument. An AsyncAPI channel whose messages are told apart by such a property (`kind: {const: join}`, optional) routes received messages by it (`MessageRoute(..., tag='join')`) instead of decoding them as the union of the messages' models: a message without it is refused as `missing` instead of `value`, and a message whose `kind` is null, which the union decoder accepted as the first member, is refused with reason `null`. Server-sent event streams under `--strip-default-none --force-optional` route events by the body tag (`BodySelector(pointer=\"/type\")`) instead of one union codec. The other backends already followed their classes."
affects = { experimental = ["cli-option.generate-client"] }
before = "tag: str | UNSET = UNSET,"
after = "tag: str,"
refs = ["#7069"]
source = "release-note"
covers = [
    "main/generation_platform/client/asyncapi-optional-tags.txt",
    "main/generation_platform/client/fields-strip-nullable.txt",
    "main/generation_platform/client/fields-strip.txt",
    "main/generation_platform/client/packages/asyncapi-optional-tags/dataclasses_dataclass//*.py",
    "main/generation_platform/client/packages/asyncapi-optional-tags/pydantic_v2_BaseModel//*.py",
    "main/generation_platform/client/packages/fields-strip-nullable/pydantic_v2_BaseModel//*.py",
    "main/generation_platform/client/packages/fields-strip-nullable/pydantic_v2_dataclass//*.py",
    "main/generation_platform/client/packages/fields-strip/dataclasses_dataclass//*.py",
    "main/generation_platform/client/packages/fields-strip/pydantic_v2_BaseModel//*.py",
