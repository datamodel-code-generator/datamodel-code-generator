[[change]]
id = "dataclass-aliases-module-an-inherited-field-name-hides"
category = "crash-fix"
title = "A pydantic dataclass on Pydantic 2.0 aliases a module or class that an inherited field name hides"
summary = "A pydantic_v2.dataclass for --target-pydantic-version 2 failed to import on Pydantic 2.0 when a field that a class inherits from a base is named like a module the file imports, a builtin or a class the annotation loads (a base field date or str, a field Place beside a class Place): Pydantic 2.0 sets the inherited defaults on the class and evaluates the class's annotations in that namespace, where the default binds that name, and raised a TypeError or NameError such as 'NoneType' | None. The module now imports the module or builtin under an alias the field name does not hide (from datetime import date as date_aliased, from builtins import str as str_aliased), binds a class of the same file to an alias after the class (Place_aliased = Place) and names the alias in the annotation. These modules failed to import; the modules that imported but rejected valid payloads are in the on-target-2 record. Class names, field names and order, bases, __init__ parameters and parsed values are the same, and the output for every other target and backend is unchanged."
refs = ["#7631", "#7584"]
decision = ["#7631"]
kind = "default-output"
action = "none"
source = "release-note"
covers = [
