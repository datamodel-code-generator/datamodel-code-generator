[[change]]
id = "drop-stale-api-scope-lines"
category = "harness"
title = "Drop the stale API-scope references and store the template API output under its test"
summary = "The API-scope tests lose the lines of parameter ids that no environment collects any more, and the relative template directory test stores its API output under its own name with the .py suffix instead of a hand-named .txt file; the package writes the same output."
