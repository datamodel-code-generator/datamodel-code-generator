[[change]]
id = "defs-member-not-a-schema"
kind = "warning"
action = "warn"
title = "A member of `$defs` that is not a schema is skipped with a `UserWarning` in a draft 7 or older document"
summary = "Draft 7 and older have no `$defs` keyword, so their meta-schemas do not constrain its members. In a document read in one of these versions (the version of the input document, or of each document under `--read-schema-version-per-document`), a member of `$defs` whose value is neither an object nor a boolean, such as a `description` string written beside the definitions, is now skipped with a `UserWarning` that names it, and the document is generated; it was refused before. Such a member is still refused in a document read as 2019-09 or later (a document without `$schema` that holds `$defs` reads as 2020-12) and where a reference names it. A caller that turns warnings into errors gets an error."
affects = { input_file_types = ["jsonschema"] }
migrate = "Move the value into the definition it belongs to, or remove it."
refs = ["#6880"]
source = "release-note"
