[[change]]
id = "count-escapes-the-rust-engine-rejects"
category = "crash-fix"
kind = "default-output"
action = "none"
source = "release-note"
title = "Patterns with an escape pydantic-core's regex engine rejects are left out or read with Python's re"
summary = "A pattern with a letter after a backslash that the Rust regex engine of pydantic-core reads nowhere (\\k in a named reference, \\c, \\e and the others), in a class or outside, or with a non-ASCII character after a backslash, is left out with a warning where no engine of the output compiles it, and is read with Python's re where only that engine reads it (\\é), instead of failing at import."
refs = ["#7094"]
covers = [
    "main/jsonschema/pydantic_accepted_forms/escapes_the_rust_engine_rejects_are_counted[base_model].patterns.txt",
    "main/jsonschema/pydantic_accepted_forms/escapes_the_rust_engine_rejects_are_counted[base_model].py",
    "main/jsonschema/pydantic_accepted_forms/escapes_the_rust_engine_rejects_are_counted[field_constraints].patterns.txt",
    "main/jsonschema/pydantic_accepted_forms/escapes_the_rust_engine_rejects_are_counted[field_constraints].py",
    "main/jsonschema/pydantic_accepted_forms/escapes_the_rust_engine_rejects_are_counted[msgspec].patterns.txt",
    "main/jsonschema/pydantic_accepted_forms/escapes_the_rust_engine_rejects_are_counted[msgspec].py",
]
