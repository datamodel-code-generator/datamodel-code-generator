[[change]]
id = "client-tags-follow-the-model"
category = "experimental"
kind = "experimental"
action = "review"
title = "Generated clients select a union's variant by the tags its model holds"
summary = "With `--generate-client` and the `dataclasses.dataclass` or `typing.TypedDict` output, a union with a `discriminator`, in an OpenAPI body or an AsyncAPI message payload, selects each variant by the tags the model reads for it: its own tag field (a `const`, a one-value `Literal` or a one-member enum, whose value is a string, an integer or a boolean: a variant whose tag field holds any other value, such as an object, an array, `null` or a fraction, gets no tag from it), else the mapping keys read as the tag property's type, else its schema name. A union told apart by integers or booleans (`kind: {type: integer, const: 1}`, mapping keys `\"1\"` over an `integer` property, `const: true`) or by one-member enums (under `--use-enum-values-in-discriminator`, or with the TypedDict output) was matched by schema names, or by the mapping keys as text: every schema-valid payload raised `DecodeError(reason='invalid_value')` and, except with mapping keys, `{\"kind\": \"Cat\"}` decoded as `Cat`. Each payload now decodes to its variant and `{\"kind\": \"Cat\"}` is refused. Tags are matched by JSON kind and value, in decoding and in encoding a body of the TypedDict output: `1` and `true` never select each other's variant, and an `Enum` member selects the variant its value tags. The `Choice` of the copied runtime (`client/_runtime/model_codecs/stdlib_dataclasses.py`, `stdlib_typeddicts.py`) takes such tags: `tags: tuple[tuple[str | int | bool, type], ...]`. With `--collapse-root-models`, a TypedDict union whose variants share one enum for the tag property and are named by a mapping is generated instead of refused with \"The discriminator version gives v1 to two union models\". A TypedDict variant whose own tag field admits several values (`kind: {type: string, enum: [cat, kitty]}`) is now told apart, as in the dataclass and Pydantic outputs, by the mapping keys that name it, else its schema name, not by every value of its field: without a mapping `{\"kind\": \"cat\"}` and `{\"kind\": \"kitty\"}` raise `DecodeError(reason='invalid_value')` and `{\"kind\": \"Cat\"}` decodes, and with the mapping `cat: Cat` `{\"kind\": \"kitty\"}` is refused. The Pydantic and msgspec outputs decode through their models and are unchanged. Integer mapping keys over an integer enum still fail with the dataclass output under `--use-enum-values-in-discriminator` (#7083) and with the TypedDict output for an enum the variants share (#7084)."
affects = { experimental = ["cli-option.generate-client"] }
refs = ["#7082"]
before = "Choice((), 'kind', (('Cat', models.Cat), ('Dog', models.Dog)))"
after = "Choice((), 'kind', ((1, models.Cat), (2, models.Dog)))"
source = "release-note"
covers = [
    "main/generation_platform/client/bindings/session-discriminator-collapse.txt",
    "main/generation_platform/client/bindings/session-discriminator-collapse//*.py",
    "main/generation_platform/client/discriminator-shared-tags.txt",
    "main/generation_platform/client/discriminator-values.txt",
    "main/generation_platform/client/packages/discriminator-values/dataclasses_dataclass//*.py",
    "main/generation_platform/client/packages/discriminator-values/typing_TypedDict//*.py",
    "main/generation_platform/client/runtime/discriminator-copies.txt",
    "main/generation_platform/client/runtime/discriminator-enum-bodies.txt",
    "main/generation_platform/client/runtime/discriminator-reuse.txt",
    "main/generation_platform/client/runtime/discriminator-values.txt",
    "main/generation_platform/client/runtime/discriminator-variants.txt",
]
