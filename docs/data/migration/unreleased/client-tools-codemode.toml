[[change]]
id = "client-tools-codemode"
category = "experimental"
title = "Result budgets, meta tools, a catalog and tool: false for --client-tools"
summary = "The tool table gains catalog() and an opt-in max_result_bytes budget, the MCP server an opt-in meta-tool mode (search_tools, get_tool_schema, call_tool) and --max-result-bytes and --meta-tools, and --client-operations a tool member that leaves an operation out of the tools; calls without the new arguments behave as before. Under --untrusted-input the entries of search, search_tools and catalog() no longer list the tags of the document, which changes the output of search from the first release of the tools; a search still ranks and filters by them, and nothing changes without that option."
refs = ["#7551"]
decision = ["#7551"]
kind = "experimental"
action = "none"
source = "release-note"
affects = { experimental = ["cli-option.client-tools"] }
