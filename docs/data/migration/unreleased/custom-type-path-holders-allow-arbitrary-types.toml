[[change]]
id = "custom-type-path-holders-allow-arbitrary-types"
category = "default-fix"
title = "A model that builds a customTypePath class through a collapsed root, a base, a type alias or a pydantic dataclass writes arbitrary_types_allowed"
summary = "A Pydantic v2 model that builds a customTypePath class through a collapsed root, a base or a type alias, which only the model that declared it gave arbitrary_types_allowed, now writes the key in its config as the declaring model does; the module imports where Pydantic builds the class only with it. Class names, field names, bases, signatures and parsed values are the same."
refs = ["#7620", "#7593"]
decision = ["#7620"]
kind = "default-output"
action = "review"
source = "release-note"
