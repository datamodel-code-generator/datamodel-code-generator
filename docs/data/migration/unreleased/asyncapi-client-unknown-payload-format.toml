[[change]]
id = "asyncapi-client-unknown-payload-format"
kind = "experimental"
action = "required"
title = "Generated AsyncAPI clients leave out a channel whose payload format generation does not read"
summary = "A channel is now left out with a `message_content_types` warning where an AsyncAPI 2 message trait gives a `schemaFormat` that generation does not read, such as `application/schema;version=draft-07`, which generation refuses when the message itself gives it, or where a message's `contentType` is no media type but ends in `+json` (`x+json`). Such channels were generated with a JSON codec."
affects = { experimental = ["cli-option.generate-client"] }
migrate = "Write the format as the AsyncAPI specification lists it (`application/schema+json;version=draft-07`) and the content type as a media type (`application/x+json`)."
refs = ["#6927"]
source = "release-note"
