[[change]]
id = "use-root-model-any-for-custom-type-path"
category = "new-surface"
title = "Give a root model of a customTypePath class RootModel[Any] under an option"
summary = "--use-root-model-any-for-custom-type-path makes a Pydantic v2 root model whose value is a class that customTypePath names take RootModel[Any], arbitrary_types_allowed and the class on root, so the module imports where Pydantic builds the class only with the key; with --use-root-model-type-alias the root stays a class. Without it a root keeps RootModel[<class>] as before, so the default output is unchanged. Other output types are not changed."
refs = ["#7620"]
surface = ["--use-root-model-any-for-custom-type-path"]
covers = [
    "main/jsonschema/pydantic_accepted_forms/custom_type_path_roots_import_under_an_option[controls-default].default.py",
