[[change]]
id = "fix-7583"
category = "crash-fix"
title = "A pydantic dataclass that redeclares an inherited field aliases the class of its module that the base's field name shadows"
summary = "A pydantic dataclass that redeclared a field of its base, in a module whose annotations are strings, failed to import when the annotation loaded a class of the same module that the base's class body binds to a field's default: pydantic evaluates the annotation in the base's class body and raised a TypeError on Place | None where the base has a field Place. The module now binds Place_aliased = Place after the class and the annotation names the alias, as it already did for an imported class (from .place import Place as Place_aliased). Two names that both raise are aliased in turn, and builtins that two inherited fields hide are aliased together. Only modules that failed to import change; class names, field names, bases, field order and parsed values are the same."
refs = ["#7603", "#7583"]
kind = "default-output"
action = "none"
source = "release-note"
covers = [
