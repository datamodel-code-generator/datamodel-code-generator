[[change]]
id = "read-refs-in-their-resources"
category = "new-surface"
title = "Read each reference in its schema resource under an option"
summary = "--read-refs-in-their-resources reads every $id, $anchor and $dynamicAnchor wherever a document holds schemas and each $ref in the schema resource that encloses it: a pointer inside a $defs member with its own $id names that member's definitions, a schema an OpenAPI operation, webhook or component holds inline is a resource, a plain-name anchor of another document names the schema that declares it, every input is read before the first is parsed, and a URL the run holds is never requested; without it the output is that of 0.100.0."
refs = ["#6946", "#7179", "#7158"]
surface = ["--read-refs-in-their-resources"]
covers = [
    "input_model/config_class.txt",
    "main/jsonschema/external_anchor/main_jsonschema_external_anchor_declarations[default].py",
    "main/jsonschema/external_anchor/main_jsonschema_external_anchor_declarations[option].py",
