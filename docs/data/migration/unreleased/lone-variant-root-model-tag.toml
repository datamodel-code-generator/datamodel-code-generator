[[change]]
id = "lone-variant-root-model-tag"
category = "output-text"
kind = "output-text"
action = "none"
source = "release-note"
title = "A lone variant's RootModel tag writes no discriminator unless the target is Pydantic 2.14"
summary = "A union of one variant whose tag field is a RootModel of a Literal (a $ref to a const or one-value enum) is written without discriminator= unless --target-pydantic-version is 2.14, as Pydantic reads a tag through a RootModel only from 2.13 and the module failed to import on the releases an unset or older target allows (#7327); on Pydantic 2.13 and later the union accepts and rejects the same payloads, and class names, fields and parsed values stay."
refs = ["#7405"]
