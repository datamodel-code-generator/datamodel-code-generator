[[change]]
id = "use-str-for-formats-msgspec-cannot-decode"
category = "new-surface"
title = "Write str for the formats msgspec cannot decode under an option"
summary = "--use-str-for-formats-msgspec-cannot-decode writes str for the formats ipv4, ipv6, ipv4-network, ipv6-network and path of msgspec output under --use-standard-primitive-types, where msgspec has no decoder for IPv4Address, IPv6Address, IPv4Network, IPv6Network and Path, so a Struct that holds them rejects every document unless the caller decodes them with a dec_hook, and a union of them is refused when the Struct is built (#7342); UUID, Decimal and the dates keep their classes; without the option msgspec output keeps the standard library classes, as in 0.100.0."
refs = ["#7342"]
surface = ["--use-str-for-formats-msgspec-cannot-decode"]
