[[change]]
id = "client-codec-enum-kinds"
category = "experimental"
title = "Generated dataclass clients decode boolean and number enums inside a union"
summary = "In a union, the dataclasses.dataclass client codec read an enum's JSON kinds from its string and integer values alone, so a boolean or float enum decoded to the raw value and accepted values outside the enum. It now reads the kind of every value: `false` of `enum: [false]` decodes to the member and `true` is refused, as in Pydantic clients. A union of an open number or boolean enum and a plain number or boolean is now refused at generation, as open string and integer enums already were."
kind = "experimental"
action = "review"
source = "release-note"
refs = ["#7014"]
affects = { experimental = ["cli-option.generate-client"] }
covers = [
    "api_generation/client_generation/client_render[union-value-kinds-enums].dataclasses_dataclass/",
    "api_generation/client_generation/client_render[union-value-kinds-enums].txt",
    "api_generation/client_generation/client_render[union-value-kinds-enums].typing_TypedDict/",
    "api_generation/client_generation/client_render[union-value-kinds-literals].dataclasses_dataclass/",
    "api_generation/client_generation/client_render[union-value-kinds].dataclasses_dataclass/",
]
