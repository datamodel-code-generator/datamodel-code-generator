[[change]]
id = "keep-inherited-dataclass-config"
category = "new-surface"
title = "Keep the config a pydantic dataclass inherits under an option"
summary = "--keep-inherited-dataclass-config makes a pydantic dataclass that sets its own config keep the config items it inherits from its first base (str_max_length, populate_by_name, extra, alias_generator and the regex engine), merged with its own where its own wins. Without it such a class keeps its own config alone, as before; the default output is unchanged. Where the schema and the inherited config disagree the option can make validation looser than the schema: a child's own \\p{L} pattern is left out and its $ then accepts a trailing newline, a second base loses its pattern, and a lone-surrogate base keeps no pattern."
refs = ["#1", "#7497", "#7560"]
surface = ["--keep-inherited-dataclass-config"]
