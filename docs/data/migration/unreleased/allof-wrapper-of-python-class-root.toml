[[change]]
id = "allof-wrapper-of-python-class-root"
category = "default-fix"
title = "An allOf wrapper of an x-python-type class is a root of that class"
summary = "An allOf wrapper whose one member is a definition that holds an x-python-type class (the root of that class, see the x-python-type-object-root record) was written as an empty model that subclassed the base or held nothing. It is now the root of the class under its own name, written through the same form as an allOf wrapper of a value target: a Pydantic RootModel[Base] (with arbitrary_types_allowed=True), or a type alias of the class in dataclass, TypedDict and msgspec output. This covers a wrapper over a base in another file, an inline allOf member, two equal members, chains of wrappers, keywords that do not add properties (closed, unevaluatedProperties, minProperties, a title, a type, a null default) and union branches. Union branches beside the member that main deduplicated into one empty class become one root per branch, so a numbered class is added (Branches2 beside Branches1, and the union names both). The empty wrapper held no value, but some working output changes. A wrapper over an empty base loses its subclass relation to the base: issubclass, the no-argument build, {} and model_json_schema() go, as for the converted roots of the x-python-type-object-root record. Under --reuse-model and --collapse-root-models, a class that equalled such a wrapper reuses it or is inlined like any root model, and a numbered class name of the former empty model is gone with it. A wrapper stays a model where a model extends it, two bases or a property are present, a union names it by a discriminator, or it has a custom base class. The owner decided this under the exception of the x-python-type-object-root record on 2026-11-28, including the lost subclass relation of an empty wrapper over an empty base."
refs = ["#7627", "#7618"]
decision = ["#7627", "#7622"]
kind = "default-output"
action = "review"
source = "release-note"
