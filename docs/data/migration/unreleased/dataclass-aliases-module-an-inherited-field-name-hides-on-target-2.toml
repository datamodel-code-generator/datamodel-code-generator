[[change]]
id = "dataclass-aliases-module-an-inherited-field-name-hides-on-target-2"
category = "default-fix"
title = "A pydantic dataclass for target 2 aliases a module, builtin or class that an inherited field name hides"
summary = "A pydantic_v2.dataclass with --target-pydantic-version 2 that inherits a field named like a sibling module, a builtin or a class of its file (a base field user beside the module user, a field str, a field Place) binds the name to an alias and names the alias where the annotation needs it (from . import user as user_aliased, from builtins import str as str_aliased, Place_aliased = Place). Pydantic 2.0 sets the defaults a class inherits on the class and evaluates the class's annotations in that namespace, where the default hides the module, builtin or class. This also changes the modules that imported on Pydantic 2.0 but rejected valid payloads (an Optional[date] or list[Place] field read the default instead of the type). On later Pydantic releases the modules keep their classes, field names and order, bases, required-ness and parsed values; a module no longer has the attribute that only the replaced import bound: a sibling module imported under its own name (billing.user, venue.place under --snake-case-field) or a class imported from another module (venue.Place under --use-exact-imports)."
refs = ["#7631", "#7584"]
decision = ["#7631"]
kind = "default-output"
action = "review"
source = "release-note"

