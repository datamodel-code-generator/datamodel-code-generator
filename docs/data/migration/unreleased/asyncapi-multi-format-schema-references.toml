[[change]]
id = "asyncapi-multi-format-schema-references"
category = "experimental"
title = "A reference to a component Multi Format Schema Object names the schema it holds"
summary = "A payload, headers or component $ref to a Multi Format Schema Object in components.schemas, also through component aliases, is typed by the JSON Schema the object holds: the RootModel[Any] read from the wrapper (NoteModel) is gone, the payload, headers and alias classes are root models over the held model, and the held model takes the component's name where the wrapper took it before (Tag1 is Tag)."
refs = ["#6936"]
decision = ["#6936"]
kind = "experimental"
action = "review"
source = "release-note"
affects = { experimental = ["input-format.asyncapi"] }
covers = [
    "main/asyncapi/main_asyncapi/component_aliases_of_multi_format_schema_object.py",
    "main/asyncapi/main_asyncapi/reference_to_multi_format_schema_object.py",
    "main/asyncapi/main_asyncapi/reference_to_multi_format_schema_object_of_another_document.py",
]

