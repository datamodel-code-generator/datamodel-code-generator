[[change]]
id = "release-surface-records-presets"
category = "harness"
title = "Record what a release fixes in the release surface file"
summary = "The upgrade guide builder records the dated presets, the recommender rules digest and the experimental ids with their since_versions of a release; the package writes the same output."
covers = [
    "build_migration_docs_script/build_migration_docs_invalid_data[released facts changed].txt",
    "build_migration_docs_script/build_migration_docs_invalid_data[surface without released facts].txt",
    "build_migration_docs_script/build_migration_docs_stamp.txt",
    "build_migration_docs_script/build_migration_docs_stamp_after_a_merge_onto_the_tagged_date.txt",
    "build_migration_docs_script/build_migration_docs_stamp_retained_extension.txt",
]
