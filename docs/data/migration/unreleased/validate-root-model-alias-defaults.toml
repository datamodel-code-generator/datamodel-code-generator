[[change]]
id = "validate-root-model-alias-defaults"
category = "new-surface"
title = "Validate the defaults of fields naming root models written as aliases"
summary = "Under --use-root-model-type-alias, --use-validate-default-for-root-model-type-aliases writes validate_default=True for the default of a field whose type names a root model written as an alias, so Pydantic validates it into the root model."
refs = ["#7065"]
surface = ["--use-validate-default-for-root-model-type-aliases"]
