    "builtin_formatter/parser_config_contract.txt",
    "input_model/config_class.txt",
    "main/help/color.txt",
    "main/help/no_color.txt",
    "main/jsonschema/root_model_type_alias_defaults/root_model_type_alias_defaults[released].payloads.txt",
    "main/jsonschema/root_model_type_alias_defaults/root_model_type_alias_defaults[released].py",
    "main/jsonschema/root_model_type_alias_defaults/root_model_type_alias_defaults[validated-annotated].payloads.txt",
    "main/jsonschema/root_model_type_alias_defaults/root_model_type_alias_defaults[validated-annotated].py",
    "main/jsonschema/root_model_type_alias_defaults/root_model_type_alias_defaults[validated].payloads.txt",
    "main/jsonschema/root_model_type_alias_defaults/root_model_type_alias_defaults[validated].py",
    "main_kr/generate_prompt/basic.txt",
    "main_kr/generate_prompt/json_output.txt",
    "main_kr/generate_prompt/with_list_options.txt",
    "main_kr/generate_prompt/with_options.txt",
