[[change]]
id = "client-tools-functions"
category = "new-surface"
title = "Add a tool table over the client's operations for agents"
summary = "--client-tools functions (experimental) adds tools.py to a client package of Pydantic v2 models: Toolset(client) and AsyncToolset(client) hold a tool for each operation whose arguments and success results are JSON values, named by its client method, such as pets_get_pet. search(query) ranks the tools by their names, tags, routes, descriptions and signatures, schema(name) gives the JSON schemas of a tool's arguments and result from the models, without the description, title or examples of any schema under --untrusted-input (the models keep theirs), and call(name, arguments) validates the arguments as JSON through the models, calls the method and returns the JSON result, or an error value that holds no header or URL, with each credential the client placed on the call's requests replaced in the result and in an error's request ID and body. Parameters at a credential's position and the request options are never arguments, and read_only=True leaves out the tools of unsafe methods. An operation left out of the tools keeps its method, and generation warns why. Without the option a package behaves as before; its copied runtime only notes the credentials a call places, which the tools read."
refs = ["#7517"]
surface = ["--client-tools"]
covers = [
    "api_generation/client_cli/tools.py",
    "api_generation/client_cli/tools.table.py",
