[[change]]
id = "factory-g6-payload-reach"
category = "harness"
title = "Run the payload suite over the inputs a change reaches and over OpenAPI components"
summary = "The payload test suite selects the inputs a change adds or modifies and runs the OpenAPI component cases on every validating backend, including documents with dotted component names; the package writes the same output."
covers = [
    "main/payload_validation/cases_cover_discovered_schema_files.txt",
    "main/payload_validation/payload_runtime_version_policies.txt",
    "related_tests_script/related_tests_rows_print_the_environments_of_the_repository_rules.txt",
    "verify_script/verify_compares_the_picked_cells_twice[a catalog in the cache].txt",
    "verify_script/verify_compares_the_picked_cells_twice[a change no cell runs].txt",
    "verify_script/verify_compares_the_picked_cells_twice[a change of no output].txt",
    "verify_script/verify_compares_the_picked_cells_twice[a changed test helper alone].txt",
    "verify_script/verify_compares_the_picked_cells_twice[a changed test module that fails].txt",
    "verify_script/verify_compares_the_picked_cells_twice[a changed test module that passes].txt",
    "verify_script/verify_compares_the_picked_cells_twice[a flaky change].txt",
    "verify_script/verify_compares_the_picked_cells_twice[an output change].txt",
    "verify_script/verify_compares_the_picked_cells_twice[no catalog yet].txt",
    "verify_script/verify_compares_the_picked_cells_twice[src unchanged].txt",
    "where_script/where_grammar[line-in-a-script].txt",
    "where_script/where_reads_other_inputs[line-past-the-file].txt",
]
