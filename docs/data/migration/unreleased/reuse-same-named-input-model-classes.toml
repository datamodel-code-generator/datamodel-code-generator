[[change]]
id = "reuse-same-named-input-model-classes"
category = "default-fix"
title = "--input-model reuse imports the class a definition comes from"
summary = "With `--input-model-ref-strategy reuse-all` or `reuse-foreign`, a field whose type is one class (`item: Item` of `shop.Item`) was typed by another class of that name that the model's fields also name, such as `type[legacy.Item]` or a nested `Legacy.Item` (`item: legacy.Item`), which refused every valid value. It is now typed by its own class (`from shop import Item`), also for a dataclass or TypedDict input and for the fields of a parent model; this is the output of 0.75.0. A model that redeclares a parent's field with another class of the same name now keeps the field with its own class, and the parent's field imports the parent's class under an alias (`from legacy import Item as Item1`). Class and field names stay; schema-valid documents that were refused now validate."
refs = ["#7390"]
decision = ["#7390"]
kind = "default-output"
action = "review"
source = "release-note"
covers = [
    "input_model/reuse_same_named_classes[dataclass-reuse-all].txt",
    "input_model/reuse_same_named_classes[dataclass-reuse-foreign].txt",
    "input_model/reuse_same_named_classes[inherited-reuse-all].txt",
    "input_model/reuse_same_named_classes[merged-reuse-all].txt",
    "input_model/reuse_same_named_classes[model-reuse-all].txt",
    "input_model/reuse_same_named_classes[model-reuse-foreign].txt",
    "input_model/reuse_same_named_classes[nested-class-reuse-all].txt",
    "input_model/reuse_same_named_classes[overridden-reuse-all].txt",
    "input_model/reuse_same_named_classes[overridden-reuse-foreign].txt",
    "input_model/reuse_same_named_classes[two-models-reuse-all].txt",
    "input_model/reuse_same_named_discriminator_mapping.txt",
]
