[[change]]
id = "allof-enum-member-root-enum-class"
category = "crash-fix"
kind = "default-output"
action = "none"
source = "release-note"
title = "A named allOf whose merged root is an enum class is written as that enum"
summary = "A named allOf of an untyped constraint $ref and a typed enum member, such as allOf: [{$ref: ThreeLetters}, {type: string, enum: [GBP, JPY]}], stopped with \"a $ref chain that loops back\" for Pydantic and msgspec output, or wrote a field that admits only null under --collapse-root-models and a root model of itself under the presets; it is now written as its enum class. Standard dataclasses keep Any without --intersect-merged-allof-members."
refs = ["#7398"]
covers = [
    "main/jsonschema/main_jsonschema/allof_enum_member_of_constrained_ref[released-dataclasses.dataclass].py",
    "main/jsonschema/main_jsonschema/allof_enum_member_of_constrained_ref[released-msgspec.Struct].py",
    "main/jsonschema/main_jsonschema/allof_enum_member_of_constrained_ref[released-pydantic_v2.BaseModel].py",
    "main/jsonschema/main_jsonschema/allof_enum_member_of_constrained_ref[released-pydantic_v2.dataclass].py",
    "main/jsonschema/main_jsonschema/allof_enum_member_of_constrained_ref[released-typing.TypedDict].py",
]

