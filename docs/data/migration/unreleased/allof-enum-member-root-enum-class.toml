[[change]]
id = "allof-enum-member-root-enum-class"
category = "default-fix"
kind = "default-output"
action = "review"
source = "release-note"
title = "A named allOf whose merged root is an enum class is written as that enum"
summary = "A named allOf of an untyped constraint $ref and a typed enum member, such as allOf: [{$ref: ThreeLetters}, {type: string, enum: [GBP, JPY]}], stopped with \"a $ref chain that loops back\" for Pydantic and msgspec output, and under --collapse-root-models and the presets wrote a field or a root model that accepted no value of the enum; it is now written as its enum class, which accepts the values of the enum. Standard dataclasses keep Any without --intersect-merged-allof-members."
refs = ["#7399"]
decision = ["#7314"]
covers = [
    "main/jsonschema/main_jsonschema/allof_enum_member_of_constrained_ref[released-dataclasses.dataclass].py",
    "main/jsonschema/main_jsonschema/allof_enum_member_of_constrained_ref[released-msgspec.Struct].py",
    "main/jsonschema/main_jsonschema/allof_enum_member_of_constrained_ref[released-pydantic_v2.BaseModel].py",
    "main/jsonschema/main_jsonschema/allof_enum_member_of_constrained_ref[released-pydantic_v2.dataclass].py",
    "main/jsonschema/main_jsonschema/allof_enum_member_of_constrained_ref[released-typing.TypedDict].py",
    "main/jsonschema/main_jsonschema/allof_enum_member_of_untyped_ref_forms[msgspec.Struct-collapse].py",
    "main/jsonschema/main_jsonschema/allof_enum_member_of_untyped_ref_forms[preset-20261120].py",
    "main/jsonschema/main_jsonschema/allof_enum_member_of_untyped_ref_forms[pydantic_v2.BaseModel-collapse].py",
]

[[change.cells]]
input = ["tests/data/jsonschema/allof_enum_member_of_constrained_ref.json"]
backends = ["msgspec.Struct", "pydantic_v2.BaseModel", "pydantic_v2.dataclass"]
options = "*"
match = "^\\[(exit\\] 2 -> 0$|kind\\] Settlement: RootModel -> Enum$|type\\] Payment:settlement: (msgspec\\.UnsetType -> Union\\[Settlement, msgspec\\.UnsetType\\]|None -> Union\\[None, Settlement\\])$|message\\] removed handled: datamodel_code_generator\\.Error$|message\\] removed Payment uses a \\$ref chain that loops back without reaching a schema, which (msgspec cannot decode|Pydantic cannot build): Settlement |warning\\] removed builtins\\.UserWarning: msgspec\\.Meta does not take max_length, min_length on ; Payment\\.settlement is generated without)"

