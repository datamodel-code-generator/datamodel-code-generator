[[change]]
id = "client-tools-mcp"
category = "new-surface"
title = "Serve the tools of a generated client over MCP"
summary = "--client-tools mcp (experimental) adds mcp_server.py beside tools.py: server(client) returns a server of the low-level Server of the official mcp SDK over the tools of the asyncio client, and serve(make_client) and python -m <package>.mcp_server serve it on stdin and stdout. Each tool is listed with the JSON schemas of the models and with read-only and idempotent annotations from its HTTP method; a call validates its arguments through the models, a refused argument or a failed call is a result marked as an error, with the credentials the client placed redacted, and an unknown tool name is a protocol error. read_only=True lists only the tools of safe methods. The server looks up no credentials, and the printed requirements gain mcp>=2.3.0. Without the option a package is unchanged."
refs = ["#1"]
surface = ["--client-tools"]
covers = [
    "api_generation/client_cli/tools_mcp.notice.txt",
    "api_generation/client_cli/tools_mcp.py",
    "api_generation/client_generation/client_render[tools-mcp].pydantic_v2_BaseModel/",
    "api_generation/client_generation/client_render[tools-mcp].txt",
    "api_generation/client_install/client_install[tools-mcp-pydantic_v2.BaseModel].notice.txt",
    "api_generation/client_install/client_install[tools-mcp-pydantic_v2.BaseModel].py",
    "api_generation/client_install/client_install[tools-mcp-pydantic_v2.BaseModel].served.txt",
    "api_generation/client_publication/client_capabilities[tools-mcp].txt",
    "api_generation/client_runtime/client_runtime[tools-mcp-adversarial].txt",
    "api_generation/client_runtime/client_runtime[tools-mcp-untrusted].txt",
    "api_generation/client_runtime/client_runtime[tools-mcp].txt",
    "api_generation/client_typing/package[tools-mcp].txt",
    "api_generation/fastapi_server/generated_client[tools].txt",
    "main/main_general/list_experimental.stdout.txt",
    "main/main_general/list_experimental_json.stdout.txt",
    "main_kr/generate_prompt_basic.stdout.txt",
    "main_kr/generate_prompt_json.stdout.txt",
