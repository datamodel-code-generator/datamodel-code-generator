[[change]]
id = "bug-g33-union-shape-warnings"
category = "notice"
title = "Warn where an allOf over a union drops what the union checks"
summary = "Without --distribute-allof-over-unions an allOf member naming an allOf over a union warns that the model checks none of its branches (#5305), and without --distribute-allof-over-object-branches so does a branch of an allOf's union that is itself a union or an alias (#6869). The generated output does not change."
