[[change]]
id = "bug-g10-msgspec-reuse-warnings"
category = "notice"
title = "Show the warnings of msgspec runs that now generate"
summary = "A msgspec run that stopped with incompatible layouts under --reuse-model now generates, so it shows the warnings its models raise, such as that msgspec cannot decode a union whose Struct types are not all tagged; a directory input shows those of every module, and the single-file attempt before its modular output now stops on the modular references."
refs = ["#7446"]
kind = "warning"
action = "none"
source = "release-note"

[[change.cells]]
input = [
    "tests/data/jsonschema/schema_intersection",
    "tests/data/jsonschema/schema_intersection/allof_union_member_declarations.json",
]
backends = ["msgspec.Struct"]
options = "*"
aspects = ["warning", "message"]
match = "^\\[(warning\\] added |message\\] removed handled: datamodel_code_generator\\.Error$|message\\] removed msgspec\\.Struct model '[^']+' has incompatible layouts from generated bases |message\\] added first attempt: \\{\"code\": 2, \"handled\": \\[\"datamodel_code_generator\\.Error\"\\], \"messages\": \"Modular references require an output directory)"
