[[change]]
id = "strict-date-time-types"
category = "new-surface"
title = "`--strict-types` takes `datetime`, `date` and `time`"
summary = "--strict-types datetime, date and time write the date and time formats of a string as Annotated[<type>, Strict()] in Pydantic v2 output, so numbers that lax mode reads as a Unix time or as seconds are rejected (-1 for a date-time string). JSON input still accepts ISO strings; Python input must be datetime, date or time objects. Integer or number date-time formats, number time formats, the pendulum types and the other output types are unchanged."
refs = ["#2500"]
surface = ["--strict-types datetime", "--strict-types date", "--strict-types time"]
covers = [
    "input_model/config_class.txt",
    "main/jsonschema/main_jsonschema/main_strict_types_date_time[annotated].py",
