[[change]]
id = "same-named-files-in-path-order"
category = "decided-change"
title = "Files with the same name in different subdirectories of a directory input are read in path order"
summary = "Files with the same name in different subdirectories of a directory input are now read in path order. Before, their order came from the file system, so numbered class names such as Status1 and Status2 could differ between machines or CI runner images. If you generate from such a directory, regenerate once: some numbered names may swap; after that they are the same everywhere. Directory inputs whose files all have different names are read as before. The file that settles the input type of a directory, when the type is not given, is the first in the same order."
kind = "default-output"
action = "review"
source = "release-note"
keep = { note = "No option restores the file system order: it was not the same on two machines." }
refs = ["#7564", "#7552"]
decision = ["#7552"]
covers = [
    "main/jsonschema/main_jsonschema/directory_input_same_named_files_order[nested].model/",
    "main/jsonschema/main_jsonschema/directory_input_same_named_files_order[three].model/",
    "main/jsonschema/main_jsonschema/directory_input_same_named_files_order[two].model/",
    "main/openapi/main_openapi/directory_input_same_named_files_order[nested].model/",
    "main/openapi/main_openapi/directory_input_same_named_files_order[three].model/",
    "main/openapi/main_openapi/directory_input_same_named_files_order[two].model/",
]

[[change.cells]]
input = ["tests/data/jsonschema/nested_resources"]
backends = "*"
options = "*"
aspects = ["numbered-name-removed"]
