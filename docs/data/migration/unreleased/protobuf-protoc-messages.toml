[[change]]
id = "protobuf-protoc-messages"
category = "notice"
title = "Protoc's warnings and errors name the input file without the run's temporary directory"
summary = "A warning or an error of protoc, such as the unused import warning, names the input file as the schema is named instead of by a path inside the run's temporary directory, and an invalid schema's error carries protoc's details."
refs = ["#7251"]
kind = "warning"
action = "none"
source = "release-note"

[[change.cells]]
input = ["tests/data/protobuf/complex_proto3.proto"]
backends = "*"
options = "*"
match = "^\\[message\\] (added complex_proto3\\.proto|removed /\\S+/complex_proto3\\.proto):7:1: warning: Import missing_weak\\.proto is unused\\.$"

[[change.cells]]
input = ["tests/data/protobuf/proto3_optional.proto"]
backends = "*"
options = "*"
match = "^\\[message\\] (added proto3_optional\\.proto|removed /\\S+/proto3_optional\\.proto):7:1: warning: Import common\\.proto is unused\\.$"
