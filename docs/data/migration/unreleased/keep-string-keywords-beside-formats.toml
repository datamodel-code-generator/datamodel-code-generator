[[change]]
id = "keep-string-keywords-beside-formats"
category = "new-surface"
title = "Keep the string keywords beside a format"
summary = "--keep-string-keywords-beside-formats keeps the minLength, maxLength and pattern beside a string format that Pydantic output writes as a class no constr call constrains: an email or password takes them in Annotated[EmailStr, Field(...)], a byte checks them on the base64 text, a uri with a keyword is the plain string they check, and msgspec output keeps the keywords an allOf member adds beside a $ref to a string with a date or UUID format."
refs = ["#7198", "#7345", "#7181"]
surface = ["--keep-string-keywords-beside-formats"]
covers = [
