[[change]]
id = "enum-base-name-field-type"
category = "crash-fix"
kind = "default-output"
action = "none"
source = "release-note"
title = "A field named like its type is renamed when the base class name contains \"Enum\""
summary = "A model whose base class name contains \"Enum\" (a generated base such as EnumerationBase, or a custom --base-class such as EnumAwareModel) now renames a field named like its type, as other models do, so Pydantic output no longer fails at import; only enum classes keep their member names."
refs = ["#6840"]
covers = [
    "main/jsonschema/jsonschema_field_named_like_type_beside_enum_named_base.py",
    "main/jsonschema/jsonschema_field_named_like_type_beside_enum_named_custom_base.py",
]
