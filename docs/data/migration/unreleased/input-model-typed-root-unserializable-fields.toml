[[change]]
id = "input-model-typed-root-unserializable-fields"
category = "crash-fix"
title = "--input-model generates a dataclass or TypedDict root with a Callable field"
summary = "A dataclass, Pydantic dataclass or TypedDict root with a field JSON Schema cannot express, such as a Callable or an arbitrary class, in the root or in a class it holds, failed with PydanticInvalidForJsonSchema: Cannot generate a JsonSchema for core_schema.CallableSchema. Such a root now takes the generation of a Pydantic root, so the field keeps its Python type (hook: Callable[[int], int]), a union keeps its Callable branch and type[int] is written Type[int], as a Pydantic root writes them. A Pydantic dataclass read by name, not by alias, writes its aliased Callable field str, as a held class does since 0.101.0. A root the standard schema generator writes is unchanged."
refs = ["#7566", "#7435"]
kind = "default-output"
action = "none"
source = "release-note"
covers = [
    "input_model/typed_root_callable_defaults.txt",
    "input_model/unserializable_fields_of_typed_roots[arbitrary-type].txt",
    "input_model/unserializable_fields_of_typed_roots[callable-forms].txt",
    "input_model/unserializable_fields_of_typed_roots[callable-in-containers].txt",
    "input_model/unserializable_fields_of_typed_roots[callable-in-tuple].txt",
    "input_model/unserializable_fields_of_typed_roots[dataclass-root-dataclasses.dataclass].txt",
    "input_model/unserializable_fields_of_typed_roots[dataclass-root-msgspec.Struct].txt",
