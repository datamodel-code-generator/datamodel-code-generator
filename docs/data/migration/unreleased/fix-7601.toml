[[change]]
id = "fix-7601"
category = "crash-fix"
title = "Types written after a module aliases an import name the alias, so the module imports"
summary = "Where a field name of a module hides an import (Item has a field date), the module imports it as from datetime import date as date_aliased. A type a --type-overrides key wrote after that (a class or annotation override, scoped, model-level or with --type-overrides-replace-whole-type), or a root type --collapse-root-models inlined from another module, named the bare date. In a Pydantic class body that name is the default of the field date (None), so when: date | None failed at import with TypeError: unsupported operand type(s) for |, and where no other type of the module named the alias the import was dropped too. Such a type now names the alias (when: date_aliased | None) and the import stays. The other way round, a root of a module that aliased date, inlined by --collapse-root-models into a module that did not, carried the alias along: that module imported only date as date_aliased and left its own date fields unbound; it now writes date throughout. Only modules that failed to import change; class names, field names, field order and the override's type are unchanged, and dataclasses, TypedDict and msgspec output, where nothing aliases date, keeps its output."
refs = ["#7616", "#7601", "#7604", "#7615"]
kind = "default-output"
action = "none"
source = "release-note"
