[[change]]
id = "msgspec-joins-below-configured-classes"
category = "default-fix"
title = "A msgspec struct whose generated bases conflict below a configured base class imports"
summary = "With --output-model-type msgspec.Struct, a model whose allOf joins two generated models whose fields msgspec cannot lay out together was written as a subclass of both when one of them, or a model it inherits from, takes a configured base class (--base-class-map, customBasePath) or a --type-overrides class, and the module failed at import with TypeError: multiple bases have instance lay-out conflict. With --reuse-model, or when the overridden model came first, generation stopped with \"has incompatible layouts from generated bases\" instead. Such a model is now written as a Struct that declares the fields of its bases itself, as other conflicting joins are since 0.86.0: it keeps its name, its fields and the values it accepts, but it no longer inherits from the generated bases or from the configured classes above them, so isinstance checks and methods of those classes no longer apply to it. A join whose conflicting bases both sit below configured classes, as with a --base-class that every model takes, is written as before. One output that imports moves the same way: a join below a configured class that itself subclasses a generated model of the same output (a user module importing the generated package). A join with a type override on one side and a configured class on the other, which failed at import, now stops with the incompatible-layouts error instead of writing the module."
refs = ["#1", "#7456"]
decision = ["#7456"]
kind = "default-output"
action = "review"
source = "release-note"
