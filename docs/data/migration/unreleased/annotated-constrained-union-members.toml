[[change]]
id = "annotated-constrained-union-members"
category = "output-text"
kind = "output-text"
action = "none"
title = "`--use-annotated` writes the constrained members of unions as `Annotated`"
summary = "Under `--use-annotated`, a union member that takes its own constraints, such as the `string` of `type: [integer, string]` with a `pattern` or the `integer` of a type list with a `minimum`, in a field, a list item, a dict value or a root model, was written as a `con*()` call, which mypy and pyright refuse in an annotation. It is now written as `Annotated[<type>, Field(...)]` (a `Decimal` `multipleOf` as `MultipleOf(...)`), as a type alias body already wrote it. The models accept and reject the same values; without `--use-annotated` nothing changes."
affects = { output_model_types = ["pydantic_v2.BaseModel", "pydantic_v2.dataclass"], options = ["--use-annotated"] }
before = "code: int | constr(pattern=r'^[0-9]+$')"
after = "code: int | Annotated[str, Field(pattern=r'^[0-9]+$')]"
refs = ["#7109"]
source = "release-note"
covers = [
