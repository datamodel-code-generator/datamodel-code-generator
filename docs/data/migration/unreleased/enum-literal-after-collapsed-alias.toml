[[change]]
id = "enum-literal-after-collapsed-alias"
kind = "default-output"
action = "review"
title = "A Literal member of an enum named through a collapsed alias imports the enum"
summary = "Under `--collapse-root-models-name-strategy parent`, a module that named an enum of another module through a collapsed alias wrote the enum without importing it in two places: in an enum member literal (`--use-enum-values-in-discriminator`, or a const beside an enum under `--read-const-beside-enum`) and, under `--reuse-model`, where the enum replaced a duplicate that reuse removed. The models that named it failed when they were used. The module now imports the enum and writes `Literal[b.Foo.cat, 'cat']`. Output that worked before is unchanged."
affects = { options = ["--collapse-root-models-name-strategy parent"] }
before = "kind: Literal[Foo.cat, 'cat']"
after = "kind: Literal[b.Foo.cat, 'cat']"
keep = { note = "The previous module imported, but the models that named the enum failed at first use, as the module did not import it; nothing restores it." }
refs = ["#6842"]
source = "release-note"
