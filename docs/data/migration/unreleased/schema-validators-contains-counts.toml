[[change]]
id = "schema-validators-contains-counts"
category = "experimental"
kind = "experimental"
action = "review"
title = "Schema validators check the item counts of contains, minContains and maxContains"
summary = "With `--generate-schema-validators` (or `--schema-validator-type pydantic-v2`), an array with a `contains` schema gets a check on the raw input that counts the items that schema accepts and rejects the array when fewer than `minContains` (1 when absent) or more than `maxContains` match: `[\"other\"]` is now rejected for `contains: {const: \"target\"}`, and `[\"k1\", \"k2\"]` for `contains: {pattern: \"^k\"}, maxContains: 1`, as JSON Schema rejects them. The items are counted with the meaning of the contains schema, not with the generated item type: a boolean is no number, `1.0` is an integer, a string keyword applies to strings and a numeric one to numbers only, so `[1, \"2\"]` stays valid for `contains: {type: integer}, maxContains: 1` with or without `--strict-types`. The count is checked where the contains schema holds only `type`, `const`, `enum`, `pattern`, `minLength`, `maxLength`, `minimum`, `maximum`, `exclusiveMinimum`, `exclusiveMaximum` and `multipleOf` besides metadata; a contains with any other keyword (a `$ref`, `properties`, `required`, `format`, ...), a pattern Python cannot compile (`\\p{L}`, `(?<name>...)`), a `multipleOf` that is not an integer or an enum `--ignore-enum-constraints` drops gets no count check. `minContains` and `maxContains` count from draft 2019-09 on; in a draft-06 or draft-07 schema `contains` needs one match and the two keywords are ignored, as those drafts ignore them. The check holds for root models, properties, array items and tails, mapping values, allOf members and the arrays every branch of a oneOf or anyOf requires it for. Models gain `__json_schema_contains__` and a shared base with `_validate_json_schema_contains`. Without the option nothing changes."
affects = { experimental = ["cli-option.generate-schema-validators"] }
refs = ["#7052"]
decision = ["#7052"]
source = "release-note"
