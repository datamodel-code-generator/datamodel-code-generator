[[change]]
id = "use-unmapped-variant-tag-values"
category = "new-surface"
title = "Give a variant a mapping names the other values its tag property admits"
summary = "--use-unmapped-variant-tag-values gives a discriminated variant that a mapping key names, and whose tag property admits several values (Cat.kind: enum [cat, kitty] with the mapping cat: Cat), also the values no mapping key and no other variant claim, after its mapping keys, Literal['cat', 'kitty'], so the union accepts the documents of the variant that carry them (a value another variant also admits stays refused, as a tag selects one variant); without it the variant takes only its mapping keys, as in 0.97.0. The 20261118 presets set it. A msgspec Struct takes one tag, so it keeps the one it has either way."
refs = ["#7089"]
surface = ["--use-unmapped-variant-tag-values"]
covers = [
    "main/generation_platform/client/discriminator-values-unmapped.txt",
    "main/generation_platform/client/packages/discriminator-values-unmapped/dataclasses_dataclass//*.py",
