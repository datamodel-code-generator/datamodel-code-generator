[[change]]
id = "union-map-key-root-models"
category = "default-fix"
kind = "default-output"
action = "review"
source = "release-note"
title = "A map key names the root type of its RootModel members"
summary = "A map key that is a union (propertyNames anyOf or oneOf) whose members are all RootModels, a one-member wrapper of a RootModel included, was written with the RootModel class, which Pydantic cannot use as a dict key, so every key the union accepts raised TypeError. The members are now written as their root types, as a key that names the RootModel alone is; the class itself stays. A union key with a member that is no RootModel (a str, a constr call, an enum, Any) keeps the RootModel class unless --use-root-types-for-mixed-union-map-keys is set."
refs = ["#7434"]
decision = ["#7434"]
covers = [
    "main/jsonschema/main_jsonschema/compound_property_names_compatibility[api-unsupported_one_sibling-False].py",
    "main/jsonschema/main_jsonschema/compound_property_names_compatibility[api-unsupported_sibling-False].py",
    "main/jsonschema/main_jsonschema/compound_property_names_compatibility[cli-unsupported_one_sibling-False].py",
    "main/jsonschema/main_jsonschema/compound_property_names_compatibility[cli-unsupported_sibling-False].py",
    "main/jsonschema/property_names_union_keys/property_names_root_model_union_key_modules/",
    "main/jsonschema/property_names_union_keys/property_names_root_model_union_key_roots[default].py",
    "main/jsonschema/property_names_union_keys/property_names_root_model_union_key_roots[field-constraints].py",
    "main/jsonschema/property_names_union_keys/property_names_root_model_union_keys[collapse-root-models].py",
    "main/jsonschema/property_names_union_keys/property_names_root_model_union_keys[default].py",
    "main/jsonschema/property_names_union_keys/property_names_root_model_union_keys[faux-immutability].py",
    "main/jsonschema/property_names_union_keys/property_names_root_model_union_keys[field-constraints].py",
