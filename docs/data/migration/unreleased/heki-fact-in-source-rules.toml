    "source_rules/a_table_that_cannot_be_read_holds_no_capability[entry-shape].txt",
    "source_rules/a_table_that_cannot_be_read_holds_no_capability[no-table].txt",
    "source_rules/a_table_that_cannot_be_read_holds_no_capability[not-a-dict].txt",
    "source_rules/a_table_that_cannot_be_read_holds_no_capability[not-a-literal].txt",
    "source_rules/joined_entries_keep_their_own_exclusions.txt",
    "source_rules/lanes_are_read_from_the_matrix_and_tox.txt",
    "source_rules/rule_reports_its_site_and_not_the_near_miss[dead-capability].txt",
    "source_rules/rule_reports_its_site_and_not_the_near_miss[never-run].txt",
