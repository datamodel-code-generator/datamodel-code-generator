[[change]]
id = "heki-fact-in-source-rules"
category = "harness"
title = "Read heki as an environment fact and judge never-run on the lanes that run a test"
summary = "heki becomes an environment fact like black and isort, a tool only a dependency group installs is empty where that group is not installed, and never-run counts a subset lane only for the tests it lists; the outputs of the capability tests count as internal; the package writes the same output"
