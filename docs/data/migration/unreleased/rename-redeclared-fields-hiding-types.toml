[[change]]
id = "rename-redeclared-fields-hiding-types"
category = "new-surface"
title = "Rename the field a subclass redeclares as its base's renamed field"
summary = "--rename-redeclared-fields-hiding-types gives a field that a subclass redeclares the name its base's field was given where that field is renamed because it is named like its type (Pet_1 with alias Pet), so the subclass holds one field for the wire key instead of two. Without it the redeclared field keeps its name beside the inherited renamed one, as in 0.100.0. The 20261123 presets set it."
refs = ["#7103"]
surface = ["--rename-redeclared-fields-hiding-types"]
covers = [
    "main/jsonschema/field_named_like_type_options/redeclared_field_follows_rename[option-annotated].fields.txt",
