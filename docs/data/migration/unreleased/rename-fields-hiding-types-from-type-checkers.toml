[[change]]
id = "rename-fields-hiding-types-from-type-checkers"
category = "new-surface"
title = "Tell a field named like its type from that type for type checkers"
summary = "--rename-fields-hiding-types-from-type-checkers renames a msgspec field that the class body assigns and that is named like its type, keeping the wire name in name=, and renames the type of a dataclasses.dataclass field in that case, as a type checker reads the annotation as the field otherwise. A subclass that redeclares a renamed field takes its name. Without it these outputs are as in 0.100.0. The 20261123 presets set it."
refs = ["#7358"]
surface = ["--rename-fields-hiding-types-from-type-checkers"]
covers = [
    "main/jsonschema/field_named_like_type_options/static_hide_renames[option-dataclasses.dataclass].py",
    "main/jsonschema/field_named_like_type_options/static_hide_renames[option-msgspec.Struct].py",
    "main/jsonschema/field_named_like_type_options/static_hide_renames[option-pydantic_v2.BaseModel].py",
    "main/jsonschema/field_named_like_type_options/static_hide_renames[option-pydantic_v2.dataclass].py",
    "main/jsonschema/field_named_like_type_options/static_hide_renames[option-typing.TypedDict].py",
    "main/jsonschema/field_named_like_type_options/static_hide_renames[released-dataclasses.dataclass].py",
    "main/jsonschema/field_named_like_type_options/static_hide_renames[released-msgspec.Struct].py",
    "main/jsonschema/field_named_like_type_options/static_hide_renames[released-pydantic_v2.BaseModel].py",
    "main/jsonschema/field_named_like_type_options/static_hide_renames[released-pydantic_v2.dataclass].py",
    "main/jsonschema/field_named_like_type_options/static_hide_renames[released-typing.TypedDict].py",
]
