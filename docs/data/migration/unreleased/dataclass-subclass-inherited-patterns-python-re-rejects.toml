[[change]]
id = "dataclass-subclass-inherited-patterns-python-re-rejects"
category = "crash-fix"
title = "A pydantic dataclass that builds inherited patterns with python-re imports when the patterns sit in another module or a type alias"
summary = "A pydantic_v2.dataclass that selects regex_engine python-re for a lookaround of a base redeclares each inherited field whose pattern Python's re rejects without that pattern, and warns. Fields of a base in another module, and fields whose type alias holds the pattern, were not redeclared, so the module failed at import with re.error: bad escape \\p; such a module now imports, naming the models of the copies from its own module. A dataclass that takes an alias_generator from the config of a base in another module now imports it instead of failing with NameError."
refs = ["#1", "#7487", "#7548"]
kind = "default-output"
action = "none"
source = "release-note"
covers = [
