[[change]]
id = "served-document-reads-the-record"
category = "experimental"
title = "The served document of a generated FastAPI server resolves references by the names the models read"
refs = ["#7178"]
summary = "With `--generate-server fastapi`, the served OpenAPI document resolves a `$ref` through the `$id`, `$anchor` and `$dynamicAnchor` names the parser registers for the models, instead of an index of its own. Three references that the models already resolve, and that the served document kept as written with \"The served document keeps ..., which names nothing the generation loaded\", now name the schema the models use: a plain name of an anchor in a namespace of definitions (`$defs: {v1: {Label: {$anchor: label}}}`, named `#label`), a reference by the root `$id` of a referenced JSON Schema document into that document (`https://example.com/schemas/pet#/$defs/Name`, bundled as a component), and, under OpenAPI 3.0, a reference by the `$id` of a component schema (`https://example.com/owner.json`, with `--no-allow-remote-refs`). Two other references follow the models too: a plain name whose anchor a `schema` beside a Reference Object (which OpenAPI ignores) also declares now names the anchored property the models read instead of that ignored schema, and a JSON pointer below the `$id` of a parameter document first loaded by a pointer (`#/properties/size`), which the models keep as a dangling reference, is kept as written with the same message instead of being bundled (with `--strict-refs` both resolve it), and so is a JSON pointer below the `$id` of a schema written inline in `paths` (`#/$defs/Title`), which the models also keep as a dangling reference, instead of naming that inline schema's `$defs` entry. The models do not change."
kind = "experimental"
action = "none"
affects = { experimental = ["cli-option.generate-server"] }
before = '"label": {"$ref": "#label"}'
after = '"label": {"$ref": "#/components/schemas/Pet/$defs/v1/Label"}'
source = "release-note"

[[change]]
id = "typeddict-members-follow-model-base-order"
category = "experimental"
refs = ["#4300"]
kind = "experimental"
action = "review"
title = "Generated clients bind the keys of a TypedDict whose bases Python cannot order"
summary = "With `--generate-client` and the `typing.TypedDict` output, a TypedDict whose bases have conflicting orders (`E: allOf [C, D]` with `C: allOf [A, B]` and `D: allOf [B, A]`), which Python creates because a TypedDict has no method resolution order of its own, was bound without keys: its codec listed no fields (`Model(())`) and a body of it took no field arguments under `--client-body-arguments both`. Its keys are now bound in the order the models give its bases, the order every other class already takes: the codec lists them, decoded objects hold them in that order, and the call that sends such a body takes them as field arguments. The Pydantic and dataclass outputs refuse such a class at generation; msgspec writes no generated bases."
affects = { experimental = ["cli-option.generate-client"], output_model_types = ["typing.TypedDict"] }
before = "models.E: Model(()),"
after = "models.E: Model((Field('b', 'b'), Field('a', 'a'), Field('d', 'd'), Field('c', 'c'), Field('e', 'e'))),"
source = "release-note"
