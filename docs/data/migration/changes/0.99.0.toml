# The changes of 0.99.0, moved from docs/data/migration/unreleased/ when the release was stamped.

[[change]]
id = "annotated-constrained-union-members"
category = "output-text"
kind = "output-text"
action = "none"
title = "`--use-annotated` writes the constrained members of unions as `Annotated`"
summary = "Under `--use-annotated`, a union member that takes its own constraints, such as the `string` of `type: [integer, string]` with a `pattern` or the `integer` of a type list with a `minimum`, in a field, a list item, a dict value or a root model, was written as a `con*()` call, which mypy and pyright refuse in an annotation. It is now written as `Annotated[<type>, Field(...)]` (a `Decimal` `multipleOf` as `MultipleOf(...)`), as a type alias body already wrote it. The models accept and reject the same values; without `--use-annotated` nothing changes."
affects = { output_model_types = ["pydantic_v2.BaseModel", "pydantic_v2.dataclass"], options = ["--use-annotated"] }
before = "code: int | constr(pattern=r'^[0-9]+$')"
after = "code: int | Annotated[str, Field(pattern=r'^[0-9]+$')]"
refs = ["#7109"]
source = "release-note"

[[change]]
id = "asyncapi-client-messages-walked-by-parser"
category = "experimental"
refs = ["#7163"]
kind = "experimental"
action = "review"
title = "Generated AsyncAPI clients carry the messages the models are generated for"
summary = "With `--generate-client` and AsyncAPI input, a channel carries the messages the parser's walk generates models for: a message value stands for each message its `$ref` and `oneOf` lead to at any depth, so an AsyncAPI 2 `message` whose `oneOf` names a message with its own `oneOf` opens its channel instead of leaving it out with \"declares no payload\". A payload that is a `$ref` beside annotations only (such as a `description`) is typed by the model of the schema it names, as an OpenAPI body is, instead of the payload's own wrapper model. A message `$ref` that loops is read as the message it is written in (\"declares no payload\" instead of \"a message of it references another document\"), and a channel whose messages the walk never reached (a reply channel in another document that no channel lists) is left out with \"the messages at ... were not read\"."
affects = { experimental = ["cli-option.generate-client"] }
before = "SOCKET_0: Final[ChannelPlan[models.FeedTradePayload | models.Quote, Never]]"
after = "SOCKET_0: Final[ChannelPlan[models.Trade | models.Quote, Never]]"
source = "release-note"

[[change]]
id = "asyncapi-client-reads-models-version"
category = "experimental"
refs = ["#7163"]
kind = "experimental"
action = "review"
title = "Generated AsyncAPI clients read channels by the version the models are read by"
summary = "With `--generate-client` and AsyncAPI input, the channels are read by the AsyncAPI version the models are read by: `--schema-version 2.0` or `3.0` where it is given, else the document's `asyncapi` field, which alone was read before. The `publish` operation of an AsyncAPI 2 channel is read before its `subscribe` operation, as the models read them, so the skip reasons of a channel and the union of the events of a stream that carries both list the `publish` ones first."
affects = { experimental = ["cli-option.generate-client"] }
before = "EventPlan[models.StatusSubscribePayload | models.StatusPublishPayload]"
after = "EventPlan[models.StatusPublishPayload | models.StatusSubscribePayload]"
source = "release-note"

[[change]]
id = "connection-reader-through-parser"
category = "experimental"
refs = ["#7136"]
kind = "experimental"
action = "review"
title = "Generated AsyncAPI clients follow references into the other loaded documents"
summary = "With `--generate-client` and AsyncAPI input, a channel, operation, message, trait, binding, parameter, reply, server or security scheme written in another loaded document is read where the parser resolves its `$ref`, so its connection is generated instead of skipped with \"... references another document\" (an operation in another document no longer leaves every channel out). A `#/...` reference inside such a declaration names its own document, and a reference to a server or security scheme names the entry of the root document that leads to the same object (such as `#/servers/socket` in a document whose `socket` server the root imports by `$ref`). A reference to nothing in another loaded document reads as one in the same document does (`it has no address`, `declares no payload`, an empty reply or scheme). A reference into a document the generation did not load (such as a security scheme, the channel of a reply, a trait of an AsyncAPI 2 operation, or a schema `--external-ref-mapping` maps) or one that loops still leaves the channel out."
affects = { experimental = ["cli-option.generate-client"] }
before = "Skipping channel 'notes', which the client cannot generate: /channels/notes: a message of it references another document"
after = "SOCKET_2: Final[ChannelPlan[models.NotePayload, Never]] = ChannelPlan(helper_id='notes', ...)"
source = "release-note"

[[change]]
id = "lazy-public-names-in-dir"
category = "api"
title = "dir() lists every public name a module exports lazily, once"
summary = "Each module with lazy exports answers dir() from the table its __getattr__ reads: the package root, types, util, parser.avro, parser.asyncapi, parser.base, parser.jsonschema and __main__ now list their lazily exported public names, and datamodel_code_generator.reference lists a name read before dir() or __all__ once instead of twice. The plain imports create_module_getattr of types and parser.asyncapi, which only the old hooks used, are gone; import it from datamodel_code_generator.util; star imports of those two modules no longer bind it. inspect.getmembers(), help() and completion on a module with lazy exports now import the modules its lazy names come from."
refs = ["#7154", "#7152"]
decision = ["#7154"]
kind = "python-api"
action = "review"
affects = { python_api = ["dir()", "datamodel_code_generator.types.create_module_getattr", "datamodel_code_generator.parser.asyncapi.create_module_getattr"] }
before = "'StrictTypes' in dir(datamodel_code_generator.types)  # False"
after = "'StrictTypes' in dir(datamodel_code_generator.types)  # True"
source = "release-note"

