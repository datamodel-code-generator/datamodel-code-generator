[[change]]
id = "bug-g116-json-bytes-api"
category = "api"
title = "Name the strict default recipes and whether a model reads JSON bytes as UTF-8 text"
summary = "reads_json_bytes_as_text() of the Pydantic v2 models tells whether validating a model reads bytes from JSON text as the text's UTF-8 bytes: True where the config it applies is known (no configured base class the generator cannot read), as the generator writes no val_json_bytes. DataTypeManager.STRICT_DEFAULT_VALUE_RECIPES and get_strict_default_value_recipe() give the recipe (new DefaultValueRecipe members Bytes, Date, Time and DateTime) of the strict bytes, date, time and datetime types whose JSON value is written as its Python value in a default Pydantic validates; GraphBuilder.set_field_runtime_default() writes such a default with the imports its runtime expressions name. Strict bytes are written as bytes only where a Pydantic v2 model answers True."
refs = ["#7420"]
decision = ["#7420"]
kind = "python-api"
action = "review"
source = "release-note"

[[change]]
id = "bug-g116-strict-string-defaults"
category = "default-fix"
title = "A default Pydantic validates holds the values strict types read from its JSON text"
summary = "With --strict-types bytes, datetime, date, time or a strict Decimal, a field whose type names a model and whose default holds the text or number of a JSON document was written Field(<default>, validate_default=True). Pydantic validates that default as Python input, where strict mode refuses the JSON value, so every instance that left the field out failed. The default is now written as the values Pydantic reads from the JSON default: bytes for a strict bytes, datetime_module.date.fromisoformat(...) and the like for an RFC 3339 date, time or datetime, Decimal(...) for a strict Decimal, through root models, objects, lists, sets, tuples and mappings. validate_default stays, so Pydantic still validates the value; text that is no RFC 3339 date or time, a value under a union of several types, bytes under a configured base class the generator cannot read and an object key the field is not written to read are left as written, so Pydantic reports them as before. Only outputs that failed at every construction without the field change; model_json_schema() shows the default as Pydantic serializes the converted value."
refs = ["#7420", "#7380"]
decision = ["#7420"]
kind = "default-output"
action = "review"
source = "release-note"

[[change]]
id = "client-codec-enum-kinds"
category = "experimental"
title = "Generated dataclass clients decode boolean and number enums inside a union"
summary = "In a union, the dataclasses.dataclass client codec read an enum's JSON kinds from its string and integer values alone, so a boolean or float enum decoded to the raw value and accepted values outside the enum. It now reads the kind of every value: `false` of `enum: [false]` decodes to the member and `true` is refused, as in Pydantic clients. A union of an open number or boolean enum and a plain number or boolean is now refused at generation, as open string and integer enums already were."
kind = "experimental"
action = "review"
source = "release-note"
refs = ["#7014"]
affects = { experimental = ["cli-option.generate-client"] }

[[change]]
id = "client-field-null-arguments"
category = "experimental"
title = "Client field arguments keep the None of a nullable field"
summary = "Field arguments (`--client-body-arguments both`) and the other client and server plans now type a field with the None its model accepts where the schema admits null, also when the null sits on the field rather than in its type: a nullable map with `patternProperties` or `propertyNames`, and OpenAPI 3.0 `nullable: true` references, maps and arrays. `labels: {type: [object, 'null'], patternProperties: ...}` now gives `labels: dict[str, str] | None` where it gave `dict[str, str]`. A union of several part or payload types writes None once, last."
kind = "experimental"
action = "review"
source = "release-note"
refs = ["#7348"]
affects = { experimental = ["cli-option.generate-client"] }

[[change]]
id = "client-wire-null-nullable-false"
category = "experimental"
title = "Helper selectors read the null a field's own type accepts beside nullable: false"
summary = "A helper selector of a generated client read no null for a field declared `nullable: false` whose own type accepts null (`allOf: [{$ref: MaybeText}]`, MaybeText nullable), except through a type alias, so the result depended on --use-type-alias. The models accept null in both forms, so the selector now reads it in both, and a root model's null counts like an alias's: a cursor over such a field needs a `{kind: null}` end condition with and without --use-type-alias."
kind = "experimental"
action = "review"
source = "release-note"
refs = ["#7115"]
affects = { experimental = ["cli-option.generate-client"] }

[[change]]
id = "client-wrapped-union-discriminator"
category = "experimental"
title = "Generated dataclass and TypedDict clients read a nullable discriminated union by its own discriminator"
summary = "A property, array item or map value typed as a discriminated union or null (`anyOf: [{$ref: D}, {type: 'null'}]` with `D` a `oneOf` with a `discriminator`) stopped generation of dataclasses.dataclass and typing.TypedDict clients with 'needs a declared discriminator'. The codec now reads each model by the discriminator of the union it comes from, as it already did for `D` alone; several such unions join their declarations when they share the property."
kind = "experimental"
action = "review"
source = "release-note"
refs = ["#7303"]
affects = { experimental = ["cli-option.generate-client"] }

[[change]]
id = "held-resources-generation-warnings"
category = "notice"
title = "Warnings of a run that reads a held schema where its URL loads nothing"
summary = "A run that failed on the read of a URL another document of the run declares now generates, so it shows the warnings of the generation it reaches, such as the notice that Black and isort become optional and the warnings of references resolved for compatibility, and a modular result written to standard output stops with the message that it needs an output directory."
refs = ["#7159", "#6999"]
kind = "warning"
action = "none"
source = "release-note"

[[change]]
id = "held-resources-read-where-their-url-loads-nothing"
category = "crash-fix"
kind = "default-output"
action = "none"
source = "release-note"
title = "Read a held schema where the URL that names it loads nothing"
summary = "A reference to a URL that another document of the run declares (an embedded OpenAPI component $id, the root $id of a sibling input, a local document a remote one refers back to) reads that schema where reading the URL fails, instead of exiting with an HTTP or store error; a local document entered from a remote one resolves its references from its own location. A URL that serves a document is still read, as in 0.100.0."
refs = ["#7159", "#6999"]
decision = ["#7159", "#6999"]

[[change]]
id = "input-model-unserializable-fields-of-held-classes"
category = "default-fix"
title = "--input-model keeps the Python type of an unserializable field in every held class"
summary = "A field JSON Schema cannot express, such as a Callable, kept its Python type (callback: Callable[[int], int]) only in a Pydantic model; in a dataclass, TypedDict, Pydantic dataclass or RootModel that the model holds it became str, which refused every valid value, and with --field-include-all-keys the id() of a schema reached the output as x-python-unserializable, a different number on every run. The field now keeps its type, found by the class the schema generation recorded for the definition, so two same-named classes keep their own fields. Class and field names stay."
refs = ["#7433", "#6885"]
decision = ["#7433"]
kind = "default-output"
action = "review"
source = "release-note"

