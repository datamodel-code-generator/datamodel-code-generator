[[change]]
id = "variant-tags-that-admit-null"
category = "default-fix"
kind = "default-output"
action = "review"
source = "release-note"
title = "Discriminated variants whose tag also admits null"
summary = "A union that writes discriminator= over a variant whose tag field admits None is written without it, as Pydantic reads no such tag and the module failed to import (#7102); a null in the variant's enum is no tag, so it takes the enum's values instead of its schema name or, inline, the internal path marker (#7357), and an inline msgspec variant of several values takes them in its tag field and stays untagged. Variant classes keep their names, fields and the null their schema admits."
refs = ["#7405", "#7102", "#7357"]
decision = ["#7405"]
