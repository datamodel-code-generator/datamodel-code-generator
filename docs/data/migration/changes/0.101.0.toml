# The changes of 0.101.0, moved from docs/data/migration/unreleased/ when the release was stamped.

[[change]]
id = "allof-enum-member-root-enum-class"
category = "default-fix"
kind = "default-output"
action = "review"
source = "release-note"
title = "A named allOf whose merged root is an enum class is written as that enum"
summary = "A named allOf of an untyped constraint $ref and a typed enum member, such as allOf: [{$ref: ThreeLetters}, {type: string, enum: [GBP, JPY]}], stopped with \"a $ref chain that loops back\" for Pydantic and msgspec output, and under --collapse-root-models and the presets wrote a field or a root model that accepted no value of the enum; it is now written as its enum class, which accepts the values of the enum. Standard dataclasses keep Any without --intersect-merged-allof-members."
refs = ["#7399", "#7314"]
decision = ["#7314"]

