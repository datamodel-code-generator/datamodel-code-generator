[[change]]
id = "asyncapi-handshake-model-defaults"
category = "experimental"
title = "AsyncAPI handshake parameters take the default of their model field"
summary = "A WebSocket handshake query or header parameter of a generated AsyncAPI client took the default at the end of its whole `$ref` chain, while the models take a referenced default one reference deep. The parameter now takes the default of its model field, so both agree: two references deep, or under --collapse-root-models or --ignore-ref-siblings-by-schema-version, the argument has no default where the model field has none."
kind = "experimental"
action = "review"
source = "release-note"
refs = ["#6975"]
affects = { experimental = ["cli-option.generate-client"] }

[[change]]
id = "asyncapi-multi-format-schema-references"
category = "experimental"
title = "A reference to a component Multi Format Schema Object names the schema it holds"
summary = "A payload, headers or component $ref to a Multi Format Schema Object in components.schemas, also through component aliases, is typed by the JSON Schema the object holds: the RootModel[Any] read from the wrapper (NoteModel) is gone, the payload, headers and alias classes are root models over the held model, and the held model takes the component's name where the wrapper took it before (Tag1 is Tag)."
refs = ["#6936"]
decision = ["#6936"]
kind = "experimental"
action = "review"
source = "release-note"
affects = { experimental = ["input-format.asyncapi"] }

