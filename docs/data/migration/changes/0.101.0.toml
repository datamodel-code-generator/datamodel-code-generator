[[change]]
id = "reuse-same-named-input-model-classes"
category = "default-fix"
title = "--input-model reuse imports the class a definition comes from"
summary = "With `--input-model-ref-strategy reuse-all` or `reuse-foreign`, a field whose type is one class (`item: Item` of `shop.Item`) was typed by another class of that name that the model's fields also name, such as `type[legacy.Item]` or a nested `Legacy.Item` (`item: legacy.Item`), which refused every valid value. It is now typed by its own class (`from shop import Item`), also for a dataclass or TypedDict input and for the fields of a parent model; this is the output of 0.75.0. Every imported name keeps the class it named in 0.100.0 (here `Item` is `shop.Item` and `Item1` is `legacy.Item`), so `from <generated module> import Item` is unchanged. Class and field names stay; schema-valid documents that were refused now validate. Code that passed an object of the other class (a `legacy.Item`) to such a field, against the schema, is now refused."
refs = ["#7390", "#6883"]
decision = ["#7390"]
kind = "default-output"
action = "review"
source = "release-note"

