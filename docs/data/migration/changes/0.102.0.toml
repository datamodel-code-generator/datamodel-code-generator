# The changes of 0.102.0, moved from docs/data/migration/unreleased/ when the release was stamped.

[[change]]
id = "all-exports-import-from-loaded-submodule-other-backends"
category = "default-fix"
kind = "default-output"
action = "review"
source = "release-note"
title = "A package class beside a same-named submodule no longer binds the class name through the import of the submodule's models"
summary = "In dataclass, msgspec and TypedDict output the modules that use a model of the submodule now import it from the submodule, so they no longer bind the class name of the package (from .pkg import Warn) through that import. They read the class through it, and resolving their annotations (type hints, msgspec decoding) failed."
refs = ["#7444"]
decision = ["#7120"]

[[change]]
id = "all-exports-import-from-loaded-submodule"
category = "crash-fix"
kind = "default-output"
action = "none"
source = "release-note"
title = "A package class beside a same-named submodule that its __init__.py loads first no longer hides the submodule's models"
summary = "Where a package's __init__.py loads a submodule while its imports run (--all-exports-scope re-exports it, or a module it imports loads it) and also defines a class of the submodule's name, the modules that use a model of the submodule now import it from the submodule, as the output already did where the __init__.py names a type of the submodule. They read the class through the package: a Pydantic module failed at import with AttributeError, and the other backends failed where the annotations are resolved (type hints, msgspec decoding). They no longer bind the class name through that import."
refs = ["#7444"]

