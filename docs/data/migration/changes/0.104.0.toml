# The changes of 0.104.0, moved from docs/data/migration/unreleased/ when the release was stamped.

[[change]]
id = "alias-import-shadowed-by-inherited-dataclass-field"
category = "crash-fix"
title = "A pydantic dataclass that redeclares an inherited field aliases the import its base's field name shadows"
summary = "A pydantic dataclass that redeclared a field of its base, in a module whose annotations are strings, failed to import when the annotation loaded a name that the base's class body binds to a field's default, such as user.Address next to the base's field user, date next to a field date, or str next to a field str: pydantic evaluates the annotation in the base's class body and raised a TypeError or an AttributeError. The module now aliases that import as it already did for the fields of the class itself (from . import user as user_aliased, from datetime import date as date_aliased, from builtins import str as str_aliased) and the annotation names the alias. Only modules that failed to import change; class names, field names, bases, field order and parsed values are the same."
refs = ["#7594", "#7561"]
decision = ["#7594"]
kind = "default-output"
action = "none"
source = "release-note"

[[change]]
id = "client-tools-codemode"
category = "experimental"
title = "Result budgets, meta tools, a catalog and tool: false for --client-tools"
summary = "The tool table gains catalog() and an opt-in max_result_bytes budget, the MCP server an opt-in meta-tool mode (search_tools, get_tool_schema, call_tool) and --max-result-bytes and --meta-tools, and --client-operations a tool member that leaves an operation out of the tools; calls without the new arguments behave as before. Under --untrusted-input the entries of search, search_tools and catalog() no longer list the tags of the document, which changes the output of search from the first release of the tools; a search still ranks and filters by them, and nothing changes without that option."
refs = ["#7551"]
decision = ["#7551"]
kind = "experimental"
action = "none"
source = "release-note"
affects = { experimental = ["cli-option.client-tools"] }

[[change]]
id = "dataclass-annotation-namespaces-hook"
category = "api"
title = "Model hook that names the class bodies a model's annotations are evaluated in"
summary = "DataModel.annotation_namespaces returns, by field name, the generated bases whose namespace evaluates the annotation of one of the model's class body fields; the ClassVar DataModel.EVALUATES_ANNOTATIONS_IN_BASES (True on the Pydantic dataclass model, False elsewhere) switches it on, so the generated module can alias an import that such a base's class body hides. Nothing is removed or changed."
refs = ["#7594", "#7561"]
decision = ["#7594"]
source = "release-note"
kind = "python-api"
action = "review"
affects = { python_api = ["datamodel_code_generator.model.base.DataModel", "datamodel_code_generator.model.pydantic_v2.dataclass.DataClass"] }

[[change]]
id = "dataclass-subclass-inherited-patterns-python-re-rejects-warning"
category = "notice"
kind = "warning"
action = "warn"
title = "A pydantic dataclass that redeclares an inherited field of another module or a type alias without a pattern Python's re rejects warns"
summary = "Where a pydantic_v2.dataclass selects python-re for a look-around pattern of a base, it now also redeclares the fields of bases in other modules, and the fields whose type alias holds a pattern Python's re rejects, such as \\p{L}, without that pattern, and warns that the field is generated without the constraint, as it does for the fields of the bases of its module. Such a module failed at import before."
refs = ["#7563", "#7487"]
source = "release-note"

[[change]]
id = "dataclass-subclass-inherited-patterns-python-re-rejects"
category = "crash-fix"
title = "A pydantic dataclass that builds inherited patterns with python-re imports when the patterns sit in another module or a type alias"
summary = "A pydantic_v2.dataclass that selects regex_engine python-re for a lookaround of a base redeclares each inherited field whose pattern Python's re rejects without that pattern, and warns. Fields of a base in another module, and fields whose type alias holds the pattern, were not redeclared, so the module failed at import with re.error: bad escape \\p; such a module now imports, naming the models that the copies and the alias bodies they write name from its own module. A dataclass that takes an alias_generator from the config of a base in another module now imports it instead of failing with NameError."
refs = ["#7563", "#7487", "#7548"]
kind = "default-output"
action = "none"
source = "release-note"

