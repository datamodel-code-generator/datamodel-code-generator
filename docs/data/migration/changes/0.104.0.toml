[[change]]
id = "forwarded-class-submodule-read-outside-cycle"
category = "default-fix"
title = "A module outside an import cycle imports the models of a submodule that its package's forwarded class hides"
summary = "Where an import cycle merge moves a class into _internal.py and the package __init__.py only re-exports it (from ._internal import Warn), and _internal.py loads the submodule of the same name (pkg/Warn.py) while the __init__.py runs, a module that runs after the package wrote from . import Warn with Warn.Detail, which read the class: the module failed to import with AttributeError, and with dataclasses, msgspec or TypedDict every decode or get_type_hints failed. Such a module now imports the model from the submodule (from .Warn import Detail), as --use-exact-imports does and as 0.89.0 does for a package __init__.py that defines the class. Only those modules change; a module the package loads while it runs keeps its import, and the module attribute report.Warn, which only the import bound, goes away."
refs = ["#7575", "#7443"]
decision = ["#7575"]
kind = "default-output"
action = "review"
source = "release-note"

[[change]]
id = "generation-store-records-hint-body-types"
category = "api"
title = "Store operation that records the types a field's hint names from type alias bodies"
summary = "GenerationStore.record_hint_body_types (with GraphBuilder.record_hint_body_types) records, on a field, its own copies of the types naming a model that its hint writes from type alias bodies, so the module imports them. Nothing is removed or changed."
refs = ["#7563", "#7487"]
decision = ["#7563"]
source = "release-note"
kind = "python-api"
action = "review"
affects = { python_api = ["datamodel_code_generator.parser.generation.GenerationStore", "datamodel_code_generator.parser.generation.GraphBuilder"] }

[[change]]
id = "generic-base-class-leaves-out-dataclass-config-warning"
category = "notice"
kind = "warning"
action = "warn"
title = "A pydantic dataclass run with --use-generic-base-class warns about the model configuration it leaves out"
summary = "--use-generic-base-class writes the run's model configuration (--extra-fields, --allow-extra-fields, --allow-population-by-field-name, --use-attribute-docstrings, a preset that sets one of them) on a shared base class. pydantic_v2.dataclass has no such base class and writes the configuration on each class, so with the flag it wrote none of it. The run now warns, naming the ConfigDict items left out; the generated modules are unchanged. Run without --use-generic-base-class to write the items on each class, or turn warnings into errors with -W error to find such runs."
refs = ["#7588", "#7549"]
source = "release-note"

[[change]]
id = "generic-base-class-library-base-field"
category = "default-fix"
title = "--use-generic-base-class imports a field typed pydantic.BaseModel or msgspec.Struct"
summary = "With --use-generic-base-class, a field whose x-python-type names the class the generated base class inherits (pydantic.BaseModel, msgspec.Struct) imported it as _BaseModel_aliased while the generated base class kept naming _BaseModel, which nothing bound, so the module failed with NameError; beside a kept --base-class class named _BaseModel it failed with a TypeError on the method resolution order, and with --generate-schema-validators the helper class came before the generated base class. The import, the field and the generated base class now name one binding: from pydantic import BaseModel as _BaseModel and x: _BaseModel | None, or BaseModel_1 and _BaseModel_aliased where another import takes _BaseModel. A dropped --base-class class named _BaseModel keeps the released output. As the inheritance check now knows what the generated base class inherits, generated bases whose method resolution orders conflict are rejected with the error the same input gives without --use-generic-base-class, and the run writes no module; before, the module with the conflict was written and failed to import with a TypeError, and the modules beside it were written too."
refs = ["#7577", "#7437"]
decision = ["#7577"]
kind = "default-output"
action = "review"
source = "release-note"

