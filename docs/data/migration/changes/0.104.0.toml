[[change]]
id = "msgspec-restated-keyword-only-fields"
category = "crash-fix"
title = "A msgspec struct that declares again a field its keyword-only parent declares again imports"
summary = "A msgspec struct whose parent is written kw_only=True and declares again a required field of its own base, and which declares that field again itself, is now written kw_only=True too. msgspec puts the parent's keyword-only fields last, so the field followed the defaults the struct inherits, and the module failed at import with TypeError: Required field cannot follow optional fields."
refs = ["#7550", "#7478"]
kind = "default-output"
action = "none"
source = "release-note"

[[change]]
id = "same-named-files-in-path-order"
category = "decided-change"
title = "Files with the same name in different subdirectories of a directory input are read in path order"
summary = "Files with the same name in different subdirectories of a directory input are now read in path order. Before, their order came from the file system, so numbered class names such as Status1 and Status2 could differ between machines or CI runner images. If you generate from such a directory, regenerate once: some numbered names may swap; after that they are the same everywhere. Directory inputs whose files all have different names are read as before. The file that settles the input type of a directory, when the type is not given, is the first of the shallowest files in the same order, so a single top-level file decides as before."
kind = "default-output"
action = "review"
source = "release-note"
keep = { note = "No option restores the file system order: it was not the same on two machines." }
refs = ["#7564", "#7552"]
decision = ["#7552"]
