# The changes of 0.98.0, moved from docs/data/migration/unreleased/ when the release was stamped.

[[change]]
id = "annotated-model-default-cast"
category = "output-text"
kind = "output-text"
action = "none"
title = "`--use-annotated` casts a model field's default to the field's type"
summary = "Under `--use-annotated`, a field whose type holds a model or a root model, which Pydantic validates its default into (`validate_default=True`), was assigned the schema default as it is in the class body: an object or an array for a model, a list or dict of objects for a list or dict of models, an object for a union of models, a number or string for a root model such as a constrained `integer`, or a string for a union of a model with a format such as a URL or a date. mypy (with the Pydantic plugin) and pyright expect the field's type there, so both reported the assignment. Such a value is now written as `cast('<the field type>', <value>)`, and the module imports `cast` from `typing`. Pydantic still validates the value at instantiation (`validate_default=True` is unchanged), so the models behave as before: the same values, the same JSON Schema defaults, the same error for a default the model rejects. A default the type already takes, such as an empty list for a list of models, a string for a union with `str` or enum members for a list of enums (`--set-default-enum-member`), is written as before."
affects = { output_model_types = ["pydantic_v2.BaseModel"], options = ["--use-annotated"] }
before = "flags: Annotated[Flags | None, Field(validate_default=True)] = {'enabled': False}"
after = "flags: Annotated[Flags | None, Field(validate_default=True)] = cast('Flags | None', {'enabled': False})"
refs = ["#7016"]
source = "release-note"

[[change]]
id = "client-fields-follow-the-constructor"
category = "experimental"
kind = "experimental"
action = "review"
title = "Generated clients take a body field as required exactly where the model's constructor requires it"
summary = "With `--generate-client` and `--strip-default-none`, a property the schema leaves optional whose Pydantic model field has no default (`tag: str | None`) is a required field argument of the call that sends the body (`tag: str`, README `tag (required)`, `FieldArguments` flag true): `create_pet(id=1)` raises `TypeError: create_pet() missing required field arguments for application/json: 'tag'` before any request, where it raised `DecodeError(reason='unencodable')` from the model. A property whose schema type includes null (OpenAPI 3.1 `type: [string, \"null\"]`) keeps its `= None` default and stays optional; an OpenAPI 3.0 `nullable: true` property, which the model writes without a default, becomes required like the others. The same holds for the `pydantic_v2.dataclass` output: an OpenAPI 3.0 optional `nullable: true` property with `default: null` under `--strip-default-none` becomes required (the class writes `dn: str | None` without a default). A required property marked `x-is-classvar` (`--field-include-all-keys`) becomes optional in the `pydantic_v2.BaseModel` and `pydantic_v2.dataclass` outputs, because a `ClassVar` is not a constructor argument. An AsyncAPI channel whose messages are told apart by such a property (`kind: {const: join}`, optional) routes received messages by it (`MessageRoute(..., tag='join')`) instead of decoding them as the union of the messages' models: a message without it is refused as `missing` instead of `value`, and a message whose `kind` is null, which the union decoder accepted as the first member, is refused with reason `null`. Server-sent event streams under `--strip-default-none --force-optional` route events by the body tag (`BodySelector(pointer=\"/type\")`) instead of one union codec. The other backends already followed their classes."
affects = { experimental = ["cli-option.generate-client"] }
before = "tag: str | UNSET = UNSET,"
after = "tag: str,"
refs = ["#7069"]
source = "release-note"

[[change]]
id = "client-name-collision-report"
category = "experimental"
kind = "experimental"
action = "review"
title = "Generated clients report a name that explicit names take twice once, sorted, as servers do"
summary = "With `--generate-client`, explicit argument names (`parameter_names`, `--aliases`), method names (`name` of `--client-operations`, sorted within each resource) or the `resource` of channel settings that take one name three or more times report it once instead of once per repeat, and several such names are reported in sorted order after the reserved-name and `--aliases` diagnostics of the operation's parameters (`The arguments of GET /items take 'b' twice; ... take 'a' twice` becomes `... take 'a' twice; ... take 'b' twice`); the \"names no parameter\" error still follows them. An explicit method name that is a reserved member name (`close`) taken twice is reported as reserved only, without the collision line. Servers already reported collisions this way."
affects = { experimental = ["cli-option.generate-client"] }
refs = ["#6979"]
source = "release-note"

[[change]]
id = "client-tags-follow-the-model"
category = "experimental"
kind = "experimental"
action = "review"
title = "Generated clients select a union's variant by the tags its model holds"
summary = "With `--generate-client` and the `dataclasses.dataclass` or `typing.TypedDict` output, a union with a `discriminator`, in an OpenAPI body or an AsyncAPI message payload, selects each variant by the tags the model reads for it: its own tag field (a `const`, a one-value `Literal` or a one-member enum, whose value is a string, an integer or a boolean: a variant whose tag field holds any other value, such as an object, an array, `null` or a fraction, gets no tag from it), else the mapping keys read as the tag property's type, else its schema name. A union told apart by integers or booleans (`kind: {type: integer, const: 1}`, mapping keys `\"1\"` over an `integer` property, `const: true`) or by one-member enums (under `--use-enum-values-in-discriminator`, or with the TypedDict output) was matched by schema names, or by the mapping keys as text: every schema-valid payload raised `DecodeError(reason='invalid_value')` and, except with mapping keys, `{\"kind\": \"Cat\"}` decoded as `Cat`. Each payload now decodes to its variant and `{\"kind\": \"Cat\"}` is refused. Tags are matched by JSON kind and value, in decoding and in encoding a body of the TypedDict output: `1` and `true` never select each other's variant, and an `Enum` member selects the variant its value tags. The `Choice` of the copied runtime (`client/_runtime/model_codecs/stdlib_dataclasses.py`, `stdlib_typeddicts.py`) takes such tags: `tags: tuple[tuple[str | int | bool, type], ...]`. With `--collapse-root-models`, a TypedDict union whose variants share one enum for the tag property and are named by a mapping is generated instead of refused with \"The discriminator version gives v1 to two union models\". A TypedDict variant whose own tag field admits several values (`kind: {type: string, enum: [cat, kitty]}`) is told apart, as in the dataclass and Pydantic outputs, by the mapping keys that name it, else by the values of its field that no other variant claims (`variant-tag-values-of-their-field`): without a mapping `{\"kind\": \"cat\"}` and `{\"kind\": \"kitty\"}` decode and `{\"kind\": \"Cat\"}` is refused, and with the mapping `cat: Cat` `{\"kind\": \"kitty\"}` is refused unless `--use-unmapped-variant-tag-values` is given. The Pydantic and msgspec outputs decode through their models. Integer mapping keys over an integer enum select their variants with the dataclass output under `--use-enum-values-in-discriminator` (#7083) and with the TypedDict output for an enum the variants share (#7084)."
affects = { experimental = ["cli-option.generate-client"] }
refs = ["#7082", "#7083", "#7084"]
before = "Choice((), 'kind', (('Cat', models.Cat), ('Dog', models.Dog)))"
after = "Choice((), 'kind', ((1, models.Cat), (2, models.Dog)))"
source = "release-note"

